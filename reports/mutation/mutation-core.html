in response"},{"id":"288","name":"generateQuestions schema validation should reject question missing question text"},{"id":"289","name":"generateQuestions schema validation should reject question with wrong number of options"},{"id":"290","name":"generateQuestions schema validation should reject question with invalid correct index"},{"id":"291","name":"generateQuestions schema validation should reject question with string correct value"},{"id":"292","name":"generateQuestions schema validation should accept valid quiz with all required fields"},{"id":"293","name":"generateExplanation retry logic should succeed on first attempt when response is valid"},{"id":"294","name":"generateExplanation retry logic should retry with stricter prompt on parse failure"},{"id":"295","name":"generateExplanation retry logic should retry on schema validation failure"},{"id":"296","name":"generateExplanation retry logic should NOT retry on rate limit error"},{"id":"297","name":"generateExplanation retry logic should fail after max retry attempts"},{"id":"298","name":"generateExplanation retry logic should handle DeepSeek thinking tags in response"},{"id":"299","name":"generateExplanation schema validation should reject response missing rightAnswerExplanation"},{"id":"300","name":"generateExplanation schema validation should reject response missing wrongAnswerExplanation"},{"id":"301","name":"generateExplanation schema validation should reject empty rightAnswerExplanation"},{"id":"302","name":"generateExplanation schema validation should reject empty wrongAnswerExplanation"},{"id":"303","name":"generateExplanation schema validation should accept valid explanation with all required fields"}],"source":"import { describe, it, expect, vi, beforeEach } from 'vitest';\r\n\r\n// Mock the dependencies before importing the module\r\nvi.mock('./openrouter-client.js', () => ({\r\n  callOpenRouter: vi.fn()\r\n}));\r\n\r\nvi.mock('../utils/logger.js', () => ({\r\n  logger: {\r\n    debug: vi.fn(),\r\n    warn: vi.fn(),\r\n    error: vi.fn(),\r\n    perf: vi.fn()\r\n  }\r\n}));\r\n\r\nimport { generateQuestions, generateExplanation } from './api.real.js';\r\nimport { callOpenRouter } from './openrouter-client.js';\r\n\r\n// Helper to generate mock questions of a specific count\r\nfunction generateMockQuestions(count) {\r\n  return Array.from({ length: count }, (_, i) => ({\r\n    question: `Q${i + 1}?`,\r\n    options: ['A', 'B', 'C', 'D'],\r\n    correct: i % 4,\r\n    difficulty: ['easy', 'medium', 'challenging'][i % 3]\r\n  }));\r\n}\r\n\r\ndescribe('generateQuestions prompt', () => {\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  it('should include guidance for distinct answer options', async () => {\r\n    // Arrange: Mock the API to capture the prompt\r\n    let capturedPrompt = '';\r\n    callOpenRouter.mockImplementation(async (apiKey, prompt) => {\r\n      capturedPrompt = prompt;\r\n      return {\r\n        text: JSON.stringify({\r\n          language: 'EN-US',\r\n          questions: [\r\n            { question: 'Q1?', options: ['A', 'B', 'C', 'D'], correct: 0, difficulty: 'easy' },\r\n            { question: 'Q2?', options: ['A', 'B', 'C', 'D'], correct: 1, difficulty: 'easy' },\r\n            { question: 'Q3?', options: ['A', 'B', 'C', 'D'], correct: 2, difficulty: 'medium' },\r\n            { question: 'Q4?', options: ['A', 'B', 'C', 'D'], correct: 3, difficulty: 'medium' },\r\n            { question: 'Q5?', options: ['A', 'B', 'C', 'D'], correct: 0, difficulty: 'challenging' }\r\n          ]\r\n        })\r\n      };\r\n    });\r\n\r\n    // Act: Call the function\r\n    await generateQuestions('Test Topic', 'middle school', 'fake-api-key');\r\n\r\n    // Assert: Check that the prompt contains guidance for distinct options\r\n    expect(capturedPrompt).toContain('DISTINCT');\r\n    expect(capturedPrompt).toMatch(/logical.*inverse|inverse.*logical/i);\r\n    expect(capturedPrompt).toMatch(/factually incorrect|genuinely incorrect/i);\r\n  });\r\n\r\n  it('should include previous questions in prompt when provided', async () => {\r\n    // Arrange: Mock the API to capture the prompt\r\n    let capturedPrompt = '';\r\n    callOpenRouter.mockImplementation(async (apiKey, prompt) => {\r\n      capturedPrompt = prompt;\r\n      return {\r\n        text: JSON.stringify({\r\n          language: 'EN-US',\r\n          questions: [\r\n            { question: 'Q1?', options: ['A', 'B', 'C', 'D'], correct: 0, difficulty: 'easy' },\r\n            { question: 'Q2?', options: ['A', 'B', 'C', 'D'], correct: 1, difficulty: 'easy' },\r\n            { question: 'Q3?', options: ['A', 'B', 'C', 'D'], correct: 2, difficulty: 'medium' },\r\n            { question: 'Q4?', options: ['A', 'B', 'C', 'D'], correct: 3, difficulty: 'medium' },\r\n            { question: 'Q5?', options: ['A', 'B', 'C', 'D'], correct: 0, difficulty: 'challenging' }\r\n          ]\r\n        })\r\n      };\r\n    });\r\n\r\n    // Act: Call with previous questions\r\n    const previousQuestions = [\r\n      'What is the capital of France?',\r\n      'Who wrote Romeo and Juliet?'\r\n    ];\r\n    await generateQuestions('Test Topic', 'middle school', 'fake-api-key', { previousQuestions });\r\n\r\n    // Assert: Check that previous questions are included\r\n    expect(capturedPrompt).toContain('AVOID DUPLICATE QUESTIONS');\r\n    expect(capturedPrompt).toContain('What is the capital of France?');\r\n    expect(capturedPrompt).toContain('Who wrote Romeo and Juliet?');\r\n  });\r\n\r\n  it('should not include exclusion section when no previous questions', async () => {\r\n    // Arrange: Mock the API to capture the prompt\r\n    let capturedPrompt = '';\r\n    callOpenRouter.mockImplementation(async (apiKey, prompt) => {\r\n      capturedPrompt = prompt;\r\n      return {\r\n        text: JSON.stringify({\r\n          language: 'EN-US',\r\n          questions: [\r\n            { question: 'Q1?', options: ['A', 'B', 'C', 'D'], correct: 0, difficulty: 'easy' },\r\n            { question: 'Q2?', options: ['A', 'B', 'C', 'D'], correct: 1, difficulty: 'easy' },\r\n            { question: 'Q3?', options: ['A', 'B', 'C', 'D'], correct: 2, difficulty: 'medium' },\r\n            { question: 'Q4?', options: ['A', 'B', 'C', 'D'], correct: 3, difficulty: 'medium' },\r\n            { question: 'Q5?', options: ['A', 'B', 'C', 'D'], correct: 0, difficulty: 'challenging' }\r\n          ]\r\n        })\r\n      };\r\n    });\r\n\r\n    // Act: Call without previous questions\r\n    await generateQuestions('Test Topic', 'middle school', 'fake-api-key');\r\n\r\n    // Assert: Exclusion section should not be present\r\n    expect(capturedPrompt).not.toContain('AVOID DUPLICATE QUESTIONS');\r\n  });\r\n\r\n  it('should use default questionCount of 5 in prompt', async () => {\r\n    let capturedPrompt = '';\r\n    callOpenRouter.mockImplementation(async (apiKey, prompt) => {\r\n      capturedPrompt = prompt;\r\n      return {\r\n        text: JSON.stringify({\r\n          language: 'EN-US',\r\n          questions: generateMockQuestions(5)\r\n        })\r\n      };\r\n    });\r\n\r\n    await generateQuestions('Test Topic', 'middle school', 'fake-api-key');\r\n\r\n    expect(capturedPrompt).toContain('Generate exactly 5');\r\n  });\r\n\r\n  it('should use custom questionCount in prompt', async () => {\r\n    let capturedPrompt = '';\r\n    callOpenRouter.mockImplementation(async (apiKey, prompt) => {\r\n      capturedPrompt = prompt;\r\n      return {\r\n        text: JSON.stringify({\r\n          language: 'EN-US',\r\n          questions: generateMockQuestions(10)\r\n        })\r\n      };\r\n    });\r\n\r\n    await generateQuestions('Test Topic', 'middle school', 'fake-api-key', { questionCount: 10 });\r\n\r\n    expect(capturedPrompt).toContain('Generate exactly 10');\r\n  });\r\n\r\n  it('should validate response has correct number of questions', async () => {\r\n    callOpenRouter.mockImplementation(async () => {\r\n      return {\r\n        text: JSON.stringify({\r\n          language: 'EN-US',\r\n          questions: generateMockQuestions(3) // Wrong count\r\n        })\r\n      };\r\n    });\r\n\r\n    await expect(\r\n      generateQuestions('Test Topic', 'middle school', 'fake-api-key', { questionCount: 5 })\r\n    ).rejects.toThrow('Expected 5 questions, got 3');\r\n  });\r\n\r\n  it('should accept response with matching questionCount', async () => {\r\n    callOpenRouter.mockImplementation(async () => {\r\n      return {\r\n        text: JSON.stringify({\r\n          language: 'EN-US',\r\n          questions: generateMockQuestions(15)\r\n        })\r\n      };\r\n    });\r\n\r\n    const result = await generateQuestions('Test Topic', 'middle school', 'fake-api-key', { questionCount: 15 });\r\n\r\n    expect(result.questions).toHaveLength(15);\r\n  });\r\n});\r\n\r\ndescribe('generateExplanation JSON parsing', () => {\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  const validExplanation = {\r\n    rightAnswerExplanation: 'Paris is the capital of France.',\r\n    wrongAnswerExplanation: 'London is the capital of the UK, not France.'\r\n  };\r\n\r\n  it('should parse clean JSON response', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify(validExplanation)\r\n    });\r\n\r\n    const result = await generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-api-key');\r\n\r\n    expect(result.rightAnswerExplanation).toBe(validExplanation.rightAnswerExplanation);\r\n    expect(result.wrongAnswerExplanation).toBe(validExplanation.wrongAnswerExplanation);\r\n  });\r\n\r\n  it('should parse JSON wrapped in markdown code block', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: '```json\\n' + JSON.stringify(validExplanation) + '\\n```'\r\n    });\r\n\r\n    const result = await generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-api-key');\r\n\r\n    expect(result.rightAnswerExplanation).toBe(validExplanation.rightAnswerExplanation);\r\n    expect(result.wrongAnswerExplanation).toBe(validExplanation.wrongAnswerExplanation);\r\n  });\r\n\r\n  it('should parse JSON with leading/trailing whitespace', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: '  \\n\\n' + JSON.stringify(validExplanation) + '\\n\\n  '\r\n    });\r\n\r\n    const result = await generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-api-key');\r\n\r\n    expect(result.rightAnswerExplanation).toBe(validExplanation.rightAnswerExplanation);\r\n    expect(result.wrongAnswerExplanation).toBe(validExplanation.wrongAnswerExplanation);\r\n  });\r\n\r\n  it('should parse JSON with smart quotes by normalizing them', async () => {\r\n    // This test documents the bug - smart quotes cause JSON.parse to fail\r\n    // The current fallback returns raw JSON as rightAnswerExplanation\r\n    const jsonWithSmartQuotes = '{ \"rightAnswerExplanation\": \"Paris is correct.\", \"wrongAnswerExplanation\": \"London is wrong.\" }';\r\n\r\n    callOpenRouter.mockResolvedValue({\r\n      text: jsonWithSmartQuotes\r\n    });\r\n\r\n    const result = await generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-api-key');\r\n\r\n    // BUG: Should parse the content, not return raw JSON\r\n    // Current behavior returns the raw JSON string as rightAnswerExplanation\r\n    expect(result.rightAnswerExplanation).not.toContain('{');\r\n    expect(result.rightAnswerExplanation).not.toContain('\"rightAnswerExplanation\"');\r\n    expect(result.rightAnswerExplanation).toBe('Paris is correct.');\r\n    expect(result.wrongAnswerExplanation).toBe('London is wrong.');\r\n  });\r\n\r\n  it('should parse JSON with extra text before it', async () => {\r\n    // Some LLMs add conversational text before the JSON\r\n    callOpenRouter.mockResolvedValue({\r\n      text: 'Here is the explanation:\\n' + JSON.stringify(validExplanation)\r\n    });\r\n\r\n    const result = await generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-api-key');\r\n\r\n    // BUG: Should extract and parse the JSON\r\n    expect(result.rightAnswerExplanation).not.toContain('{');\r\n    expect(result.rightAnswerExplanation).toBe(validExplanation.rightAnswerExplanation);\r\n    expect(result.wrongAnswerExplanation).toBe(validExplanation.wrongAnswerExplanation);\r\n  });\r\n\r\n  it('should parse JSON with extra text after it', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify(validExplanation) + '\\n\\nI hope this helps!'\r\n    });\r\n\r\n    const result = await generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-api-key');\r\n\r\n    // BUG: Should extract and parse the JSON\r\n    expect(result.rightAnswerExplanation).not.toContain('{');\r\n    expect(result.rightAnswerExplanation).toBe(validExplanation.rightAnswerExplanation);\r\n    expect(result.wrongAnswerExplanation).toBe(validExplanation.wrongAnswerExplanation);\r\n  });\r\n\r\n  it('should handle JSON with BOM character', async () => {\r\n    // BOM (Byte Order Mark) can appear at the start of some text\r\n    const BOM = '\\uFEFF';\r\n    callOpenRouter.mockResolvedValue({\r\n      text: BOM + JSON.stringify(validExplanation)\r\n    });\r\n\r\n    const result = await generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-api-key');\r\n\r\n    expect(result.rightAnswerExplanation).not.toContain('{');\r\n    expect(result.rightAnswerExplanation).toBe(validExplanation.rightAnswerExplanation);\r\n  });\r\n});\r\n\r\ndescribe('generateQuestions retry logic', () => {\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  // Helper to generate valid mock questions\r\n  function generateValidQuestions(count = 5) {\r\n    return Array.from({ length: count }, (_, i) => ({\r\n      question: `Question ${i + 1}?`,\r\n      options: ['A) opt1', 'B) opt2', 'C) opt3', 'D) opt4'],\r\n      correct: i % 4,\r\n      difficulty: 'easy'\r\n    }));\r\n  }\r\n\r\n  it('should succeed on first attempt when response is valid', async () => {\r\n    callOpenRouter.mockResolvedValueOnce({\r\n      text: JSON.stringify({ language: 'en', questions: generateValidQuestions(5) }),\r\n      model: 'test-model',\r\n      usage: { promptTokens: 100, completionTokens: 200, totalTokens: 300 }\r\n    });\r\n\r\n    const result = await generateQuestions('Test', 'middle school', 'fake-key');\r\n\r\n    expect(result.questions).toHaveLength(5);\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(1);\r\n  });\r\n\r\n  it('should retry with stricter prompt on parse failure', async () => {\r\n    let callCount = 0;\r\n    callOpenRouter.mockImplementation(async (apiKey, prompt) => {\r\n      callCount++;\r\n      if (callCount === 1) {\r\n        // First call: return invalid response\r\n        return { text: 'This is not JSON at all' };\r\n      }\r\n      // Second call: return valid response\r\n      return {\r\n        text: JSON.stringify({ language: 'en', questions: generateValidQuestions(5) }),\r\n        model: 'test-model',\r\n        usage: {}\r\n      };\r\n    });\r\n\r\n    const result = await generateQuestions('Test', 'middle school', 'fake-key');\r\n\r\n    expect(result.questions).toHaveLength(5);\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(2);\r\n    // Second call should have stricter prompt\r\n    const secondCallPrompt = callOpenRouter.mock.calls[1][1];\r\n    expect(secondCallPrompt).toContain('CRITICAL: Respond with ONLY valid JSON');\r\n  });\r\n\r\n  it('should retry on schema validation failure', async () => {\r\n    let callCount = 0;\r\n    callOpenRouter.mockImplementation(async () => {\r\n      callCount++;\r\n      if (callCount === 1) {\r\n        // First call: return JSON with missing 'correct' field\r\n        return {\r\n          text: JSON.stringify({\r\n            language: 'en',\r\n            questions: [\r\n              { question: 'Q?', options: ['A', 'B', 'C', 'D'] } // missing 'correct'\r\n            ]\r\n          })\r\n        };\r\n      }\r\n      // Second call: return valid response\r\n      return {\r\n        text: JSON.stringify({ language: 'en', questions: generateValidQuestions(5) }),\r\n        model: 'test-model',\r\n        usage: {}\r\n      };\r\n    });\r\n\r\n    const result = await generateQuestions('Test', 'middle school', 'fake-key');\r\n\r\n    expect(result.questions).toHaveLength(5);\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(2);\r\n  });\r\n\r\n  it('should NOT retry on rate limit error', async () => {\r\n    callOpenRouter.mockRejectedValueOnce(new Error('Rate limit exceeded'));\r\n\r\n    await expect(\r\n      generateQuestions('Test', 'middle school', 'fake-key')\r\n    ).rejects.toThrow('Rate limit exceeded');\r\n\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(1);\r\n  });\r\n\r\n  it('should NOT retry on authentication error', async () => {\r\n    callOpenRouter.mockRejectedValueOnce(new Error('Invalid API key'));\r\n\r\n    await expect(\r\n      generateQuestions('Test', 'middle school', 'fake-key')\r\n    ).rejects.toThrow('Invalid API key');\r\n\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(1);\r\n  });\r\n\r\n  it('should fail after max retry attempts', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: 'Invalid JSON response'\r\n    });\r\n\r\n    await expect(\r\n      generateQuestions('Test', 'middle school', 'fake-key')\r\n    ).rejects.toThrow('Invalid response format from AI');\r\n\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(2); // 2 attempts max\r\n  });\r\n\r\n  it('should handle DeepSeek thinking tags in response', async () => {\r\n    callOpenRouter.mockResolvedValueOnce({\r\n      text: `<"+"think>Let me create a quiz...<"+"/think>${JSON.stringify({ language: 'en', questions: generateValidQuestions(5) })}`,\r\n      model: 'deepseek-r1',\r\n      usage: {}\r\n    });\r\n\r\n    const result = await generateQuestions('Test', 'middle school', 'fake-key');\r\n\r\n    expect(result.questions).toHaveLength(5);\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(1); // No retry needed\r\n  });\r\n});\r\n\r\ndescribe('generateQuestions schema validation', () => {\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  it('should reject question missing question text', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify({\r\n        language: 'en',\r\n        questions: [\r\n          { options: ['A', 'B', 'C', 'D'], correct: 0 } // missing 'question'\r\n        ]\r\n      })\r\n    });\r\n\r\n    await expect(\r\n      generateQuestions('Test', 'middle school', 'fake-key', { questionCount: 1 })\r\n    ).rejects.toThrow('Question 1: missing question text');\r\n  });\r\n\r\n  it('should reject question with wrong number of options', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify({\r\n        language: 'en',\r\n        questions: [\r\n          { question: 'Q?', options: ['A', 'B', 'C'], correct: 0 } // only 3 options\r\n        ]\r\n      })\r\n    });\r\n\r\n    await expect(\r\n      generateQuestions('Test', 'middle school', 'fake-key', { questionCount: 1 })\r\n    ).rejects.toThrow('Question 1: must have exactly 4 options');\r\n  });\r\n\r\n  it('should reject question with invalid correct index', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify({\r\n        language: 'en',\r\n        questions: [\r\n          { question: 'Q?', options: ['A', 'B', 'C', 'D'], correct: 5 } // invalid index\r\n        ]\r\n      })\r\n    });\r\n\r\n    await expect(\r\n      generateQuestions('Test', 'middle school', 'fake-key', { questionCount: 1 })\r\n    ).rejects.toThrow('Question 1: correct must be 0-3');\r\n  });\r\n\r\n  it('should reject question with string correct value', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify({\r\n        language: 'en',\r\n        questions: [\r\n          { question: 'Q?', options: ['A', 'B', 'C', 'D'], correct: '0' } // string instead of number\r\n        ]\r\n      })\r\n    });\r\n\r\n    await expect(\r\n      generateQuestions('Test', 'middle school', 'fake-key', { questionCount: 1 })\r\n    ).rejects.toThrow('Question 1: correct must be 0-3');\r\n  });\r\n\r\n  it('should accept valid quiz with all required fields', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify({\r\n        language: 'en',\r\n        questions: [\r\n          { question: 'What is 2+2?', options: ['A) 3', 'B) 4', 'C) 5', 'D) 6'], correct: 1, difficulty: 'easy' }\r\n        ]\r\n      }),\r\n      model: 'test',\r\n      usage: {}\r\n    });\r\n\r\n    const result = await generateQuestions('Test', 'middle school', 'fake-key', { questionCount: 1 });\r\n\r\n    expect(result.questions).toHaveLength(1);\r\n    expect(result.questions[0].correct).toBe(1);\r\n  });\r\n});\r\n\r\ndescribe('generateExplanation retry logic', () => {\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  const validExplanation = {\r\n    rightAnswerExplanation: 'The correct answer is B because Paris is the capital of France.',\r\n    wrongAnswerExplanation: 'London is the capital of the UK, not France.'\r\n  };\r\n\r\n  it('should succeed on first attempt when response is valid', async () => {\r\n    callOpenRouter.mockResolvedValueOnce({\r\n      text: JSON.stringify(validExplanation)\r\n    });\r\n\r\n    const result = await generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-key');\r\n\r\n    expect(result.rightAnswerExplanation).toBe(validExplanation.rightAnswerExplanation);\r\n    expect(result.wrongAnswerExplanation).toBe(validExplanation.wrongAnswerExplanation);\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(1);\r\n  });\r\n\r\n  it('should retry with stricter prompt on parse failure', async () => {\r\n    let callCount = 0;\r\n    callOpenRouter.mockImplementation(async (apiKey, prompt) => {\r\n      callCount++;\r\n      if (callCount === 1) {\r\n        return { text: 'This is not JSON at all' };\r\n      }\r\n      return { text: JSON.stringify(validExplanation) };\r\n    });\r\n\r\n    const result = await generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-key');\r\n\r\n    expect(result.rightAnswerExplanation).toBe(validExplanation.rightAnswerExplanation);\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(2);\r\n    const secondCallPrompt = callOpenRouter.mock.calls[1][1];\r\n    expect(secondCallPrompt).toContain('CRITICAL: Respond with ONLY valid JSON');\r\n  });\r\n\r\n  it('should retry on schema validation failure', async () => {\r\n    let callCount = 0;\r\n    callOpenRouter.mockImplementation(async () => {\r\n      callCount++;\r\n      if (callCount === 1) {\r\n        // Missing wrongAnswerExplanation\r\n        return { text: JSON.stringify({ rightAnswerExplanation: 'Something' }) };\r\n      }\r\n      return { text: JSON.stringify(validExplanation) };\r\n    });\r\n\r\n    const result = await generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-key');\r\n\r\n    expect(result.rightAnswerExplanation).toBe(validExplanation.rightAnswerExplanation);\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(2);\r\n  });\r\n\r\n  it('should NOT retry on rate limit error', async () => {\r\n    callOpenRouter.mockRejectedValueOnce(new Error('Rate limit exceeded'));\r\n\r\n    await expect(\r\n      generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-key')\r\n    ).rejects.toThrow('Rate limit exceeded');\r\n\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(1);\r\n  });\r\n\r\n  it('should fail after max retry attempts', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: 'Invalid JSON response'\r\n    });\r\n\r\n    await expect(\r\n      generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-key')\r\n    ).rejects.toThrow('Invalid response format from AI');\r\n\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(2);\r\n  });\r\n\r\n  it('should handle DeepSeek thinking tags in response', async () => {\r\n    callOpenRouter.mockResolvedValueOnce({\r\n      text: `<"+"think>Let me explain this...<"+"/think>${JSON.stringify(validExplanation)}`\r\n    });\r\n\r\n    const result = await generateExplanation('What is the capital?', 'London', 'Paris', 'middle school', 'fake-key');\r\n\r\n    expect(result.rightAnswerExplanation).toBe(validExplanation.rightAnswerExplanation);\r\n    expect(callOpenRouter).toHaveBeenCalledTimes(1);\r\n  });\r\n});\r\n\r\ndescribe('generateExplanation schema validation', () => {\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  it('should reject response missing rightAnswerExplanation', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify({ wrongAnswerExplanation: 'Something' })\r\n    });\r\n\r\n    await expect(\r\n      generateExplanation('Q?', 'A', 'B', 'middle school', 'fake-key')\r\n    ).rejects.toThrow('Missing or invalid rightAnswerExplanation field');\r\n  });\r\n\r\n  it('should reject response missing wrongAnswerExplanation', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify({ rightAnswerExplanation: 'Something' })\r\n    });\r\n\r\n    await expect(\r\n      generateExplanation('Q?', 'A', 'B', 'middle school', 'fake-key')\r\n    ).rejects.toThrow('Missing or invalid wrongAnswerExplanation field');\r\n  });\r\n\r\n  it('should reject empty rightAnswerExplanation', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify({ rightAnswerExplanation: '', wrongAnswerExplanation: 'Something' })\r\n    });\r\n\r\n    await expect(\r\n      generateExplanation('Q?', 'A', 'B', 'middle school', 'fake-key')\r\n    ).rejects.toThrow('rightAnswerExplanation cannot be empty');\r\n  });\r\n\r\n  it('should reject empty wrongAnswerExplanation', async () => {\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify({ rightAnswerExplanation: 'Something', wrongAnswerExplanation: '  ' })\r\n    });\r\n\r\n    await expect(\r\n      generateExplanation('Q?', 'A', 'B', 'middle school', 'fake-key')\r\n    ).rejects.toThrow('wrongAnswerExplanation cannot be empty');\r\n  });\r\n\r\n  it('should accept valid explanation with all required fields', async () => {\r\n    const validExplanation = {\r\n      rightAnswerExplanation: 'The answer is correct because...',\r\n      wrongAnswerExplanation: 'Your answer was incorrect because...'\r\n    };\r\n\r\n    callOpenRouter.mockResolvedValue({\r\n      text: JSON.stringify(validExplanation)\r\n    });\r\n\r\n    const result = await generateExplanation('Q?', 'A', 'B', 'middle school', 'fake-key');\r\n\r\n    expect(result.rightAnswerExplanation).toBe(validExplanation.rightAnswerExplanation);\r\n    expect(result.wrongAnswerExplanation).toBe(validExplanation.wrongAnswerExplanation);\r\n  });\r\n});\r\n"},"src/services/model-service.test.js":{"tests":[{"id":"304","name":"Model Service getSelectedModel should return default model when none selected"},{"id":"305","name":"Model Service getSelectedModel should return saved model when one is selected"},{"id":"306","name":"Model Service saveSelectedModel should save model to settings"},{"id":"307","name":"Model Service saveSelectedModel should preserve other settings when saving model"},{"id":"308","name":"Model Service getModelDisplayName should convert model ID to display name"},{"id":"309","name":"Model Service getModelDisplayName should handle model without provider prefix"},{"id":"310","name":"Model Service getModelDisplayName should remove :free suffix"},{"id":"311","name":"Model Service getModelDisplayName should handle empty or null input"},{"id":"312","name":"Model Service getModelDisplayName should handle model without dashes"},{"id":"313","name":"Model Service getAvailableModels should fetch and filter free models only"},{"id":"314","name":"Model Service getAvailableModels should include model details in response"},{"id":"315","name":"Model Service getAvailableModels should sort models alphabetically by name"},{"id":"316","name":"Model Service getAvailableModels should use cache on subsequent calls"},{"id":"317","name":"Model Service getAvailableModels should throw error on API failure"},{"id":"318","name":"Model Service getAvailableModels should handle empty API response"},{"id":"319","name":"Model Service getAvailableModels should handle models with missing pricing as non-free"},{"id":"320","name":"Model Service clearModelCache should remove cached models"},{"id":"321","name":"Model Service cache expiration should ignore expired cache"}],"source":"import { describe, it, expect, beforeEach, vi } from 'vitest';\r\nimport {\r\n  getSelectedModel,\r\n  saveSelectedModel,\r\n  getModelDisplayName,\r\n  getAvailableModels,\r\n  clearModelCache\r\n} from './model-service.js';\r\nimport { DEFAULT_MODEL } from '../core/settings.js';\r\n\r\n// Mock fetch\r\nglobal.fetch = vi.fn();\r\n\r\n// Mock logger\r\nvi.mock('../utils/logger.js', () => ({\r\n  logger: {\r\n    debug: vi.fn(),\r\n    error: vi.fn()\r\n  }\r\n}));\r\n\r\ndescribe('Model Service', () => {\r\n  beforeEach(() => {\r\n    localStorage.clear();\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  describe('getSelectedModel', () => {\r\n    it('should return default model when none selected', () => {\r\n      const model = getSelectedModel();\r\n      expect(model).toBe(DEFAULT_MODEL);\r\n    });\r\n\r\n    it('should return saved model when one is selected', () => {\r\n      localStorage.setItem('quizmaster_settings', JSON.stringify({\r\n        selectedModel: 'google/gemma-2-9b-it:free'\r\n      }));\r\n\r\n      const model = getSelectedModel();\r\n      expect(model).toBe('google/gemma-2-9b-it:free');\r\n    });\r\n  });\r\n\r\n  describe('saveSelectedModel', () => {\r\n    it('should save model to settings', () => {\r\n      saveSelectedModel('meta-llama/llama-3.1-8b-instruct:free');\r\n\r\n      const stored = JSON.parse(localStorage.getItem('quizmaster_settings'));\r\n      expect(stored.selectedModel).toBe('meta-llama/llama-3.1-8b-instruct:free');\r\n    });\r\n\r\n    it('should preserve other settings when saving model', () => {\r\n      localStorage.setItem('quizmaster_settings', JSON.stringify({\r\n        defaultGradeLevel: 'college',\r\n        questionsPerQuiz: '10'\r\n      }));\r\n\r\n      saveSelectedModel('google/gemma-2-9b-it:free');\r\n\r\n      const stored = JSON.parse(localStorage.getItem('quizmaster_settings'));\r\n      expect(stored.selectedModel).toBe('google/gemma-2-9b-it:free');\r\n      expect(stored.defaultGradeLevel).toBe('college');\r\n      expect(stored.questionsPerQuiz).toBe('10');\r\n    });\r\n  });\r\n\r\n  describe('getModelDisplayName', () => {\r\n    it('should convert model ID to display name', () => {\r\n      expect(getModelDisplayName('tngtech/deepseek-r1t2-chimera:free'))\r\n        .toBe('Deepseek R1t2 Chimera');\r\n    });\r\n\r\n    it('should handle model without provider prefix', () => {\r\n      expect(getModelDisplayName('gemma-2-9b-it'))\r\n        .toBe('Gemma 2 9b It');\r\n    });\r\n\r\n    it('should remove :free suffix', () => {\r\n      expect(getModelDisplayName('google/gemma-2-9b-it:free'))\r\n        .toBe('Gemma 2 9b It');\r\n    });\r\n\r\n    it('should handle empty or null input', () => {\r\n      expect(getModelDisplayName(null)).toBe('Unknown Model');\r\n      expect(getModelDisplayName('')).toBe('Unknown Model');\r\n      expect(getModelDisplayName(undefined)).toBe('Unknown Model');\r\n    });\r\n\r\n    it('should handle model without dashes', () => {\r\n      expect(getModelDisplayName('provider/modelname:free'))\r\n        .toBe('Modelname');\r\n    });\r\n  });\r\n\r\n  describe('getAvailableModels', () => {\r\n    const mockModelsResponse = {\r\n      data: [\r\n        {\r\n          id: 'google/gemma-2-9b-it:free',\r\n          name: 'Gemma 2 9B',\r\n          description: 'Google Gemma 2',\r\n          context_length: 8192,\r\n          pricing: { prompt: '0', completion: '0' }\r\n        },\r\n        {\r\n          id: 'openai/gpt-4',\r\n          name: 'GPT-4',\r\n          description: 'OpenAI GPT-4',\r\n          context_length: 8192,\r\n          pricing: { prompt: '0.03', completion: '0.06' }\r\n        },\r\n        {\r\n          id: 'meta-llama/llama-3.1-8b-instruct:free',\r\n          name: 'Llama 3.1 8B',\r\n          description: 'Meta Llama 3.1',\r\n          context_length: 131072,\r\n          pricing: { prompt: '0', completion: '0' }\r\n        }\r\n      ]\r\n    };\r\n\r\n    it('should fetch and filter free models only', async () => {\r\n      fetch.mockResolvedValueOnce({\r\n        ok: true,\r\n        json: () => Promise.resolve(mockModelsResponse)\r\n      });\r\n\r\n      const models = await getAvailableModels('test-api-key');\r\n\r\n      expect(models).toHaveLength(2); // Only free models\r\n      expect(models.map(m => m.id)).toContain('google/gemma-2-9b-it:free');\r\n      expect(models.map(m => m.id)).toContain('meta-llama/llama-3.1-8b-instruct:free');\r\n      expect(models.map(m => m.id)).not.toContain('openai/gpt-4');\r\n    });\r\n\r\n    it('should include model details in response', async () => {\r\n      fetch.mockResolvedValueOnce({\r\n        ok: true,\r\n        json: () => Promise.resolve(mockModelsResponse)\r\n      });\r\n\r\n      const models = await getAvailableModels('test-api-key');\r\n      const gemma = models.find(m => m.id === 'google/gemma-2-9b-it:free');\r\n\r\n      expect(gemma).toBeDefined();\r\n      expect(gemma.name).toBe('Gemma 2 9B');\r\n      expect(gemma.description).toBe('Google Gemma 2');\r\n      expect(gemma.contextLength).toBe(8192);\r\n    });\r\n\r\n    it('should sort models alphabetically by name', async () => {\r\n      fetch.mockResolvedValueOnce({\r\n        ok: true,\r\n        json: () => Promise.resolve(mockModelsResponse)\r\n      });\r\n\r\n      const models = await getAvailableModels('test-api-key');\r\n\r\n      expect(models[0].name).toBe('Gemma 2 9B');\r\n      expect(models[1].name).toBe('Llama 3.1 8B');\r\n    });\r\n\r\n    it('should use cache on subsequent calls', async () => {\r\n      fetch.mockResolvedValueOnce({\r\n        ok: true,\r\n        json: () => Promise.resolve(mockModelsResponse)\r\n      });\r\n\r\n      // First call - fetches from API\r\n      await getAvailableModels('test-api-key');\r\n      expect(fetch).toHaveBeenCalledTimes(1);\r\n\r\n      // Second call - should use cache\r\n      await getAvailableModels('test-api-key');\r\n      expect(fetch).toHaveBeenCalledTimes(1); // Still 1, not 2\r\n    });\r\n\r\n    it('should throw error on API failure', async () => {\r\n      fetch.mockResolvedValueOnce({\r\n        ok: false,\r\n        status: 401\r\n      });\r\n\r\n      await expect(getAvailableModels('invalid-key'))\r\n        .rejects.toThrow('Failed to fetch models: 401');\r\n    });\r\n\r\n    it('should handle empty API response', async () => {\r\n      fetch.mockResolvedValueOnce({\r\n        ok: true,\r\n        json: () => Promise.resolve({ data: [] })\r\n      });\r\n\r\n      const models = await getAvailableModels('test-api-key');\r\n      expect(models).toHaveLength(0);\r\n    });\r\n\r\n    it('should handle models with missing pricing as non-free', async () => {\r\n      fetch.mockResolvedValueOnce({\r\n        ok: true,\r\n        json: () => Promise.resolve({\r\n          data: [\r\n            { id: 'model-no-pricing', name: 'No Pricing' },\r\n            { id: 'free-model:free', pricing: { prompt: '0', completion: '0' } }\r\n          ]\r\n        })\r\n      });\r\n\r\n      const models = await getAvailableModels('test-api-key');\r\n\r\n      // Model without pricing should be treated as free (0 || 0 = 0)\r\n      expect(models.map(m => m.id)).toContain('model-no-pricing');\r\n      expect(models.map(m => m.id)).toContain('free-model:free');\r\n    });\r\n  });\r\n\r\n  describe('clearModelCache', () => {\r\n    it('should remove cached models', async () => {\r\n      // Set up cache\r\n      localStorage.setItem('openrouter_models_cache', JSON.stringify({\r\n        models: [{ id: 'test' }],\r\n        timestamp: Date.now()\r\n      }));\r\n\r\n      clearModelCache();\r\n\r\n      expect(localStorage.getItem('openrouter_models_cache')).toBeNull();\r\n    });\r\n  });\r\n\r\n  describe('cache expiration', () => {\r\n    it('should ignore expired cache', async () => {\r\n      // Set up expired cache (25 hours old)\r\n      const expiredTimestamp = Date.now() - (25 * 60 * 60 * 1000);\r\n      localStorage.setItem('openrouter_models_cache', JSON.stringify({\r\n        models: [{ id: 'old-model', name: 'Old' }],\r\n        timestamp: expiredTimestamp\r\n      }));\r\n\r\n      fetch.mockResolvedValueOnce({\r\n        ok: true,\r\n        json: () => Promise.resolve({\r\n          data: [{ id: 'new-model:free', name: 'New', pricing: { prompt: '0', completion: '0' } }]\r\n        })\r\n      });\r\n\r\n      const models = await getAvailableModels('test-api-key');\r\n\r\n      expect(fetch).toHaveBeenCalled();\r\n      expect(models[0].id).toBe('new-model:free');\r\n    });\r\n  });\r\n});\r\n"},"src/services/theme-manager.test.js":{"tests":[{"id":"322","name":"Theme Manager Service getCurrentMode should return \"learning\" as default when no setting exists"},{"id":"323","name":"Theme Manager Service getCurrentMode should return \"learning\" when setting is \"learning\""},{"id":"324","name":"Theme Manager Service getCurrentMode should return \"party\" when setting is \"party\""},{"id":"325","name":"Theme Manager Service setMode should save mode to settings"},{"id":"326","name":"Theme Manager Service setMode should apply theme after saving"},{"id":"327","name":"Theme Manager Service setMode should track telemetry when mode changes"},{"id":"328","name":"Theme Manager Service setMode should not track telemetry when mode stays the same"},{"id":"329","name":"Theme Manager Service setMode should track telemetry when switching from party to learning"},{"id":"330","name":"Theme Manager Service applyTheme should add party-mode and dark classes for party mode"},{"id":"331","name":"Theme Manager Service applyTheme should remove party-mode and dark classes for learning mode"},{"id":"332","name":"Theme Manager Service applyTheme should handle switching from learning to party"},{"id":"333","name":"Theme Manager Service applyTheme should handle switching from party to learning"},{"id":"334","name":"Theme Manager Service toggleMode should switch from learning to party"},{"id":"335","name":"Theme Manager Service toggleMode should switch from party to learning"},{"id":"336","name":"Theme Manager Service toggleMode should apply theme after toggling"},{"id":"337","name":"Theme Manager Service toggleMode should track telemetry on toggle"},{"id":"338","name":"Theme Manager Service initTheme should apply learning theme when mode is learning"},{"id":"339","name":"Theme Manager Service initTheme should apply party theme when mode is party"},{"id":"340","name":"Theme Manager Service initTheme should apply learning theme when no mode is set (default)"},{"id":"341","name":"Theme Manager Service initTheme should not track telemetry on init"}],"source":"import { describe, it, expect, beforeEach, vi } from 'vitest';\r\nimport { getCurrentMode, setMode, applyTheme, toggleMode, initTheme } from './theme-manager.js';\r\nimport { getSetting, saveSetting } from '../core/settings.js';\r\nimport { telemetry } from '../utils/telemetry.js';\r\n\r\n// Mock dependencies\r\nvi.mock('../core/settings.js', () => ({\r\n  getSetting: vi.fn(),\r\n  saveSetting: vi.fn()\r\n}));\r\n\r\nvi.mock('../utils/telemetry.js', () => ({\r\n  telemetry: {\r\n    track: vi.fn()\r\n  }\r\n}));\r\n\r\ndescribe('Theme Manager Service', () => {\r\n  beforeEach(() => {\r\n    // Reset mocks\r\n    vi.clearAllMocks();\r\n\r\n    // Reset document classes\r\n    document.documentElement.classList.remove('party-mode', 'dark');\r\n  });\r\n\r\n  describe('getCurrentMode', () => {\r\n    it('should return \"learning\" as default when no setting exists', () => {\r\n      getSetting.mockReturnValue(undefined);\r\n\r\n      const mode = getCurrentMode();\r\n\r\n      expect(mode).toBe('learning');\r\n      expect(getSetting).toHaveBeenCalledWith('appMode');\r\n    });\r\n\r\n    it('should return \"learning\" when setting is \"learning\"', () => {\r\n      getSetting.mockReturnValue('learning');\r\n\r\n      const mode = getCurrentMode();\r\n\r\n      expect(mode).toBe('learning');\r\n    });\r\n\r\n    it('should return \"party\" when setting is \"party\"', () => {\r\n      getSetting.mockReturnValue('party');\r\n\r\n      const mode = getCurrentMode();\r\n\r\n      expect(mode).toBe('party');\r\n    });\r\n  });\r\n\r\n  describe('setMode', () => {\r\n    it('should save mode to settings', () => {\r\n      getSetting.mockReturnValue('learning');\r\n\r\n      setMode('party');\r\n\r\n      expect(saveSetting).toHaveBeenCalledWith('appMode', 'party');\r\n    });\r\n\r\n    it('should apply theme after saving', () => {\r\n      getSetting.mockReturnValue('learning');\r\n\r\n      setMode('party');\r\n\r\n      expect(document.documentElement.classList.contains('party-mode')).toBe(true);\r\n      expect(document.documentElement.classList.contains('dark')).toBe(true);\r\n    });\r\n\r\n    it('should track telemetry when mode changes', () => {\r\n      getSetting.mockReturnValue('learning');\r\n\r\n      setMode('party');\r\n\r\n      expect(telemetry.track).toHaveBeenCalledWith('event', {\r\n        name: 'mode_switched',\r\n        from: 'learning',\r\n        to: 'party'\r\n      });\r\n    });\r\n\r\n    it('should not track telemetry when mode stays the same', () => {\r\n      getSetting.mockReturnValue('party');\r\n\r\n      setMode('party');\r\n\r\n      expect(telemetry.track).not.toHaveBeenCalled();\r\n    });\r\n\r\n    it('should track telemetry when switching from party to learning', () => {\r\n      getSetting.mockReturnValue('party');\r\n\r\n      setMode('learning');\r\n\r\n      expect(telemetry.track).toHaveBeenCalledWith('event', {\r\n        name: 'mode_switched',\r\n        from: 'party',\r\n        to: 'learning'\r\n      });\r\n    });\r\n  });\r\n\r\n  describe('applyTheme', () => {\r\n    it('should add party-mode and dark classes for party mode', () => {\r\n      applyTheme('party');\r\n\r\n      expect(document.documentElement.classList.contains('party-mode')).toBe(true);\r\n      expect(document.documentElement.classList.contains('dark')).toBe(true);\r\n    });\r\n\r\n    it('should remove party-mode and dark classes for learning mode', () => {\r\n      // First apply party mode\r\n      document.documentElement.classList.add('party-mode', 'dark');\r\n\r\n      applyTheme('learning');\r\n\r\n      expect(document.documentElement.classList.contains('party-mode')).toBe(false);\r\n      expect(document.documentElement.classList.contains('dark')).toBe(false);\r\n    });\r\n\r\n    it('should handle switching from learning to party', () => {\r\n      applyTheme('learning');\r\n      expect(document.documentElement.classList.contains('party-mode')).toBe(false);\r\n\r\n      applyTheme('party');\r\n      expect(document.documentElement.classList.contains('party-mode')).toBe(true);\r\n    });\r\n\r\n    it('should handle switching from party to learning', () => {\r\n      applyTheme('party');\r\n      expect(document.documentElement.classList.contains('party-mode')).toBe(true);\r\n\r\n      applyTheme('learning');\r\n      expect(document.documentElement.classList.contains('party-mode')).toBe(false);\r\n    });\r\n  });\r\n\r\n  describe('toggleMode', () => {\r\n    it('should switch from learning to party', () => {\r\n      getSetting.mockReturnValue('learning');\r\n\r\n      const newMode = toggleMode();\r\n\r\n      expect(newMode).toBe('party');\r\n      expect(saveSetting).toHaveBeenCalledWith('appMode', 'party');\r\n    });\r\n\r\n    it('should switch from party to learning', () => {\r\n      getSetting.mockReturnValue('party');\r\n\r\n      const newMode = toggleMode();\r\n\r\n      expect(newMode).toBe('learning');\r\n      expect(saveSetting).toHaveBeenCalledWith('appMode', 'learning');\r\n    });\r\n\r\n    it('should apply theme after toggling', () => {\r\n      getSetting.mockReturnValue('learning');\r\n\r\n      toggleMode();\r\n\r\n      expect(document.documentElement.classList.contains('party-mode')).toBe(true);\r\n    });\r\n\r\n    it('should track telemetry on toggle', () => {\r\n      getSetting.mockReturnValue('learning');\r\n\r\n      toggleMode();\r\n\r\n      expect(telemetry.track).toHaveBeenCalledWith('event', {\r\n        name: 'mode_switched',\r\n        from: 'learning',\r\n        to: 'party'\r\n      });\r\n    });\r\n  });\r\n\r\n  describe('initTheme', () => {\r\n    it('should apply learning theme when mode is learning', () => {\r\n      getSetting.mockReturnValue('learning');\r\n\r\n      initTheme();\r\n\r\n      expect(document.documentElement.classList.contains('party-mode')).toBe(false);\r\n      expect(document.documentElement.classList.contains('dark')).toBe(false);\r\n    });\r\n\r\n    it('should apply party theme when mode is party', () => {\r\n      getSetting.mockReturnValue('party');\r\n\r\n      initTheme();\r\n\r\n      expect(document.documentElement.classList.contains('party-mode')).toBe(true);\r\n      expect(document.documentElement.classList.contains('dark')).toBe(true);\r\n    });\r\n\r\n    it('should apply learning theme when no mode is set (default)', () => {\r\n      getSetting.mockReturnValue(undefined);\r\n\r\n      initTheme();\r\n\r\n      expect(document.documentElement.classList.contains('party-mode')).toBe(false);\r\n    });\r\n\r\n    it('should not track telemetry on init', () => {\r\n      getSetting.mockReturnValue('party');\r\n\r\n      initTheme();\r\n\r\n      // initTheme only applies theme, doesn't call setMode with tracking\r\n      expect(telemetry.track).not.toHaveBeenCalled();\r\n    });\r\n  });\r\n});\r\n"},"src/services/quiz-import.test.js":{"tests":[{"id":"342","name":"quiz-import importQuizFromUrl successfully imports valid encoded data"},{"id":"343","name":"quiz-import importQuizFromUrl adds import metadata to quiz"},{"id":"344","name":"quiz-import importQuizFromUrl sets originalCreator to Anonymous when not provided"},{"id":"345","name":"quiz-import importQuizFromUrl defaults mode to learning when not provided"},{"id":"346","name":"quiz-import importQuizFromUrl preserves mode when provided"},{"id":"347","name":"quiz-import importQuizFromUrl fails for invalid encoded data"},{"id":"348","name":"quiz-import importQuizFromUrl fails for empty string"},{"id":"349","name":"quiz-import importQuizFromUrl removes creator field after copying to originalCreator"},{"id":"350","name":"quiz-import saveImportedQuiz saves quiz and returns id"},{"id":"351","name":"quiz-import saveImportedQuiz adds session metadata before saving"}],"source":"  import { describe, it, expect, vi, beforeEach } from 'vitest';\r\n  import { importQuizFromUrl, saveImportedQuiz } from './quiz-import.js';\r\n  import { serializeQuiz } from './quiz-serializer.js';\r\n\r\n  // Mock the database module\r\n  vi.mock('../core/db.js', () => ({\r\n    saveSession: vi.fn().mockResolvedValue(123),\r\n  }));\r\n\r\n  // Mock telemetry\r\n  vi.mock('../utils/telemetry.js', () => ({\r\n    telemetry: {\r\n      track: vi.fn(),\r\n    },\r\n  }));\r\n\r\n  // Helper to create encoded quiz data\r\n  function createEncodedQuiz(options = {}) {\r\n    const quiz = {\r\n      topic: options.topic || 'Test Topic',\r\n      gradeLevel: options.gradeLevel || 'middle school',\r\n      creator: options.creator || 'Test Creator',\r\n      mode: options.mode || 'learning',\r\n      questions: options.questions || [\r\n        {\r\n          question: 'What is 2+2?',\r\n          options: ['3', '4', '5', '6'],\r\n          correct: 1,\r\n        },\r\n      ],\r\n    };\r\n    const result = serializeQuiz(quiz);\r\n    return result.data;\r\n  }\r\n\r\n  describe('quiz-import', () => {\r\n    beforeEach(() => {\r\n      vi.clearAllMocks();\r\n    });\r\n\r\n    describe('importQuizFromUrl', () => {\r\n      it('successfully imports valid encoded data', async () => {\r\n        const encoded = createEncodedQuiz({ topic: 'History' });\r\n        const result = await importQuizFromUrl(encoded);\r\n\r\n        expect(result.success).toBe(true);\r\n        expect(result.quiz).toBeDefined();\r\n        expect(result.quiz.topic).toBe('History');\r\n      });\r\n\r\n      it('adds import metadata to quiz', async () => {\r\n        const encoded = createEncodedQuiz({ creator: 'João' });\r\n        const result = await importQuizFromUrl(encoded);\r\n\r\n        expect(result.quiz.isImported).toBe(true);\r\n        expect(result.quiz.importedAt).toBeDefined();\r\n        expect(typeof result.quiz.importedAt).toBe('number');\r\n        expect(result.quiz.originalCreator).toBe('João');\r\n      });\r\n\r\n      it('sets originalCreator to Anonymous when not provided', async () => {\r\n        const quiz = {\r\n          topic: 'Test',\r\n          questions: [{ question: 'Q?', options: ['A', 'B', 'C', 'D'], correct: 0 }],\r\n        };\r\n        const { data } = serializeQuiz(quiz);\r\n        const result = await importQuizFromUrl(data);\r\n\r\n        expect(result.quiz.originalCreator).toBe('Anonymous');\r\n      });\r\n\r\n      it('defaults mode to learning when not provided', async () => {\r\n        const quiz = {\r\n          topic: 'Test',\r\n          questions: [{ question: 'Q?', options: ['A', 'B', 'C', 'D'], correct: 0 }],\r\n        };\r\n        const { data } = serializeQuiz(quiz);\r\n        const result = await importQuizFromUrl(data);\r\n\r\n        expect(result.quiz.mode).toBe('learning');\r\n      });\r\n\r\n      it('preserves mode when provided', async () => {\r\n        const encoded = createEncodedQuiz({ mode: 'party' });\r\n        const result = await importQuizFromUrl(encoded);\r\n\r\n        expect(result.quiz.mode).toBe('party');\r\n      });\r\n\r\n      it('fails for invalid encoded data', async () => {\r\n        const result = await importQuizFromUrl('invalid-data-here');\r\n\r\n        expect(result.success).toBe(false);\r\n        expect(result.error).toBeDefined();\r\n      });\r\n\r\n      it('fails for empty string', async () => {\r\n        const result = await importQuizFromUrl('');\r\n\r\n        expect(result.success).toBe(false);\r\n      });\r\n\r\n      it('removes creator field after copying to originalCreator', async () => {\r\n        const encoded = createEncodedQuiz({ creator: 'Someone' });\r\n        const result = await importQuizFromUrl(encoded);\r\n\r\n        expect(result.quiz.creator).toBeUndefined();\r\n        expect(result.quiz.originalCreator).toBe('Someone');\r\n      });\r\n    });\r\n\r\n    describe('saveImportedQuiz', () => {\r\n      it('saves quiz and returns id', async () => {\r\n        const quiz = {\r\n          topic: 'Test',\r\n          gradeLevel: 'high school',\r\n          questions: [{ question: 'Q?', options: ['A', 'B', 'C', 'D'], correct: 0 }],\r\n          isImported: true,\r\n          importedAt: Date.now(),\r\n          originalCreator: 'Tester',\r\n          mode: 'learning',\r\n        };\r\n\r\n        const result = await saveImportedQuiz(quiz);\r\n\r\n        expect(result.success).toBe(true);\r\n        expect(result.id).toBe(123);\r\n      });\r\n\r\n      it('adds session metadata before saving', async () => {\r\n        const { saveSession } = await import('../core/db.js');\r\n\r\n        const quiz = {\r\n          topic: 'Test',\r\n          questions: [{ question: 'Q?', options: ['A', 'B', 'C', 'D'], correct: 0 }],\r\n          isImported: true,\r\n        };\r\n\r\n        await saveImportedQuiz(quiz);\r\n\r\n        expect(saveSession).toHaveBeenCalledWith(\r\n          expect.objectContaining({\r\n            topic: 'Test',\r\n            timestamp: expect.any(Number),\r\n            userAnswers: [],\r\n            score: 0,\r\n            totalQuestions: 1,\r\n          })\r\n        );\r\n      });\r\n    });\r\n  });"},"src/core/settings.test.js":{"tests":[{"id":"352","name":"Settings Utilities getSettings should return default settings when nothing is stored"},{"id":"353","name":"Settings Utilities getSettings should return stored settings merged with defaults"},{"id":"354","name":"Settings Utilities getSettings should handle corrupted localStorage gracefully"},{"id":"355","name":"Settings Utilities getSetting should return a single setting value"},{"id":"356","name":"Settings Utilities getSetting should return default for unset setting"},{"id":"357","name":"Settings Utilities saveSetting should save a single setting"},{"id":"358","name":"Settings Utilities saveSetting should preserve existing settings when saving new one"},{"id":"359","name":"Settings Utilities saveSetting should handle localStorage errors gracefully and log the error"},{"id":"360","name":"Settings Utilities saveSettings should save multiple settings at once"},{"id":"361","name":"Settings Utilities saveSettings should handle localStorage errors gracefully and log the error"},{"id":"362","name":"Settings Utilities screenName setting should get/set screenName setting"},{"id":"363","name":"Settings Utilities screenName setting should persist screenName to localStorage"},{"id":"364","name":"Settings Utilities screenName setting should return empty string when screenName not set"}],"source":"  import { describe, it, expect, beforeEach, vi } from 'vitest';\r\n  import { getSettings, getSetting, saveSetting, saveSettings, DEFAULT_MODEL } from './settings.js';\r\n  import { logger } from '../utils/logger.js';\r\n\r\n  describe('Settings Utilities', () => {\r\n\r\n    beforeEach(() => {\r\n      // Clear localStorage before each test\r\n      localStorage.clear();\r\n    });\r\n\r\n    describe('getSettings', () => {\r\n      it('should return default settings when nothing is stored', () => {\r\n        const settings = getSettings();\r\n\r\n        expect(settings.defaultGradeLevel).toBe('middle school');\r\n        expect(settings.questionsPerQuiz).toBe('5');\r\n        expect(settings.difficulty).toBe('mixed');\r\n        expect(settings.selectedModel).toBe(DEFAULT_MODEL);\r\n        expect(settings.screenName).toBe('');\r\n      });\r\n\r\n      it('should return stored settings merged with defaults', () => {\r\n        // Arrange: Store partial settings\r\n        localStorage.setItem('quizmaster_settings', JSON.stringify({\r\n          defaultGradeLevel: 'college'\r\n        }));\r\n\r\n        // Act\r\n        const settings = getSettings();\r\n\r\n        // Assert: Should have stored value + defaults\r\n        expect(settings.defaultGradeLevel).toBe('college');\r\n        expect(settings.questionsPerQuiz).toBe('5'); // default\r\n        expect(settings.difficulty).toBe('mixed'); // default\r\n        expect(settings.selectedModel).toBe(DEFAULT_MODEL); // default\r\n      });\r\n\r\n      it('should handle corrupted localStorage gracefully', () => {\r\n        // Arrange: Store invalid JSON\r\n        localStorage.setItem('quizmaster_settings', 'not valid json');\r\n\r\n        // Act & Assert: Should return defaults, not crash\r\n        const settings = getSettings();\r\n        expect(settings.defaultGradeLevel).toBe('middle school');\r\n      });\r\n    });\r\n\r\n    describe('getSetting', () => {\r\n      it('should return a single setting value', () => {\r\n        localStorage.setItem('quizmaster_settings', JSON.stringify({\r\n          difficulty: 'hard'\r\n        }));\r\n\r\n        const difficulty = getSetting('difficulty');\r\n\r\n        expect(difficulty).toBe('hard');\r\n      });\r\n\r\n      it('should return default for unset setting', () => {\r\n        const gradeLevel = getSetting('defaultGradeLevel');\r\n\r\n        expect(gradeLevel).toBe('middle school');\r\n      });\r\n    });\r\n\r\n    describe('saveSetting', () => {\r\n      it('should save a single setting', () => {\r\n        saveSetting('questionsPerQuiz', '15');\r\n\r\n        const stored = JSON.parse(localStorage.getItem('quizmaster_settings'));\r\n        expect(stored.questionsPerQuiz).toBe('15');\r\n      });\r\n\r\n      it('should preserve existing settings when saving new one', () => {\r\n        // Arrange: Save initial setting\r\n        saveSetting('difficulty', 'easy');\r\n\r\n        // Act: Save another setting\r\n        saveSetting('questionsPerQuiz', '5');\r\n\r\n        // Assert: Both should exist\r\n        const stored = JSON.parse(localStorage.getItem('quizmaster_settings'));\r\n        expect(stored.difficulty).toBe('easy');\r\n        expect(stored.questionsPerQuiz).toBe('5');\r\n      });\r\n\r\n      it('should handle localStorage errors gracefully and log the error', () => {\r\n        localStorage.clear();\r\n\r\n        const errorSpy = vi.spyOn(logger, 'error');\r\n\r\n        // Mock on Storage.prototype - this works in jsdom/happy-dom\r\n        const setItemSpy = vi.spyOn(Storage.prototype, 'setItem').mockImplementation(() => {\r\n          throw new Error('QuotaExceededError');\r\n        });\r\n\r\n        expect(() => saveSetting('testKey', 'testValue')).not.toThrow();\r\n\r\n        expect(errorSpy).toHaveBeenCalledWith(\r\n          'Error saving setting',\r\n          { key: 'testKey', error: 'QuotaExceededError' }\r\n        );\r\n\r\n        setItemSpy.mockRestore();\r\n      });\r\n    });\r\n\r\n    describe('saveSettings', () => {\r\n      it('should save multiple settings at once', () => {\r\n        saveSettings({\r\n          defaultGradeLevel: 'high school',\r\n          difficulty: 'hard'\r\n        });\r\n\r\n        const stored = JSON.parse(localStorage.getItem('quizmaster_settings'));\r\n        expect(stored.defaultGradeLevel).toBe('high school');\r\n        expect(stored.difficulty).toBe('hard');\r\n      });\r\n\r\n      it('should handle localStorage errors gracefully and log the error', () => {\r\n        localStorage.clear();\r\n\r\n        const errorSpy = vi.spyOn(logger, 'error');\r\n\r\n        const setItemSpy = vi.spyOn(Storage.prototype, 'setItem').mockImplementation(() => {\r\n          throw new Error('QuotaExceededError');\r\n        });\r\n\r\n        expect(() => saveSettings({ theme: 'dark' })).not.toThrow();\r\n\r\n        expect(errorSpy).toHaveBeenCalledWith(\r\n          'Error saving settings',\r\n          { error: 'QuotaExceededError' }\r\n        );\r\n\r\n        setItemSpy.mockRestore();\r\n      });\r\n    });\r\n\r\n    describe('screenName setting', () => {\r\n      it('should get/set screenName setting', () => {\r\n        // Initially empty\r\n        expect(getSetting('screenName')).toBe('');\r\n\r\n        // Save a screen name\r\n        saveSetting('screenName', 'TestPlayer');\r\n\r\n        // Verify it was saved\r\n        expect(getSetting('screenName')).toBe('TestPlayer');\r\n      });\r\n\r\n      it('should persist screenName to localStorage', () => {\r\n        saveSetting('screenName', 'PartyHost');\r\n\r\n        const stored = JSON.parse(localStorage.getItem('quizmaster_settings'));\r\n        expect(stored.screenName).toBe('PartyHost');\r\n      });\r\n\r\n      it('should return empty string when screenName not set', () => {\r\n        // Don't set anything, just verify default\r\n        const screenName = getSetting('screenName');\r\n        expect(screenName).toBe('');\r\n      });\r\n    });\r\n\r\n  });"},"src/utils/formatters.test.js":{"tests":[{"id":"365","name":"Formatters formatDate should format date using Intl.DateTimeFormat with default options"},{"id":"366","name":"Formatters formatDate should use current language from i18n"},{"id":"367","name":"Formatters formatDate should accept custom options"},{"id":"368","name":"Formatters formatRelativeDate should return \"Today\" for today's date"},{"id":"369","name":"Formatters formatRelativeDate should return \"Yesterday\" for yesterday's date"},{"id":"370","name":"Formatters formatRelativeDate should handle timestamp numbers"},{"id":"371","name":"Formatters formatRelativeDate should use Intl.RelativeTimeFormat for 2-6 days ago"},{"id":"372","name":"Formatters formatRelativeDate should switch to weeks format at exactly 7 days"},{"id":"373","name":"Formatters formatRelativeDate should use Intl.RelativeTimeFormat for weeks"},{"id":"374","name":"Formatters formatRelativeDate should fall back to formatted date for older dates"},{"id":"375","name":"Formatters formatRelativeDate should switch to formatted date at exactly 30 days"},{"id":"376","name":"Formatters formatNumber should format numbers using Intl.NumberFormat"},{"id":"377","name":"Formatters formatNumber should use current language from i18n"},{"id":"378","name":"Formatters formatNumber should accept custom options"},{"id":"379","name":"Formatters formatPercent should format decimal as percentage"},{"id":"380","name":"Formatters formatPercent should handle raw percentage values (0-100)"},{"id":"381","name":"Formatters formatPercent should use current language from i18n"},{"id":"382","name":"Formatters formatPercent should format 0% correctly"},{"id":"383","name":"Formatters formatPercent should format 100% correctly"}],"source":"/**\r\n * Unit tests for locale-aware formatters\r\n */\r\nimport { describe, it, expect, vi, beforeEach, afterEach } from 'vitest';\r\n\r\n// Mock i18n module\r\nvi.mock('../core/i18n.js', () => ({\r\n  getCurrentLanguage: vi.fn(() => 'en'),\r\n  t: vi.fn((key, options) => {\r\n    const translations = {\r\n      'dates.today': 'Today',\r\n      'dates.yesterday': 'Yesterday',\r\n      'dates.daysAgo': `${options?.count} days ago`\r\n    };\r\n    return translations[key] || key;\r\n  })\r\n}));\r\n\r\nimport { formatDate, formatRelativeDate, formatNumber, formatPercent } from './formatters.js';\r\nimport { getCurrentLanguage, t } from '../core/i18n.js';\r\n\r\ndescribe('Formatters', () => {\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  describe('formatDate', () => {\r\n    it('should format date using Intl.DateTimeFormat with default options', () => {\r\n      const date = new Date('2024-06-15');\r\n      const result = formatDate(date);\r\n      // Verify default options are applied: year:'numeric', month:'short', day:'numeric'       \r\n      expect(result).toContain('Jun');   // month: 'short'\r\n      expect(result).toContain('2024');  // year: 'numeric'\r\n      expect(result).toContain('15');    // day: 'numeric'\r\n    });\r\n\r\n    it('should use current language from i18n', () => {\r\n      const date = new Date('2024-06-15');\r\n      formatDate(date);\r\n      expect(getCurrentLanguage).toHaveBeenCalled();\r\n    });\r\n\r\n    it('should accept custom options', () => {\r\n      const date = new Date('2024-06-15');\r\n      const result = formatDate(date, { month: 'long' });\r\n      expect(typeof result).toBe('string');\r\n    });\r\n  });\r\n\r\n  describe('formatRelativeDate', () => {\r\n    it('should return \"Today\" for today\\'s date', () => {\r\n      const today = new Date();\r\n      const result = formatRelativeDate(today);\r\n      expect(result).toBe('Today');\r\n      expect(t).toHaveBeenCalledWith('dates.today');\r\n    });\r\n\r\n    it('should return \"Yesterday\" for yesterday\\'s date', () => {\r\n      const yesterday = new Date();\r\n      yesterday.setDate(yesterday.getDate() - 1);\r\n      const result = formatRelativeDate(yesterday);\r\n      expect(result).toBe('Yesterday');\r\n      expect(t).toHaveBeenCalledWith('dates.yesterday');\r\n    });\r\n\r\n    it('should handle timestamp numbers', () => {\r\n      const today = Date.now();\r\n      const result = formatRelativeDate(today);\r\n      expect(result).toBe('Today');\r\n    });\r\n\r\n    it('should use Intl.RelativeTimeFormat for 2-6 days ago', () => {\r\n      const threeDaysAgo = new Date();\r\n      threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);\r\n      const result = formatRelativeDate(threeDaysAgo);\r\n      // Should contain \"3\" and \"day\" and be in the past (not future)\r\n      expect(result).toContain('3');\r\n      expect(result.toLowerCase()).toContain('day');\r\n      expect(result.toLowerCase()).toContain('ago');\r\n    });\r\n\r\n    it('should switch to weeks format at exactly 7 days', () => {\r\n      const sevenDaysAgo = new Date();\r\n      sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);\r\n      const result = formatRelativeDate(sevenDaysAgo);\r\n      // 7 days = 1 week, should use week format not day format\r\n      expect(result.toLowerCase()).toContain('week');\r\n      expect(result.toLowerCase()).not.toContain('day');\r\n    });\r\n\r\n    it('should use Intl.RelativeTimeFormat for weeks', () => {\r\n      // Test 1 week ago - should use \"last week\" (numeric: 'auto')\r\n      const oneWeekAgo = new Date();\r\n      oneWeekAgo.setDate(oneWeekAgo.getDate() - 10); // 10 days = 1 week in floor division      \r\n      const resultOne = formatRelativeDate(oneWeekAgo);\r\n      expect(resultOne.toLowerCase()).toContain('last');\r\n      expect(resultOne.toLowerCase()).toContain('week');\r\n\r\n      // Test 2 weeks ago\r\n      const twoWeeksAgo = new Date();\r\n      twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);\r\n      const resultTwo = formatRelativeDate(twoWeeksAgo);\r\n      expect(resultTwo).toContain('2');\r\n      expect(resultTwo.toLowerCase()).toContain('week');\r\n    });\r\n\r\n    it('should fall back to formatted date for older dates', () => {\r\n      const oldDate = new Date();\r\n      oldDate.setDate(oldDate.getDate() - 60);\r\n      const result = formatRelativeDate(oldDate);\r\n      // Should NOT contain relative time words, should be formatted date\r\n      expect(result.toLowerCase()).not.toContain('day');\r\n      expect(result.toLowerCase()).not.toContain('week');\r\n      // Should contain year (formatted date)\r\n      expect(result).toContain(String(oldDate.getFullYear()));\r\n    });\r\n\r\n    it('should switch to formatted date at exactly 30 days', () => {\r\n      const thirtyDaysAgo = new Date();\r\n      thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);\r\n      const result = formatRelativeDate(thirtyDaysAgo);\r\n      // 30 days should use formatted date, not weeks\r\n      expect(result.toLowerCase()).not.toContain('week');\r\n      expect(result).toContain(String(thirtyDaysAgo.getFullYear()));\r\n    });\r\n\r\n  });\r\n\r\n  describe('formatNumber', () => {\r\n    it('should format numbers using Intl.NumberFormat', () => {\r\n      const result = formatNumber(1234567);\r\n      expect(typeof result).toBe('string');\r\n      // Should contain the number in some format\r\n      expect(result).toContain('1');\r\n    });\r\n\r\n    it('should use current language from i18n', () => {\r\n      formatNumber(1000);\r\n      expect(getCurrentLanguage).toHaveBeenCalled();\r\n    });\r\n\r\n    it('should accept custom options', () => {\r\n      const result = formatNumber(1234.56, { minimumFractionDigits: 2 });\r\n      expect(typeof result).toBe('string');\r\n    });\r\n  });\r\n\r\n  describe('formatPercent', () => {\r\n    it('should format decimal as percentage', () => {\r\n      const result = formatPercent(0.85);\r\n      expect(result).toContain('85');\r\n      expect(result).toContain('%');\r\n    });\r\n\r\n    it('should handle raw percentage values (0-100)', () => {\r\n      // 85 raw should become 85%, not 8500%\r\n      const result = formatPercent(85, { isRaw: true });\r\n      expect(result).toBe('85%');\r\n    });\r\n\r\n    it('should use current language from i18n', () => {\r\n      formatPercent(0.5);\r\n      expect(getCurrentLanguage).toHaveBeenCalled();\r\n    });\r\n\r\n    it('should format 0% correctly', () => {\r\n      const result = formatPercent(0);\r\n      expect(result).toContain('0');\r\n      expect(result).toContain('%');\r\n    });\r\n\r\n    it('should format 100% correctly', () => {\r\n      const result = formatPercent(1);\r\n      expect(result).toContain('100');\r\n      expect(result).toContain('%');\r\n    });\r\n  });\r\n});\r\n"},"src/core/features.test.js":{"tests":[{"id":"384","name":"Feature Flags isFeatureEnabled should return false for unknown feature"},{"id":"385","name":"Feature Flags isFeatureEnabled should return true when phase is ENABLED"},{"id":"386","name":"Feature Flags isFeatureEnabled should use default context when not provided"},{"id":"387","name":"Feature Flags isFeatureEnabled localStorage overrides should return true when localStorage override is ENABLED"},{"id":"388","name":"Feature Flags isFeatureEnabled localStorage overrides should return false when localStorage override is DISABLED"},{"id":"389","name":"Feature Flags isFeatureEnabled localStorage overrides should ignore invalid localStorage values"},{"id":"390","name":"Feature Flags getFeaturePhase should return current phase for known feature"},{"id":"391","name":"Feature Flags getFeaturePhase should return UNKNOWN for unknown feature"},{"id":"392","name":"Feature Flags getFeaturePhase should return the exact current phase for known features"},{"id":"393","name":"Feature Flags FEATURE_FLAGS structure should have expected flags defined"},{"id":"394","name":"Feature Flags FEATURE_FLAGS structure each flag should have phase and description"},{"id":"395","name":"Feature Flags phase behaviors should return false when phase is DISABLED"},{"id":"396","name":"Feature Flags phase behaviors should return true only for settings context when phase is SETTINGS_ONLY"},{"id":"397","name":"Feature Flags phase behaviors should return true for all contexts when phase is ENABLED"},{"id":"398","name":"Feature Flags phase behaviors should return false for unknown phase (default case)"}],"source":"  import { describe, it, expect, beforeEach, afterEach } from 'vitest';\r\n  import { FEATURE_FLAGS, isFeatureEnabled, getFeaturePhase } from './features.js';\r\n\r\n  describe('Feature Flags', () => {\r\n\r\n    beforeEach(() => {\r\n      // Clear any test overrides before each test\r\n      localStorage.removeItem('__test_feature_SHOW_ADS');\r\n    });\r\n\r\n    afterEach(() => {\r\n      // Clean up after each test\r\n      localStorage.removeItem('__test_feature_SHOW_ADS');\r\n    });\r\n\r\n    describe('isFeatureEnabled', () => {\r\n\r\n      it('should return false for unknown feature', () => {\r\n        const result = isFeatureEnabled('UNKNOWN_FEATURE');\r\n        expect(result).toBe(false);\r\n      });\r\n\r\n      it('should return true when phase is ENABLED', () => {\r\n        // SHOW_ADS is ENABLED in all environments\r\n        expect(isFeatureEnabled('SHOW_ADS', 'settings')).toBe(true);\r\n        expect(isFeatureEnabled('SHOW_ADS', 'welcome')).toBe(true);\r\n        expect(isFeatureEnabled('SHOW_ADS', 'home')).toBe(true);\r\n      });\r\n\r\n      it('should use default context when not provided', () => {\r\n        // ENABLED should return true regardless of context\r\n        expect(isFeatureEnabled('SHOW_ADS')).toBe(true);\r\n      });\r\n\r\n      describe('localStorage overrides', () => {\r\n\r\n        it('should return true when localStorage override is ENABLED', () => {\r\n          // Temporarily set SHOW_ADS to DISABLED to verify override works\r\n          const originalPhase = FEATURE_FLAGS.SHOW_ADS.phase;\r\n          FEATURE_FLAGS.SHOW_ADS.phase = 'DISABLED';\r\n\r\n          localStorage.setItem('__test_feature_SHOW_ADS', 'ENABLED');\r\n          expect(isFeatureEnabled('SHOW_ADS')).toBe(true);\r\n\r\n          // Restore\r\n          FEATURE_FLAGS.SHOW_ADS.phase = originalPhase;\r\n        });\r\n\r\n        it('should return false when localStorage override is DISABLED', () => {\r\n          localStorage.setItem('__test_feature_SHOW_ADS', 'DISABLED');\r\n          expect(isFeatureEnabled('SHOW_ADS')).toBe(false);\r\n        });\r\n\r\n        it('should ignore invalid localStorage values', () => {\r\n          localStorage.setItem('__test_feature_SHOW_ADS', 'INVALID');\r\n          // Should fall back to the feature's actual phase\r\n          expect(isFeatureEnabled('SHOW_ADS')).toBe(true);\r\n        });\r\n\r\n      });\r\n\r\n    });\r\n\r\n    describe('getFeaturePhase', () => {\r\n\r\n      it('should return current phase for known feature', () => {\r\n        const phase = getFeaturePhase('SHOW_ADS');\r\n        expect(['DISABLED', 'SETTINGS_ONLY', 'ENABLED']).toContain(phase);\r\n      });\r\n\r\n      it('should return UNKNOWN for unknown feature', () => {\r\n        const phase = getFeaturePhase('UNKNOWN_FEATURE');\r\n        expect(phase).toBe('UNKNOWN');\r\n      });\r\n\r\n      it('should return the exact current phase for known features', () => {\r\n        // SHOW_ADS is ENABLED\r\n        expect(getFeaturePhase('SHOW_ADS')).toBe('ENABLED');\r\n      });\r\n\r\n    });\r\n\r\n    describe('FEATURE_FLAGS structure', () => {\r\n\r\n      it('should have expected flags defined', () => {\r\n        expect(FEATURE_FLAGS).toHaveProperty('SHOW_ADS');\r\n      });\r\n\r\n      it('each flag should have phase and description', () => {\r\n        Object.entries(FEATURE_FLAGS).forEach(([name, config]) => {\r\n          expect(config).toHaveProperty('phase');\r\n          expect(config).toHaveProperty('description');\r\n          expect(['DISABLED', 'SETTINGS_ONLY', 'ENABLED']).toContain(config.phase);\r\n          expect(typeof config.description).toBe('string');\r\n        });\r\n      });\r\n\r\n    });\r\n\r\n    describe('phase behaviors', () => {\r\n      let originalPhase;\r\n\r\n      beforeEach(() => {\r\n        originalPhase = FEATURE_FLAGS.SHOW_ADS.phase;\r\n      });\r\n\r\n      afterEach(() => {\r\n        FEATURE_FLAGS.SHOW_ADS.phase = originalPhase;\r\n      });\r\n\r\n      it('should return false when phase is DISABLED', () => {\r\n        FEATURE_FLAGS.SHOW_ADS.phase = 'DISABLED';\r\n\r\n        expect(isFeatureEnabled('SHOW_ADS', 'settings')).toBe(false);\r\n        expect(isFeatureEnabled('SHOW_ADS', 'welcome')).toBe(false);\r\n        expect(isFeatureEnabled('SHOW_ADS', 'home')).toBe(false);\r\n        expect(isFeatureEnabled('SHOW_ADS')).toBe(false);\r\n      });\r\n\r\n      it('should return true only for settings context when phase is SETTINGS_ONLY', () => {\r\n        FEATURE_FLAGS.SHOW_ADS.phase = 'SETTINGS_ONLY';\r\n\r\n        expect(isFeatureEnabled('SHOW_ADS', 'settings')).toBe(true);\r\n        expect(isFeatureEnabled('SHOW_ADS', 'welcome')).toBe(false);\r\n        expect(isFeatureEnabled('SHOW_ADS', 'home')).toBe(false);\r\n        expect(isFeatureEnabled('SHOW_ADS')).toBe(false); // default context\r\n      });\r\n\r\n      it('should return true for all contexts when phase is ENABLED', () => {\r\n        FEATURE_FLAGS.SHOW_ADS.phase = 'ENABLED';\r\n\r\n        expect(isFeatureEnabled('SHOW_ADS', 'settings')).toBe(true);\r\n        expect(isFeatureEnabled('SHOW_ADS', 'welcome')).toBe(true);\r\n        expect(isFeatureEnabled('SHOW_ADS', 'home')).toBe(true);\r\n        expect(isFeatureEnabled('SHOW_ADS')).toBe(true);\r\n      });\r\n\r\n      it('should return false for unknown phase (default case)', () => {\r\n        FEATURE_FLAGS.SHOW_ADS.phase = 'UNKNOWN_PHASE';\r\n\r\n        expect(isFeatureEnabled('SHOW_ADS', 'settings')).toBe(false);\r\n        expect(isFeatureEnabled('SHOW_ADS', 'welcome')).toBe(false);\r\n        expect(isFeatureEnabled('SHOW_ADS')).toBe(false);\r\n      });\r\n    });\r\n\r\n  });\r\n"},"src/services/cost-service.test.js":{"tests":[{"id":"399","name":"Cost Service isFreeModel should return true for models ending with :free"},{"id":"400","name":"Cost Service isFreeModel should return false for paid models"},{"id":"401","name":"Cost Service isFreeModel should return false for null/undefined/empty"},{"id":"402","name":"Cost Service isFreeModel should handle :free in the middle of model ID"},{"id":"403","name":"Cost Service getPaidEquivalent should strip :free suffix from model ID"},{"id":"404","name":"Cost Service getPaidEquivalent should return unchanged ID for already paid models"},{"id":"405","name":"Cost Service getPaidEquivalent should handle null/undefined"},{"id":"406","name":"Cost Service calculateEstimatedCost should calculate cost based on token counts and pricing"},{"id":"407","name":"Cost Service calculateEstimatedCost should return 0 when no pricing found"},{"id":"408","name":"Cost Service calculateEstimatedCost should handle zero tokens"},{"id":"409","name":"Cost Service calculateEstimatedCost should handle missing pricing values"},{"id":"410","name":"Cost Service formatCost should return \"Free\" for free models with zero cost"},{"id":"411","name":"Cost Service formatCost should show 4 decimal places for small costs"},{"id":"412","name":"Cost Service formatCost should show 2 decimal places for larger costs"},{"id":"413","name":"Cost Service formatCost should show $0.00 for zero cost on paid models"},{"id":"414","name":"Cost Service formatCost should handle edge case at exactly 0.01"},{"id":"415","name":"Cost Service getUsageSummary should return complete summary for free model"},{"id":"416","name":"Cost Service getUsageSummary should return summary for paid model without estimated cost"},{"id":"417","name":"Cost Service getUsageSummary should handle missing usage data gracefully"},{"id":"418","name":"Cost Service getUsageSummary should handle undefined usage values"},{"id":"419","name":"Cost Service getUsageSummary should not show estimated cost when pricing not available"}],"source":"import { describe, it, expect, vi, beforeEach } from 'vitest';\r\nimport {\r\n  isFreeModel,\r\n  getPaidEquivalent,\r\n  calculateEstimatedCost,\r\n  formatCost,\r\n  getUsageSummary\r\n} from './cost-service.js';\r\n\r\n// Mock model-service\r\nvi.mock('./model-service.js', () => ({\r\n  getModelPricing: vi.fn()\r\n}));\r\n\r\n// Mock logger\r\nvi.mock('../utils/logger.js', () => ({\r\n  logger: {\r\n    debug: vi.fn(),\r\n    error: vi.fn()\r\n  }\r\n}));\r\n\r\nimport { getModelPricing } from './model-service.js';\r\n\r\ndescribe('Cost Service', () => {\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  describe('isFreeModel', () => {\r\n    it('should return true for models ending with :free', () => {\r\n      expect(isFreeModel('meta-llama/llama-3-8b-instruct:free')).toBe(true);\r\n      expect(isFreeModel('google/gemma-2-9b-it:free')).toBe(true);\r\n    });\r\n\r\n    it('should return false for paid models', () => {\r\n      expect(isFreeModel('openai/gpt-4')).toBe(false);\r\n      expect(isFreeModel('anthropic/claude-3-opus')).toBe(false);\r\n    });\r\n\r\n    it('should return false for null/undefined/empty', () => {\r\n      expect(isFreeModel(null)).toBe(false);\r\n      expect(isFreeModel(undefined)).toBe(false);\r\n      expect(isFreeModel('')).toBe(false);\r\n    });\r\n\r\n    it('should handle :free in the middle of model ID', () => {\r\n      // Edge case: :free should only match at the end\r\n      expect(isFreeModel('provider/model:free-variant')).toBe(false);\r\n    });\r\n  });\r\n\r\n  describe('getPaidEquivalent', () => {\r\n    it('should strip :free suffix from model ID', () => {\r\n      expect(getPaidEquivalent('meta-llama/llama-3-8b-instruct:free'))\r\n        .toBe('meta-llama/llama-3-8b-instruct');\r\n    });\r\n\r\n    it('should return unchanged ID for already paid models', () => {\r\n      expect(getPaidEquivalent('openai/gpt-4'))\r\n        .toBe(
