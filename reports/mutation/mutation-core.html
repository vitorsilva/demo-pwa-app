ectStore('sessions', { keyPath: 'id', autoIncrement: true  });\r\n                sessionStore.createIndex('byTopicId', 'topicId');\r\n                sessionStore.createIndex('byTimestamp', 'timestamp');\r\n            }\r\n\r\n            // Create 'settings' object store\r\n            if (!db.objectStoreNames.contains('settings')) {\r\n                db.createObjectStore('settings', { keyPath: 'key' });\r\n            }\r\n        }   \r\n    });\r\n    return dbPromise; \r\n}\r\n\r\n// Get a reference to the database\r\nasync function getDB() {\r\n    if (!dbPromise) {\r\n        dbPromise = initDatabase();\r\n    }\r\n    return dbPromise;\r\n}\r\n\r\n// ========== TOPICS ==========\r\n\r\nexport async function saveTopic(topic) {\r\n    const db = await getDB();\r\n    return db.put('topics', topic);\r\n}\r\n\r\nexport async function getTopic(id) {\r\n    const db = await getDB();\r\n    return db.get('topics', id);\r\n}\r\n\r\nexport async function getAllTopics() {\r\n    const db = await getDB();\r\n    return db.getAll('topics');\r\n}\r\n\r\n  // ========== SESSIONS ==========\r\n\r\n  export async function saveSession(session) {\r\n    const db = await getDB();\r\n    return db.add('sessions', session);\r\n  }\r\n\r\n  export async function getSession(id) {\r\n    const db = await getDB();\r\n    return db.get('sessions', id);\r\n  }\r\n\r\n  export async function getSessionsByTopic(topicId) {\r\n    const db = await getDB();\r\n    return db.getAllFromIndex('sessions', 'byTopicId', topicId);\r\n  }\r\n\r\n  /**\r\n   * Get all sessions from the database\r\n   * @returns {Promise<"+"Array>} All session objects\r\n   */\r\n  export async function getAllSessions() {\r\n    const db = await getDB();\r\n    return db.getAll('sessions');\r\n  }\r\n\r\n  /**\r\n   * Normalize timestamp to numeric milliseconds.\r\n   * Handles: numbers, ISO strings, null, undefined, 0\r\n   * @param {number|string|null|undefined} ts - Timestamp value\r\n   * @returns {number} Normalized timestamp in milliseconds\r\n   */\r\n  export function normalizeTimestamp(ts) {\r\n    if (!ts) return 0;\r\n    if (typeof ts === 'number') return ts;\r\n    if (typeof ts === 'string') {\r\n      const parsed = Date.parse(ts);\r\n      return isNaN(parsed) ? 0 : parsed;\r\n    }\r\n    return 0;\r\n  }\r\n\r\n  export async function getRecentSessions(limit = 10) {\r\n    const db = await getDB();\r\n    const all = await db.getAll('sessions');\r\n\r\n    // Normalize and sort by timestamp descending (newest first)\r\n    all.sort((a, b) => {\r\n      const tsA = normalizeTimestamp(a.timestamp);\r\n      const tsB = normalizeTimestamp(b.timestamp);\r\n      return tsB - tsA;\r\n    });\r\n\r\n    return all.slice(0, limit);\r\n  }\r\n\r\n  export async function updateSession(id, updates) {\r\n    const db = await getDB();\r\n    const session = await db.get('sessions', id);\r\n    if (!session) return null;\r\n\r\n    const updatedSession = { ...session, ...updates };\r\n    await db.put('sessions', updatedSession);\r\n    return updatedSession;\r\n  }\r\n\r\n  /**\r\n   * Update a question's cached explanation in a session.\r\n   * Used to cache the rightAnswerExplanation for performance.\r\n   * @param {number} sessionId - The session ID\r\n   * @param {number} questionIndex - Index of the question in the session's questions array\r\n   * @param {string} rightAnswerExplanation - The explanation to cache\r\n   * @returns {Promise<"+"Object|null>} Updated session or null if not found\r\n   */\r\n  export async function updateQuestionExplanation(sessionId, questionIndex, rightAnswerExplanation) {\r\n    const db = await getDB();\r\n    const session = await db.get('sessions', sessionId);\r\n    if (!session) return null;\r\n\r\n    // Ensure questions array exists and index is valid\r\n    if (!session.questions || questionIndex <"+" 0 || questionIndex >= session.questions.length) {\r\n      return null;\r\n    }\r\n\r\n    // Update the specific question's rightAnswerExplanation\r\n    session.questions[questionIndex] = {\r\n      ...session.questions[questionIndex],\r\n      rightAnswerExplanation\r\n    };\r\n\r\n    await db.put('sessions', session);\r\n    return session;\r\n  }\r\n\r\n  /**\r\n   * Delete a single quiz session by ID\r\n   * @param {number} id - Session ID to delete\r\n   * @returns {Promise<"+"void>}\r\n   */\r\n  export async function deleteSession(id) {\r\n    const db = await getDB();\r\n    return db.delete('sessions', id);\r\n  }\r\n\r\n  /**\r\n   * Check if a quiz with the given source ID already exists.\r\n   * Used to detect duplicates when saving party quizzes.\r\n   * @param {string} sourceQuizId - The original quiz ID to check for\r\n   * @returns {Promise<"+"boolean>} True if quiz exists, false otherwise\r\n   */\r\n  export async function quizExistsBySourceId(sourceQuizId) {\r\n    const db = await getDB();\r\n    const allSessions = await db.getAll('sessions');\r\n    return allSessions.some(session => session.sourceQuizId === sourceQuizId);\r\n  }\r\n\r\n  /**\r\n   * Delete all sample sessions (used when reloading samples)\r\n   */\r\n  export async function deleteSampleSessions() {\r\n    const db = await getDB();\r\n    const allSessions = await db.getAll('sessions');\r\n\r\n    for (const session of allSessions) {\r\n      if (session.isSample) {\r\n        await db.delete('sessions', session.id);\r\n      }\r\n    }\r\n  }\r\n\r\n    // ========== SETTINGS ==========\r\n\r\n  export async function getSetting(key) {\r\n    const db = await getDB();\r\n    const setting = await db.get('settings', key);\r\n    return setting?.value;\r\n  }\r\n\r\n  export async function saveSetting(key, value) {\r\n    const db = await getDB();\r\n    return db.put('settings', { key, value });\r\n  }\r\n\r\n    // ========== OPENROUTER ==========\r\n\r\n  const OPENROUTER_KEY = 'openrouter_api_key';\r\n\r\n  /**\r\n   * Store OpenRouter API key\r\n   * @param {string} apiKey - The API key to store\r\n   */\r\n  export async function storeOpenRouterKey(apiKey) {\r\n    return saveSetting(OPENROUTER_KEY, {\r\n      key: apiKey,\r\n      storedAt: new Date().toISOString()\r\n    });\r\n  }\r\n\r\n  /**\r\n   * Get stored OpenRouter API key\r\n   * @returns {Promise<"+"string|null>} The API key or null if not found\r\n   */\r\n  export async function getOpenRouterKey() {\r\n    const data = await getSetting(OPENROUTER_KEY);\r\n    return data?.key || null;\r\n  }\r\n\r\n  /**\r\n   * Remove OpenRouter API key (disconnect)\r\n   */\r\n  export async function removeOpenRouterKey() {\r\n    const db = await getDB();\r\n    return db.delete('settings', OPENROUTER_KEY);\r\n  }\r\n\r\n  /**\r\n   * Check if user is connected to OpenRouter\r\n   * @returns {Promise<"+"boolean>}\r\n   */\r\n  export async function isOpenRouterConnected() {\r\n    const key = await getOpenRouterKey();\r\n    return !!key;\r\n  }\r\n\r\n  // ========== DATA MANAGEMENT ==========\r\n\r\n  /**\r\n   * Clear all user data from IndexedDB.\r\n   * Preserves sample sessions but clears all user-created data.\r\n   * @returns {Promise<"+"void>}\r\n   */\r\n  export async function clearAllUserData() {\r\n    const db = await getDB();\r\n\r\n    // Delete all non-sample sessions\r\n    const allSessions = await db.getAll('sessions');\r\n    for (const session of allSessions) {\r\n      if (!session.isSample) {\r\n        await db.delete('sessions', session.id);\r\n      }\r\n    }\r\n\r\n    // Clear all topics\r\n    const allTopics = await db.getAll('topics');\r\n    for (const topic of allTopics) {\r\n      await db.delete('topics', topic.id);\r\n    }\r\n\r\n    // Clear all settings\r\n    const tx = db.transaction('settings', 'readwrite');\r\n    await tx.store.clear();\r\n    await tx.done;\r\n  }"},"src/core/features.js":{"language":"javascript","mutants":[{"id":"149","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end": ort const DEFAULT_LANGUAGE = 'en';\r\n\r\n// Track initialization state\r\nlet isInitialized = false;\r\nlet initPromise = null;\r\n\r\n/**\r\n * Load translations for a language\r\n * Fetches from /locales/{lang}.json\r\n */\r\nasync function loadTranslations(lang) {\r\n    try {\r\n        // Handle language codes with regions (e.g., pt-PT -> pt-PT.json)\r\n        const response = await fetch(`${import.meta.env.BASE_URL}locales/${lang}.json`);\r\n        if (!response.ok) {\r\n            // Try base language if regional not found (e.g., pt-PT -> pt)\r\n            const baseLang = lang.split('-')[0];\r\n            if (baseLang !== lang) {\r\n                const baseResponse = await fetch(`${import.meta.env.BASE_URL}locales/${baseLang}.json`);\r\n                if (baseResponse.ok) {\r\n                    return await baseResponse.json();\r\n                }\r\n            }\r\n            throw new Error(`Translation file not found: ${lang}`);\r\n        }\r\n        return await response.json();\r\n    } catch (error) {\r\n        console.warn(`[i18n] Failed to load translations for ${lang}:`, error.message);\r\n        return null;\r\n    }\r\n}\r\n\r\n/**\r\n * Initialize i18next with configuration\r\n * Called automatically on first use\r\n */\r\nexport async function initI18n(options = {}) {\r\n    if (isInitialized) return i18next;\r\n    if (initPromise) return initPromise;\r\n\r\n    initPromise = (async () => {\r\n        // Load English translations (always available as fallback)\r\n        const enTranslations = await loadTranslations('en');\r\n\r\n        // Detect initial language\r\n        const detectedLang = options.lng ||\r\n            localStorage.getItem('i18nextLng') ||\r\n            navigator.language ||\r\n            DEFAULT_LANGUAGE;\r\n\r\n        // Normalize language code\r\n        const normalizedLang = normalizeLanguageCode(detectedLang);\r\n\r\n        // Load translations for detected language if not English\r\n        le across continues on same topic\r\n        continueChain: null  // { topic, continueCount, previousQuestions, startingGradeLevel }\r\n      };\r\n\r\n      this.listeners = [];  // Functions to call when state changes\r\n    }\r\n\r\n    /**\r\n     * Get a state value\r\n     * @param {string} key - State key to get\r\n     */\r\n    get(key) {\r\n      return this.data[key];\r\n    }\r\n\r\n    /**\r\n     * Set a state value\r\n     * @param {string} key - State key to set\r\n     * @param {*} value - Value to set\r\n     */\r\n    set(key, value) {\r\n      this.data[key] = value;\r\n      this.notify(key, value);\r\n    }\r\n\r\n    /**\r\n     * Update multiple state values at once\r\n     * @param {Object} updates - Object with key-value pairs to update\r\n     */\r\n    update(updates) {\r\n      Object.assign(this.data, updates);\r\n      this.notify('*', this.data);\r\n    }\r\n\r\n    /**\r\n     * Subscribe to state changes\r\n     * @param {Function} callback - Function to call when state changes\r\n     */\r\n    subscribe(callback) {\r\n      this.listeners.push(callback);\r\n    }\r\n\r\n    /**\r\n     * Notify all listeners of state change\r\n     */\r\n    notify(key, value) {\r\n      this.listeners.forEach(callback => callback(key, value));\r\n    }\r\n\r\n    /**\r\n     * Clear all state (useful for logout, reset)\r\n     */\r\n    clear() {\r\n      this.data = {\r\n        currentTopic: null,\r\n        currentGradeLevel: 'middle school',\r\n        currentQuestions: null,\r\n        currentAnswers: [],\r\n        currentScore: null,\r\n        lastSessionId: null,\r\n        continueChain: null\r\n      };\r\n      this.notify('*', this.data);\r\n    }\r\n\r\n    /**\r\n     * Initialize a continue chain for a topic\r\n     * @param {string} topic - Topic being continued\r\n     * @param {string} gradeLevel - Starting grade level\r\n     * @param {Array} questions - Initial questions\r\n     */\r\n    initContinueChain(topic, gradeLevel, questions) {\r\n      this.data.continueChain = {\r\n        topic,\r\n        continueCount: 0,\r\n        previousQuestions: questions.map(q => q.question),\r\n        startingGradeLevel: gradeLevel\r\n      };\r\n    }\r\n\r\n    /**\r\n     * Add questions to the continue chain\r\n     * @param {Array} questions - New questions to add\r\n     */\r\n    addToContinueChain(questions) {\r\n      if (this.data.continueChain) {\r\n        this.data.continueChain.continueCount++;\r\n        this.data.continueChain.previousQuestions.push(\r\n          ...questions.map(q => q.question)\r\n        );\r\n      }\r\n    }\r\n\r\n    /**\r\n     * Clear the continue chain\r\n     */\r\n    clearContinueChain() {\r\n      this.data.continueChain = null;\r\n    }\r\n\r\n    /**\r\n     * Get the continue chain data\r\n     */\r\n    getContinueChain() {\r\n      return this.data.continueChain;\r\n    }\r\n  }\r\n\r\n  // Export singleton instance\r\n  export default new AppState();"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":null},"testFiles":{"src/core/db.test.js":{"tests":[{"id":"0","name":"Database Initialization should create database with all object stores"},{"id":"1","name":"Topics CRUD Operations should save and retrieve a topic"},{"id":"2","name":"Topics CRUD Operations should return undefined for non-existent topic"},{"id":"3","name":"Topics CRUD Operations should update existing topic using saveTopic"},{"id":"4","name":"Topics CRUD Operations should retrieve all topics"},{"id":"5","name":"Sessions CRUD Operations should save session and auto-generate ID"},{"id":"6","name":"Sessions CRUD Operations should generate sequential IDs for multiple sessions"},{"id":"7","name":"Sessions CRUD Operations should retrieve session by ID"},{"id":"8","name":"Sessions CRUD Operations should get all sessions for a specific topic"},{"id":"9","name":"Sessions CRUD Operations should get recent sessions sorted by timestamp"},{"id":"10","name":"Sessions CRUD Operations teQuestionExplanation should return null for invalid question index (out of bounds)"},{"id":"35","name":"updateQuestionExplanation should return null when session has no questions array"},{"id":"36","name":"updateQuestionExplanation should preserve other question properties when adding explanation"},{"id":"37","name":"deleteSession should delete a session by ID"},{"id":"38","name":"deleteSession should not throw if session does not exist"},{"id":"39","name":"deleteSession should only delete the specified session"},{"id":"40","name":"deleteSession should delete sample sessions too"},{"id":"41","name":"deleteSampleSessions should delete all sample sessions"},{"id":"42","name":"deleteSampleSessions should do nothing when no sample sessions exist"},{"id":"43","name":"deleteSampleSessions should handle empty database"},{"id":"44","name":"getRecentSessions - mixed timestamp sorting returns sessions sorted by timestamp descending (newest first)"},{"id":"45","name":"getRecentSessions - mixed timestamp sorting handles sessions with null/zero timestamps"},{"id":"46","name":"getRecentSessions - mixed timestamp sorting handles mixed timestamp types (string ISO and number)"},{"id":"47","name":"normalizeTimestamp returns number timestamps unchanged"},{"id":"48","name":"normalizeTimestamp converts ISO string to number"},{"id":"49","name":"normalizeTimestamp returns 0 for null/undefined"},{"id":"50","name":"normalizeTimestamp returns 0 for invalid strings"},{"id":"51","name":"normalizeTimestamp returns 0 for zero"},{"id":"52","name":"quizExistsBySourceId should return true when quiz with sourceQuizId exists"},{"id":"53","name":"quizExistsBySourceId should return false when quiz with sourceQuizId does not exist"},{"id":"54","name":"quizExistsBySourceId should return false for empty database"},{"id":"55","name":"quizExistsBySourceId should distinguish between different sourceQuizIds"}],"source":" // db.test.js - Unit tests for IndexedDB wrapper\r\n\r\nimport { beforeEach, describe, expect, it } from 'vitest';\r\n\r\n// Set up fake-indexeddb before importing db.js\r\nimport 'fake-indexeddb/auto';\r\n\r\n// Import functions to test\r\nimport {\r\n    initDatabase,\r\n    saveTopic,\r\n    getTopic,\r\n    getAllTopics,\r\n    saveSession,\r\n    getSession,\r\n    getAllSessions,\r\n    getSessionsByTopic,\r\n    getRecentSessions,\r\n    updateSession,\r\n    updateQuestionExplanation,\r\n    deleteSession,\r\n    deleteSampleSessions,\r\n    getSetting,\r\n    saveSetting,\r\n    storeOpenRouterKey,\r\n    getOpenRouterKey,\r\n    removeOpenRouterKey,\r\n    isOpenRouterConnected,\r\n    clearAllUserData,\r\n    normalizeTimestamp,\r\n    DB_NAME,\r\n    DB_VERSION\r\n  } from './db.js';\r\n\r\n  describe('Database Initialization', () => {\r\n    it('should create database with all object stores', async () => {\r\n        const db = await initDatabase();\r\n\r\n        // First, verify db was returned\r\n        expect(db).toBeDefined();\r\n        expect(db).not.toBeNull();\r\n \r\n        // Check if all object stores were created\r\n        expect(db.objectStoreNames.contains('topics')).toBe(true);        \r\n        expect(db.objectStoreNames.contains('sessions')).toBe(true);      \r\n        expect(db.objectStoreNames.contains('settings')).toBe(true);  \r\n    });\r\n  });\r\n\r\n   describe('Topics CRUD Operations', () => {\r\n    beforeEach(async () => {\r\n     // Clean slate before each test\r\n      indexedDB.deleteDatabase(DB_NAME);\r\n    });\r\n\r\n    it('should save and retrieve a topic', async () => {\r\n      //await initDatabase();\r\n\r\n      const topic = {\r\n        id: 'math',\r\n        name: 'Mathematics',\r\n        gradeLevel: '5th Grade',\r\n        createdAt: Date.now(),\r\n        lastPracticed: Date.now(),\r\n        totalQuestions: 10,\r\n        correctAnswers: 8\r\n      };\r\n\r\n      await saveTopic(topic);\r\n      const retrieved = await getTopic('math');\r\n\r\n      expect(retrieved).toEqual(topic);\r\n    }); \r\n\r\n    it('should return undefined for non-existent topic', async () => {\r\n      const retrieved = await getTopic('nonexistent');\r\n      expect(retrieved).toBeUndefined();\r\n    });\r\n\r\n    it('should update existing topic using saveTopic', async () => {\r\n      const topic = {\r\n        id: 'science',\r\n        name: 'Science',\r\n        totalQuestions: 5,\r\n        correctAnswers: 3\r\n      };\r\n\r\n      await saveTopic(topic);\r\n\r\n      // Update with more questions\r\n      const updated = {\r\n        id: 'science',\r\n        name: 'Science',\r\n        totalQuestions: 10,\r\n        correctAnswers: 7\r\n      };\r\n\r\n      await saveTopic(updated);\r\n      const retrieved = await getTopic('science');\r\n\r\n      expect(retrieved.totalQuestions).toBe(10);\r\n      expect(retrieved.correctAnswers).toBe(7);\r\n    });\r\n\r\n    it('should retrieve all topics', async () => {\r\n      await saveTopic({ id: 'math', name: 'Math' });\r\n      await saveTopic({ id: 'science', name: 'Science' });\r\n      await saveTopic({ id: 'history', name: 'History' });\r\n\r\n      const allTopics = await getAllTopics();\r\n\r\n      expect(allTopics).toHaveLength(3);\r\n      expect(allTopics.map(t => t.id)).toContain('math');\r\n      expect(allTopics.map(t => t.id)).toContain('science');\r\n      expect(allTopics.map(t => t.id)).toContain('history');\r\n    });\r\n\r\n  });\r\n\r\ndescribe('Sessions CRUD Operations', () => {\r\n    beforeEach(async () => {\r\n     // Clean slate before each test\r\n      indexedDB.deleteDatabase(DB_NAME);\r\n    });\r\n\r\n    it('should save session and auto-generate ID', async () => {      \r\n      const session = {\r\n        topicId: 'math',\r\n        timestamp: Date.now(),\r\n        score: 4,\r\n        totalQuestions: 5,\r\n        questions: []\r\n      };\r\n\r\n      const id = await saveSession(session);\r\n\r\n      expect(id).toBe(1);  // First session gets ID 1\r\n    });\r\n \r\n    it('should generate sequential IDs for multiple sessions',        \r\n  async () => {\r\n      const session1 = { topicId: 'math', timestamp: Date.now(),      \r\n  score: 3, totalQuestions: 5 };\r\n      const session2 = { topicId: 'science', timestamp:\r\n  Date.now(), score: 4, totalQuestions: 5 };\r\n      const session3 = { topicId: 'math', timestamp: Date.now(),      \r\n  score: 5, totalQuestions: 5 };\r\n\r\n      const id1 = await saveSession(session1);\r\n      const id2 = await saveSession(session2);\r\n      const id3 = await saveSession(session3);\r\n\r\n      //expect(id1).toBe(1);\r\n      expect(id2).toBe(Number(id1) + 1);\r\n      expect(id3).toBe(Number(id1) + 2);\r\n    });\r\n\r\n    it('should retrieve session by ID', async () => {\r\n      const session = {\r\n        topicId: 'history',\r\n        timestamp: Date.now(),\r\n        score: 5,\r\n        totalQuestions: 5\r\n      };\r\n\r\n      const id = await saveSession(session);\r\n      const retrieved = await getSession(id);\r\n\r\n      expect(retrieved.id).toBe(id);\r\n      expect(retrieved.topicId).toBe('history');\r\n      expect(retrieved.score).toBe(5);\r\n    });\r\n\r\n    it('should get all sessions for a specific topic', async () =>    \r\n   {\r\n     indexedDB.deleteDatabase(DB_NAME);\r\n\r\n      await saveSession({ topicId: 'math1', timestamp: Date.now(), score: 4 });\r\n      await saveSession({ topicId: 'science', timestamp: Date.now(), score: 3 });\r\n      await saveSession({ topicId: 'math1', timestamp: Date.now(), score: 5 });\r\n      await saveSession({ topicId: 'history', timestamp: Date.now(), score: 4 });\r\n\r\n      const mathSessions = await getSessionsByTopic('math1');\r\n\r\n      expect(mathSessions).toHaveLength(2);\r\n      expect(mathSessions.every(s => s.topicId === 'math1')).toBe(true);\r\n    });\r\n\r\n    it('should get recent sessions sorted by timestamp', async () => {\r\n      const now = Date.now();\r\n\r\n      await saveSession({ topicId: 'math', timestamp: now + 10000, score: 3 });\r\n      await saveSession({ topicId: 'science', timestamp: now + 5000, score: 4 });\r\n      await saveSession({ topicId: 'history', timestamp: now + 3000, score: 5 });\r\n\r\n      const recent = await getRecentSessions(10);\r\n\r\n      // Most recent first\r\n      expect(recent[0].timestamp).toBeGreaterThan(recent[1].timestamp);\r\n      expect(recent[1].timestamp).toBeGreaterThan(recent[2].timestamp);\r\n    });\r\n\r\n\r\n    it('should limit recent sessions to specified amount', async () => {\r\n      const now = Date.now();\r\n\r\n      for (let i = 0; i <"+" 10; i++) {\r\n        await saveSession({ topicId: 'math', timestamp: now + i, score: 5 });\r\n      }\r\n\r\n      const recent = await getRecentSessions(5);\r\n\r\n      expect(recent).toHaveLength(5);\r\n    });\r\n  });  \r\n  \r\n    describe('updateSession - Quiz Replay', () => {\r\n      beforeEach(async () => {\r\n        // Clean slate before each test\r\n        indexedDB.deleteDatabase(DB_NAME);\r\n      });\r\n\r\n      it('should update existing session with new data', async () => {\r\n        // Arrange: Create a session\r\n        const session = {\r\n          topicId: 'math',\r\n          topic: 'Mathematics',\r\n          timestamp: Date.now(),\r\n          score: 3,\r\n          totalQuestions: 5,\r\n          questions: [],\r\n          userAnswers: [0, 1, 2, 0, 1]\r\n        };\r\n\r\n        const sessionId = await saveSession(session);\r\n\r\n        // Act: Update the session with better score\r\n        const updated = await updateSession(sessionId, {\r\n          score: 5,\r\n          userAnswers: [0, 1, 2, 3, 4]\r\n        });\r\n\r\n        // Assert: Score should be updated\r\n        expect(updated).not.toBeNull();\r\n        expect(updated.score).toBe(5);\r\n        expect(updated.topic).toBe('Mathematics'); // Other fields unchanged\r\n        expect(updated.userAnswers).toEqual([0, 1, 2, 3, 4]);\r\n      });\r\n\r\n      it('should retu ct(await getSetting('apiKey')).toBeUndefined();\r\n        expect(await getSetting('theme')).toBeUndefined();\r\n      });\r\n\r\n      it('should preserve sample sessions', async () => {\r\n        await clearAllUserData();\r\n\r\n        // Count existing sample sessions\r\n        const beforeSamples = (await getAllSessions()).filter(s => s.isSample).length;\r\n\r\n        // Create new sample sessions\r\n        await saveSession({ topicId: 'sample1', timestamp: Date.now(), score: 10, isSample: true });\r\n        await saveSession({ topicId: 'sample2', timestamp: Date.now(), score: 8, isSample: true });\r\n\r\n        // Also create a non-sample session\r\n        await saveSession({ topicId: 'user-session', timestamp: Date.now(), score: 5 });\r\n\r\n        await clearAllUserData();\r\n\r\n        const sessions = await getAllSessions();\r\n        // Should have the new samples plus any existing ones\r\n        expect(sessions.length).toBe(beforeSamples + 2);\r\n        expect(sessions.every(s => s.isSample)).toBe(true);\r\n      });\r\n\r\n      it('should handle database with only samples gracefully', async () => {\r\n        // clearAllUserData preserves sample sessions, so after clearing\r\n        // we may still have samples from previous tests\r\n        await clearAllUserData();\r\n\r\n        // Should not throw\r\n        const sessions = await getAllSessions();\r\n        const topics = await getAllTopics();\r\n\r\n        // All remaining sessions should be samples (if any)\r\n        expect(sessions.every(s => s.isSample)).toBe(true);\r\n        // Topics should be empty\r\n        expect(topics).toEqual([]);\r\n      });\r\n  }); \r\n\r\n      describe('updateQuestionExplanation', () => {\r\n        beforeEach(async () => {\r\n          indexedDB.deleteDatabase(DB_NAME);\r\n        });\r\n\r\n        it('should update a question explanation', async () => {\r\n          // Create session with questions\r\n          const sessionId = await saveSession({\r\n            topicId: 'math',\r\n            timestamp: Date.now(),\r\n            score: 3,\r\n            totalQuestions: 2,\r\n            questions: [\r\n              { question: 'What is 2+2?', options: ['3', '4', '5', '6'], correct: 1 },\r\n              { question: 'What is 3+3?', options: ['5', '6', '7', '8'], correct: 1 }\r\n            ]\r\n          });\r\n\r\n          // Update first question's explanation\r\n          const updated = await updateQuestionExplanation(sessionId, 0, 'Because 2+2=4');\r\n\r\n          expect(updated).not.toBeNull();\r\n          expect(updated.questions[0].rightAnswerExplanation).toBe('Because 2+2=4');\r\n          expect(updated.questions[1].rightAnswerExplanation).toBeUndefined();\r\n        });\r\n\r\n        it('should return null for non-existent session', async () => {\r\n          const result = await updateQuestionExplanation(99999, 0, 'Explanation');\r\n          expect(result).toBeNull();\r\n        });\r\n\r\n        it('should return null for invalid question index (negative)', async () => {\r\n          const sessionId = await saveSession({\r\n            topicId: 'math',\r\n            timestamp: Date.now(),\r\n            score: 1,\r\n            totalQuestions: 1,\r\n            questions: [{ question: 'Q1', options: ['A'], correct: 0 }]\r\n          });\r\n\r\n          const result = await updateQuestionExplanation(sessionId, -1, 'Explanation');\r\n          expect(result).toBeNull();\r\n        });\r\n\r\n        it('should return null for invalid question index (out of bounds)', async () => {\r\n          const sessionId = await saveSession({\r\n            topicId: 'math',\r\n            timestamp: Date.now(),\r\n            score: 1,\r\n            totalQuestions: 1,\r\n            questions: [{ question: 'Q1', options: ['A'], correct: 0 }]\r\n          });\r\n\r\n          const result = await updateQuestionExplanation(sessionId, 5, 'Explanation');\r\n          expect(result).toBeNull();\r\n        });\r\n\r\n        it('should return null when session has no questions array', async () => {\r\n          const sessionId = await saveSession({\r\n            topicId: 'math',\r\n            timestamp: Date.now(),\r\n            score: 0,\r\n            totalQuestions: 0\r\n            // No questions array\r\n          });\r\n\r\n          const result = await updateQuestionExplanation(sessionId, 0, 'Explanation');\r\n          expect(result).toBeNull();\r\n        });\r\n\r\n        it('should preserve other question properties when adding explanation', async () => {\r\n          const sessionId = await saveSession({\r\n            topicId: 'science',\r\n            timestamp: Date.now(),\r\n            score: 1,\r\n            totalQuestions: 1,\r\n            questions: [{\r\n              question: 'What is H2O?',\r\n              options: ['Water', 'Air', 'Fire', 'Earth'],\r\n              correct: 0,\r\n              userAnswer: 0\r\n            }]\r\n          });\r\n\r\n          await updateQuestionExplanation(sessionId, 0, 'H2O is the chemical formula for water');\r\n\r\n          const session = await getSession(sessionId);\r\n          expect(session.questions[0].question).toBe('What is H2O?');\r\n          expect(session.questions[0].correct).toBe(0);\r\n          expect(session.questions[0].userAnswer).toBe(0);\r\n          expect(session.questions[0].rightAnswerExplanation).toBe('H2O is the chemical formula for water');\r\n        });\r\n      });\r\n\r\n      describe('deleteSession', () => {\r\n        beforeEach(async () => {\r\n          indexedDB.deleteDatabase(DB_NAME);\r\n        });\r\n\r\n        it('should delete a session by ID', async () => {\r\n          const sessionId = await saveSession({\r\n            topicId: 'math',\r\n            topic: 'Mathematics',\r\n            timestamp: Date.now(),\r\n            score: 5,\r\n            totalQuestions: 5\r\n          });\r\n\r\n          // Verify session exists\r\n          let session = await getSession(sessionId);\r\n          expect(session).toBeDefined();\r\n\r\n          // Delete the session\r\n          await deleteSession(sessionId);\r\n\r\n          // Verify session is gone\r\n          session = await getSession(sessionId);\r\n          expect(session).toBeUndefined();\r\n        });\r\n\r\n        it('should not throw if session does not exist', async () => {\r\n          // Should not throw when deleting non-existent session\r\n          await expect(deleteSession(99999)).resolves.not.toThrow();\r\n        });\r\n\r\n        it('should only delete the specified session', async () => {\r\n          // Clear any leftover data first\r\n          await clearAllUserData();\r\n          await deleteSampleSessions();\r\n\r\n          const id1 = await saveSession({ topicId: 'math', timestamp: Date.now(), score: 5 });\r\n          const id2 = await saveSession({ topicId: 'science', timestamp: Date.now(), score: 8 });\r\n          const id3 = await saveSession({ topicId: 'history', timestamp: Date.now(), score: 7 });\r\n\r\n          // Delete only the second session\r\n          await deleteSession(id2);\r\n\r\n          // Verify only id2 is deleted\r\n          expect(await getSession(id1)).toBeDefined();\r\n          expect(await getSession(id2)).toBeUndefined();\r\n          expect(await getSession(id3)).toBeDefined();\r\n\r\n          // Verify total count\r\n          const allSessions = await getAllSessions();\r\n          expect(allSessions).toHaveLength(2);\r\n        });\r\n\r\n        it('should delete sample sessions too', async () => {\r\n          const sampleId = await saveSession({\r\n            topicId: 'sample',\r\n            timestamp: Date.now(),\r\n            score: 10,\r\n            isSample: true\r\n          });\r\n\r\n          // Verify sample session exists\r\n          let session = await getSession(sampleId);\r\n          expect(session).toBeDefined();\r\n          expect(session.isSample).toBe(true);\r\n\r\n          // Delete the sample session\r\n          await deleteSession(sampleId);\r\n\r\n          // Verify it's gone\r\n          session = await getSession(sampleId);\r\n          expect(session).toBeUndefined();\r\n        });\r\n      });\r\n\r\n      describe('deleteSampleSessions', () => {\r\n        beforeEach(async () => {\r\n          // Clear everything including samples for a clean slate\r\n          await clearAllUserData();\r\n          await deleteSampleSessions();\r\n        });\r\n\r\n        it('should delete all sample sessions', async () => {\r\n          // Create mix of sample and non-sample sessions\r\n          await saveSession({ topicId: 'user1', timestamp: Date.now(), score: 5 });\r\n          await saveSession({ topicId: 'sample1', timestamp: Date.now(), score: 10, isSample: true });   \r\n          await saveSession({ topicId: 'sample2', timestamp: Date.now(), score: 8, isSample: true });    \r\n          await saveSession({ topicId: 'user2', timestamp: Date.now(), score: 7 });\r\n\r\n          let sessions = await getAllSessions();\r\n          expect(sessions).toHaveLength(4);\r\n\r\n          await deleteSampleSessions();\r\n\r\n          sessions = await getAllSessions();\r\n          expect(sessions).toHaveLength(2);\r\n          expect(sessions.every(s => !s.isSample)).toBe(true);\r\n        });\r\n\r\n        it('should do nothing when no sample sessions exist', async () => {\r\n          await saveSession({ topicId: 'user1', timestamp: Date.now(), score: 5 });\r\n          await saveSession({ topicId: 'user2', timestamp: Date.now(), score: 7 });\r\n\r\n          await deleteSampleSessions();\r\n\r\n          const sessions = await getAllSessions();\r\n          expect(sessions).toHaveLength(2);\r\n        });\r\n\r\n        it('should handle empty database', async () => {\r\n          // Should not throw\r\n          await deleteSampleSessions();\r\n\r\n          const sessions = await getAllSessions();\r\n          expect(sessions).toHaveLength(0);\r\n        });\r\n      });\r\n\r\n      describe('getRecentSessions - mixed timestamp sorting', () => {\r\n        beforeEach(async () => {\r\n          // Clear all data before each test to ensure isolation\r\n          await clearAllUserData();\r\n          await deleteSampleSessions();\r\n        });\r\n\r\n        it('returns sessions sorted by timestamp descending (newest first)', async () => {\r\n          const now = Date.now();\r\n          await saveSession({ topic: 'Old Quiz', timestamp: now - 86400000 * 7 }); // 7 days ago\r\n          await saveSession({ topic: 'Today Quiz', timestamp: now });\r\n          await saveSession({ topic: 'Yesterday Quiz', timestamp: now - 86400000 }); // 1 day ago\r\n\r\n          const sessions = await getRecentSessions(10);\r\n\r\n          expect(sessions[0].topic).toBe('Today Quiz');\r\n          expect(sessions[1].topic).toBe('Yesterday Quiz');\r\n          expect(sessions[2].topic).toBe('Old Quiz');\r\n        });\r\n\r\n        it('handles sessions with null/zero timestamps', async () => {\r\n          const now = Date.now();\r\n          await saveSession({ topic: 'No Timestamp', timestamp: 0 });\r\n          await saveSession({ topic: 'Recent', timestamp: now });\r\n\r\n          const sessions = await getRecentSessions(10);\r\n\r\n          expect(sessions[0].topic).toBe('Recent');\r\n          expect(sessions[1].topic).toBe('No Timestamp');\r\n        });\r\n\r\n        it('handles mixed timestamp types (string ISO and number)', async () => {\r\n          const now = Date.now();\r\n          const lastWeekISO = new Date(now - 86400000 * 7).toISOString(); // String (legacy)\r\n\r\n          await saveSession({ topic: 'Last Week Import', timestamp: lastWeekISO }); // String\r\n          await saveSession({ topic: 'Today Played', timestamp: now }); // Number\r\n          await saveSession({ topic: 'Yesterday Played', timestamp: now - 86400000 }); // Number\r\n\r\n          const sessions = await getRecentSessions(10);\r\n\r\n          // Should sort by actual date value, not data type\r\n          expect(sessions[0].topic).toBe('Today Played');\r\n          expect(sessions[1].topic).toBe('Yesterday Played');\r\n          expect(sessions[2].topic).toBe('Last Week Import');\r\n        });\r\n      });\r\n\r\n      describe('normalizeTimestamp', () => {\r\n        it('returns number timestamps unchanged', () => {\r\n          expect(normalizeTimestamp(1737072000000)).toBe(1737072000000);\r\n        });\r\n\r\n        it('converts ISO string to number', () => {\r\n          const iso = '2026-01-16T12:00:00.000Z';\r\n          expect(normalizeTimestamp(iso)).toBe(Date.parse(iso));\r\n        });\r\n\r\n        it('returns 0 for null/undefined', () => {\r\n          expect(normalizeTimestamp(null)).toBe(0);\r\n          expect(normalizeTimestamp(undefined)).toBe(0);\r\n        });\r\n\r\n        it('returns 0 for invalid strings', () => {\r\n          expect(normalizeTimestamp('not-a-date')).toBe(0);\r\n        });\r\n\r\n        it('returns 0 for zero', () => {\r\n          expect(normalizeTimestamp(0)).toBe(0);\r\n        });\r\n      });\r\n\r\n      describe('quizExistsBySourceId', () => {\r\n        beforeEach(async () => {\r\n          indexedDB.deleteDatabase(DB_NAME);\r\n        });\r\n\r\n        it('should return true when quiz with sourceQuizId exists', async () => {\r\n          // Import the function\r\n          const { quizExistsBySourceId } = await import('./db.js');\r\n\r\n          // Save a session with a sourceQuizId\r\n          await saveSession({\r\n            sourceQuizId: 'party-quiz-123',\r\n            topicId: 'math',\r\n            timestamp: Date.now(),\r\n            score: 5\r\n          });\r\n\r\n          const exists = await quizExistsBySourceId('party-quiz-123');\r\n          expect(exists).toBe(true);\r\n        });\r\n\r\n        it('should return false when quiz with sourceQuizId does not exist', async () => {\r\n          const { quizExistsBySourceId } = await import('./db.js');\r\n\r\n          // Save a session without sourceQuizId\r\n          await saveSession({\r\n            topicId: 'math',\r\n            timestamp: Date.now(),\r\n            score: 5\r\n          });\r\n\r\n          const exists = await quizExistsBySourceId('nonexistent-quiz-id');\r\n          expect(exists).toBe(false);\r\n        });\r\n\r\n        it('should return false for empty database', async () => {\r\n          const { quizExistsBySourceId } = await import('./db.js');\r\n\r\n          const exists = await quizExistsBySourceId('any-quiz-id');\r\n          expect(exists).toBe(false);\r\n        });\r\n\r\n        it('should distinguish between different sourceQuizIds', async () => {\r\n          const { quizExistsBySourceId } = await import('./db.js');\r\n\r\n          await saveSession({\r\n            sourceQuizId: 'quiz-A',\r\n            topicId: 'math',\r\n            timestamp: Date.now(),\r\n            score: 5\r\n          });\r\n\r\n          await saveSession({\r\n            sourceQuizId: 'quiz-B',\r\n            topicId: 'science',\r\n            timestamp: Date.now(),\r\n            score: 8\r\n          });\r\n\r\n          expect(await quizExistsBySourceId('quiz-A')).toBe(true);\r\n          expect(await quizExistsBySourceId('quiz-B')).toBe(true);\r\n          expect(await quizExistsBySourceId('quiz-C')).toBe(false);\r\n        });\r\n      });\r\n"},"src/services/data-service.test.js":{"tests":[{"id":"56","name":"Data Service deleteAllUserData should clear IndexedDB user data"},{"id":"57","name":"Data Service deleteAllUserData should clear localStorage keys"},{"id":"58","name":"Data Service deleteAllUserData should clear sessionStorage keys"},{"id":"59","name":"Data Service deleteAllUserData should reset in-memory state"},{"id":"60","name":"Data Service deleteAllUserData should reload sample quizzes"},{"id":"61","name":"Data Service deleteAllUserData should execute in correct order"},{"id":"62","name":"Data Service deleteAllUserData should log info messages"},{"id":"63","name":"Data Service deleteAllUserData should log debug messages for each step"},{"id":"64","name":"Data Service deleteAllUserData should throw and log error if deletion fails"},{"id":"65","name":"Data Service deleteAllUserData should not reload samples if clearing fails"}],"source":"/**\r\n * Unit tests for data-service.js\r\n */\r\nimport { describe, it, expect, vi, beforeEach, afterEach } from 'vitest';\r\n\r\n// Mock all dependencies\r\nvi.mock('../core/db.js', () => ({\r\n  clearAllUserData: vi.fn()\r\n}));\r\n\r\nvi.mock('../features/sample-loader.js', () => ({\r\n  loadSamplesIfNeeded: vi.fn()\r\n}));\r\n\r\nvi.mock('../core/state.js', () => ({\r\n  default: {\r\n    clear: vi.fn()\r\n  }\r\n}));\r\n\r\nvi.mock('../utils/logger.js', () => ({\r\n  logger: {\r\n    info: vi.fn(),\r\n    debug: vi.fn(),\r\n    error: vi.fn()\r\n  }\r\n}));\r\n\r\nimport { deleteAllUserData } from './data-service.js';\r\nimport { clearAllUserData } from '../core/db.js';\r\nimport { loadSamplesIfNeeded } from '../features/sample-loader.js';\r\nimport state from '../core/state.js';\r\nimport { logger } from '../utils/logger.js';\r\n\r\ndescribe('Data Service', () => {\r\n  let originalLocalStorage;\r\n  let originalSessionStorage;\r\n  let localStorageData;\r\n  let sessionStorageData;\r\n\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n\r\n    // Mock localStorage\r\n    localStorageData = {};\r\n    originalLocalStorage = global.localStorage;\r\n    global.localStorage = {\r\n      getItem: vi.fn((key) => localStorageData[key] || null),\r\n      setItem: vi.fn((key, value) => { localStorageData[key] = value; }),\r\n      removeItem: vi.fn((key) => { delete localStorageData[key]; }),\r\n      clear: vi.fn(() => { localStorageData = {}; })\r\n    };\r\n\r\n    // Mock sessionStorage\r\n    sessionStorageData = {};\r\n    originalSessionStorage = global.sessionStorage;\r\n    global.sessionStorage = {\r\n      getItem: vi.fn((key) => sessionStorageData[key] || null),\r\n      setItem: vi.fn((key, value) => { sessionStorageData[key] = value; }),\r\n      removeItem: vi.fn((key) => { delete sessionStorageData[key]; }),\r\n      clear: vi.fn(() => { sessionStorageData = {}; })\r\n    };\r\n  });\r\n\r\n  afterEach(() => {\r\n    global.localStorage = originalLocalStorage;\r\n    global.sessionStorage = originalSessionStorage;\r\n  });\r\n\r\n  describe('deleteAllUserData', () => {\r\n    it('should clear IndexedDB user data', async () => {\r\n      await deleteAllUserData();\r\n\r\n      expect(clearAllUserData).toHaveBeenCalledTimes(1);\r\n    });\r\n\r\n    it('should clear localStorage keys', async () => {\r\n      // Set up localStorage with data\r\n      localStorageData = {\r\n        'quizmaster_settings': '{}',\r\n        'openrouter_models_cache': '[]',\r\n        'i18nextLng': 'en',\r\n        'saberloop_telemetry_queue': '[]',\r\n        'other_key': 'should not be removed'\r\n      };\r\n\r\n      await deleteAllUserData();\r\n\r\n      // Verify app-specific keys were removed\r\n      expect(localStorage.removeItem).toHaveBeenCalledWith('quizmaster_settings');\r\n      expect(localStorage.removeItem).toHaveBeenCalledWith('openrouter_models_cache');\r\n      expect(localStorage.removeItem).toHaveBeenCalledWith('i18nextLng');\r\n      expect(localStorage.removeItem).toHaveBeenCalledWith('saberloop_telemetry_queue');\r\n    });\r\n\r\n    it('should clear sessionStorage keys', async () => {\r\n      sessionStorageData = {\r\n        'openrouter_code_verifier': 'test-verifier'\r\n      };\r\n\r\n      await deleteAllUserData();\r\n\r\n      expect(sessionStorage.removeItem).toHaveBeenCalledWith('openrouter_code_verifier');\r\n    });\r\n\r\n    it('should reset in-memory state', async () => {\r\n      await deleteAllUserData();\r\n\r\n      expect(state.clear).toHaveBeenCalledTimes(1);\r\n    });\r\n\r\n    it('should reload sample quizzes', async () => {\r\n      await deleteAllUserData();\r\n\r\n      expect(loadSamplesIfNeeded).toHaveBeenCalledTimes(1);\r\n    });\r\n\r\n    it('should execute in correct order', async () => {\r\n      const callOrder = [];\r\n\r\n      clearAllUserData.mockImplementation(() => {\r\n        callOrder.push('clearAllUserData');\r\n        return Promise.resolve();\r\n      });\r\n\r\n      localStorage.removeItem.mockImplementation(() => {\r\n        if (!callOrder.includes('localStorage')) {\r\n          callOrder.push('localStorage');\r\n        }\r\n      });\r\n\r\n      sessionStorage.removeItem.mockImplementation(() => {\r\n        if (!callOrder.includes('sessionStorage')) {\r\n          callOrder.push('sessionStorage');\r\n        }\r\n      });\r\n\r\n      state.clear.mockImplementation(() => {\r\n        callOrder.push('state.clear');\r\n      });\r\n\r\n      loadSamplesIfNeeded.mockImplementation(() => {\r\n        callOrder.push('loadSamplesIfNeeded');\r\n        return Promise.resolve();\r\n      });\r\n\r\n      await deleteAllUserData();\r\n\r\n      expect(callOrder).toEqual([\r\n        'clearAllUserData',\r\n        'localStorage',\r\n        'sessionStorage',\r\n        'state.clear',\r\n        'loadSamplesIfNeeded'\r\n      ]);\r\n    });\r\n\r\n    it('should log info messages', async () => {\r\n      await deleteAllUserData();\r\n\r\n      expect(logger.info).toHaveBeenCalledWith('Starting data deletion...');\r\n      expect(logger.info).toHaveBeenCalledWith('Data deletion complete');\r\n    });\r\n\r\n    it('should log debug messages for each step', async () => {\r\n      await deleteAllUserData();\r\n\r\n      expect(logger.debug).toHaveBeenCalledWith('Clearing IndexedDB...');\r\n      expect(logger.debug).toHaveBeenCalledWith('Clearing localStorage...');\r\n      expect(logger.debug).toHaveBeenCalledWith('Clearing sessionStorage...');\r\n      expect(logger.debug).toHaveBeenCalledWith('Resetting in-memory state...');\r\n      expect(logger.debug).toHaveBeenCalledWith('Reloading sample quizzes...');\r\n    });\r\n\r\n    it('should throw and log error if deletion fails', async () => {\r\n      const error = new Error('Database error');\r\n      clearAllUserData.mockRejectedValue(error);\r\n\r\n      await expect(deleteAllUserData()).rejects.toThrow('Database error');\r\n      expect(logger.error).toHaveBeenCalledWith('Data deletion failed', { error: 'Database error' });\r\n    });\r\n\r\n    it('should not reload samples if clearing fails', async () => {\r\n      clearAllUserData.mockRejectedValue(new Error('Database error'));\r\n\r\n      try {\r\n        await deleteAllUserData();\r\n      } catch {\r\n        // Expected to throw\r\n      }\r\n\r\n      expect(loadSamplesIfNeeded).not.toHaveBeenCalled();\r\n    });\r\n  });\r\n});\r\n"},"src/utils/storage.test.js":{"tests":[{"id":"66","name":"Storage Utilities formatStorageSize should format 0 bytes"},{"id":"67","name":"Storage Utilities formatStorageSize should format bytes (<"+" 1024)"},{"id":"68","name":"Storage Utilities formatStorageSize should format kilobytes"},{"id":"69","name":"Storage Utilities formatStorageSize should format megabytes"},{"id":"70","name":"Storage Utilities formatStorageSize should format gigabytes"},{"id":"71","name":"Storage Utilities formatStorageSize should handle negative numbers"},{"id":"72","name":"Storage Utilities formatStorageSize should handle NaN"},{"id":"73","name":"Storage Utilities formatStorageSize should handle Infinity"},{"id":"74","name":"Storage Utilities formatStorageSize should use 1 decimal place for KB and above"},{"id":"75","name":"Storage Utilities formatStorageSize should use 0 decimal places for bytes"},{"id":"76","name":"Storage Utilities formatStorageSize should handle very large values without exceeding GB"},{"id":"77","name":"Storage Utilities getStorageBreakdown should return formatted storage sizes"},{"id":"78","name":"Storage Utilities getStorageBreakdown should return minimal size for empty storage"},{"id":"79","name":"Storage Utilities getStorageBreakdown should calculate settings size from IndexedDB"},{"id":"80","name":"Storage Utilities getStorageBreakdown should calculate settings size from localStorage"},{"id":"81","name":"Storage Utilities getStorageBreakdown should calculate quizzes size from sessions"},{"id":"82","name":"Storage Utilities getStorageBreakdown should calculate quizzes size from topics"},{"id":"83","name":"Storage Utilities getStorageBreakdown should sum settings and quizzes for total"},{"id":"84","name":"Storage Utilities getStorageBreakdown should handle localStorage keys that do not exist"},{"id":"85","name":"Storage Utilities getStorageBreakdown should include all expected localStorage keys in calculation"}],"source":"/**\r\n * Unit tests for storage utility functions\r\n */\r\nimport { describe, it, expect, vi, beforeEach, afterEach } from 'vitest';\r\n\r\n// Mock db.js module\r\nvi.mock('../core/db.js', () => ({\r\n  getAllSessions: vi.fn(),\r\n  getAllTopics: vi.fn(),\r\n  getSetting: vi.fn()\r\n}));\r\n\r\nimport { formatStorageSize, getStorageBreakdown } from './storage.js';\r\nimport { getAllSessions, getAllTopics, getSetting } from '../core/db.js';\r\n\r\ndescribe('Storage Utilities', () => {\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n    // Clear localStorage\r\n    localStorage.clear();\r\n  });\r\n\r\n  describe('formatStorageSize', () => {\r\n    it('should format 0 bytes', () => {\r\n      expect(formatStorageSize(0)).toBe('0 B');\r\n    });\r\n\r\n    it('should format bytes (<"+" 1024)', () => {\r\n      expect(formatStorageSize(500)).toBe('500 B');\r\n      expect(formatStorageSize(1)).toBe('1 B');\r\n      expect(formatStorageSize(1023)).toBe('1023 B');\r\n    });\r\n\r\n    it('should format kilobytes', () => {\r\n      expect(formatStorageSize(1024)).toBe('1.0 KB');\r\n      expect(formatStorageSize(1536)).toBe('1.5 KB');\r\n      expect(formatStorageSize(10240)).toBe('10.0 KB');\r\n    });\r\n\r\n    it('should format megabytes', () => {\r\n      expect(formatStorageSize(1048576)).toBe('1.0 MB');\r\n      expect(formatStorageSize(1572864)).toBe('1.5 MB');\r\n      expect(formatStorageSize(5242880)).toBe('5.0 MB');\r\n    });\r\n\r\n    it('should format gigabytes', () => {\r\n      expect(formatStorageSize(1073741824)).toBe('1.0 GB');\r\n      expect(formatStorageSize(2147483648)).toBe('2.0 GB');\r\n    });\r\n\r\n    it('should handle negative numbers', () => {\r\n      expect(formatStorageSize(-100)).toBe('0 B');\r\n    });\r\n\r\n    it('should handle NaN', () => {\r\n      expect(formatStorageSize(NaN)).toBe('0 B');\r\n    });\r\n\r\n    it('should handle Infinity', () => {\r\n      expect(formatStorageSize(Infinity)).toBe('0 B');\r\n    });\r\n\r\n    it('should use 1 decimal place for KB and above', () => {\r\n      expect(formatStorageSize(1024)).toBe('1.0 KB');\r\n      expect(formatStorageSize(1048576)).toBe('1.0 MB');\r\n    });\r\n\r\n    it('should use 0 decimal places for bytes', () => {\r\n      expect(formatStorageSize(512)).toBe('512 B');\r\n    });\r\n\r\n    it('should handle very large values without exceeding GB', () => {\r\n      // 10 TB should still show as GB (capped at units.length - 1)\r\n      const tenTB = 10 * 1024 * 1024 * 1024 * 1024;\r\n      const result = formatStorageSize(tenTB);\r\n      expect(result).toContain('GB');\r\n    });\r\n  });\r\n\r\n  describe('getStorageBreakdown', () => {\r\n    beforeEach(() => {\r\n      // Default mocks return empty data\r\n      getAllSessions.mockResolvedValue([]);\r\n      getAllTopics.mockResolvedValue([]);\r\n      getSetting.mockResolvedValue(null);\r\n    });\r\n\r\n    it('should return formatted storage sizes', async () => {\r\n      const result = await getStorageBreakdown();\r\n\r\n      expect(result).toHaveProperty('settings');\r\n      expect(result).toHaveProperty('quizzes');\r\n      expect(result).toHaveProperty('total');\r\n      expect(result).toHaveProperty('settingsBytes');\r\n      expect(result).toHaveProperty('quizzesBytes');\r\n      expect(result).toHaveProperty('totalBytes');\r\n    });\r\n\r\n    it('should return minimal size for empty storage', async () => {\r\n      const result = await getStorageBreakdown();\r\n\r\n      // Empty arrays [] still have 2 bytes each when serialized\r\n      // So sessions [] + topics [] = 4 bytes minimum for quizzes\r\n      expect(result.settings).toBe('0 B');\r\n      expect(result.quizzes).toBe('4 B'); // Two empty arrays: [] + []\r\n      expect(result.total).toBe('4 B');\r\n      expect(result.settingsBytes).toBe(0);\r\n      expect(result.quizzesBytes).toBe(4);\r\n      expect(result.totalBytes).toBe(4);\r\n    });\r\n\r\n    it('should calculate settings size from IndexedDB', async () => {\r\n      getSetting.mockImplementation((key) => {\r\n        if (key === 'openrouter_api_key') return Promise.resolve({ key: 'test-key-123' });\r\n        if (key === 'welcome_version') return Promise.resolve('1.0.0');\r\n        return Promise.resolve(null);\r\n      });\r\n\r\n      const result = await getStorageBreakdown();\r\n\r\n      expect(result.settingsBytes).toBeGreaterThan(0);\r\n    });\r\n\r\n    it('should calculate settings size from localStorage', async () => {\r\n      localStorage.setItem('quizmaster_settings', JSON.stringify({ grade: 'middle' }));\r\n      localStorage.setItem('i18nextLng', 'en');\r\n\r\n      const result = await getStorageBreakdown();\r\n\r\n      expect(result.settingsBytes).toBeGreaterThan(0);\r\n    });\r\n\r\n    it('should calculate quizzes size from sessions', async () => {\r\n      getAllSessions.mockResolvedValue([\r\n        { id: 1, topic: 'Test Topic', questions: [{ text: 'Question 1' }] }\r\n      ]);\r\n\r\n      const result = await getStorageBreakdown();\r\n\r\n      expect(result.quizzesBytes).toBeGreaterThan(0);\r\n    });\r\n\r\n    it('should calculate quizzes size from topics', async () => {\r\n      getAllTopics.mockResolvedValue([\r\n        { id: 'topic-1', name: 'Test Topic' }\r\n      ]);\r\n\r\n      const result = await getStorageBreakdown();\r\n\r\n      expect(result.quizzesBytes).toBeGreaterThan(0);\r\n    });\r\n\r\n    it('should sum settings and quizzes for total', async () => {\r\n      localStorage.setItem('quizmaster_settings', JSON.stringify({ grade: 'middle' }));\r\n      getAllSessions.mockResolvedValue([\r\n        { id: 1, topic: 'Test Topic' }\r\n      ]);\r\n\r\n      const result = await getStorageBreakdown();\r\n\r\n      expect(result.totalBytes).toBe(result.settingsBytes + result.quizzesBytes);\r\n    });\r\n\r\n    it('should handle localStorage keys that do not exist', async () => {\r\n      // No localStorage items set\r\n      const result = await getStorageBreakdown();\r\n\r\n      // Should not throw and should return valid result\r\n      expect(result).toBeDefined();\r\n      expect(result.settingsBytes).toBe(0);\r\n    });\r\n\r\n    it('should include all expected localStorage keys in calculation', async () => {\r\n      // Set all expected keys\r\n      localStorage.setItem('quizmaster_settings', '{\"a\":1}');\r\n      localStorage.setItem('openrouter_models_cache', '{\"b\":2}');\r\n      localStorage.setItem('i18nextLng', 'en');\r\n      localStorage.setItem('saberloop_telemetry_queue', '[]');\r\n\r\n      const result = await getStorageBreakdown();\r\n\r\n      // Each key should contribute to settings size\r\n      expect(result.settingsBytes).toBeGreaterThan(10);\r\n    });\r\n  });\r\n});\r\n"},"src/core/state.test.js":{"tests":[{"id":"86","name":"AppState get and set should get default values"},{"id":"87","name":"AppState get and set should set and get values"},{"id":"88","name":"AppState get and set should return undefined for non-existent keys"},{"id":"89","name":"AppState update should update multiple values at once"},{"id":"90","name":"AppState subscribe and notify should notify subscribers on set"},{"id":"91","name":"AppState subscribe and notify should notify subscribers on update with wildcard"},{"id":"92","name":"AppState subscribe and notify should notify multiple subscribers"},{"id":"93","name":"AppState clear should reset all values to defaults"},{"id":"94","name":"AppState clear should notify subscribers on clear"},{"id":"95","name":"AppState continue chain should initialize continue chain"},{"id":"96","name":"AppState continue chain should add to continue chain"},{"id":"97","name":"AppState continue chain should not add to chain if not initialized"},{"id":"98","name":"AppState continue chain should clear continue chain"},{"id":"99","name":"AppState continue chain should return null when chain not initialized"}],"source":"import { describe, it, expect, beforeEach, vi } from 'vitest';\r\nimport state from './state.js';\r\n\r\ndescribe('AppState', () => {\r\n    // Reset state before each test to avoid test pollution\r\n    beforeEach(() => {\r\n        state.clear();\r\n        // Clear listeners array directly (since no unsubscribe method exists)\r\n        state.listeners = [];\r\n    });\r\n\r\n    describe('get and set', () => {\r\n        it('should get default values', () => {\r\n        expect(state.get('currentTopic')).toBeNull();\r\n        expect(state.get('currentGradeLevel')).toBe('middle school');\r\n        expect(state.get('currentAnswers')).toEqual([]);\r\n        });\r\n\r\n        it('should set and get values', () => {\r\n        state.set('currentTopic', 'Science');\r\n        expect(state.get('currentTopic')).toBe('Science');\r\n        });\r\n\r\n        it('should return undefined for non-existent keys', () => {\r\n        expect(state.get('nonExistentKey')).toBeUndefined();\r\n        });\r\n    });\r\n\r\n    describe('update', () => {\r\n        it('should update multiple values at once', () => {\r\n        state.update({\r\n            currentTopic: 'History',\r\n            currentScore: 85\r\n        });\r\n\r\n        expect(state.get('currentTopic')).toBe('History');\r\n        expect(state.get('currentScore')).toBe(85);\r\n        });\r\n    });\r\n\r\n    describe('subscribe and notify', () => {\r\n        it('should notify subscribers on set', () => {\r\n        const callback = vi.fn();\r\n        state.subscribe(callback);\r\n\r\n        state.set('currentTopic', 'Math');\r\n\r\n        expect(callback).toHaveBeenCalledWith('currentTopic', 'Math');\r\n        });\r\n\r\n        it('should notify subscribers on update with wildcard', () => {\r\n        const callback = vi.fn();\r\n        state.subscribe(callback);\r\n\r\n        state.update({ currentScore: 100 });\r\n\r\n        expect(callback).toHaveBeenCalledWith('*', expect.objectContaining({\r\n            currentScore: 100\r\n        }));\r\n        });\r\n\r\n        it('should notify multiple subscribers', () => {\r\n        const callback1 = vi.fn();\r\n        const callback2 = vi.fn();\r\n        state.subscribe(callback1);\r\n        state.subscribe(callback2);\r\n\r\n        state.set('currentTopic', 'Art');\r\n\r\n        expect(callback1).toHaveBeenCalled();\r\n        expect(callback2).toHaveBeenCalled();\r\n        });\r\n    });\r\n\r\n    describe('clear', () => {\r\n        it('should reset all values to defaults', () => {\r\n        state.set('currentTopic', 'Physics');\r\n        state.set('currentScore', 90);\r\n\r\n        state.clear();\r\n\r\n        expect(state.get('currentTopic')).toBeNull();\r\n        expect(state.get('currentScore')).toBeNull();\r\n        expect(state.get('currentGradeLevel')).toBe('middle school');\r\n        });\r\n\r\n        it('should notify subscribers on clear', () => {\r\n        const callback = vi.fn();\r\n        state.subscribe(callback);\r\n\r\n        state.clear();\r\n\r\n        expect(callback).toHaveBeenCalledWith('*', expect.any(Object));\r\n        });\r\n    });\r\n\r\n    describe('continue chain', () => {\r\n        const mockQuestions = [\r\n        { question: 'What is 2+2?' },\r\n        { question: 'What is the capital of France?' }\r\n        ];\r\n\r\n        it('should initialize continue chain', () => {\r\n        state.initContinueChain('Math', 'high school', mockQuestions);\r\n\r\n        const chain = state.getContinueChain();\r\n        expect(chain).toEqual({\r\n            topic: 'Math',\r\n            continueCount: 0,\r\n            previousQuestions: ['What is 2+2?', 'What is the capital of France?'],\r\n            startingGradeLevel: 'high school'\r\n        });\r\n        });\r\n\r\n        it('should add to continue chain', () => {\r\n        state.initContinueChain('Math', 'high school', mockQuestions);\r\n\r\n        const newQuestions = [{ question: 'What is 3+3?' }];\r\n        state.addToContinueChain(newQuestions);\r\n\r\n        const chain = state.getContinueChain();\r\n        expect(chain.continueCount).toBe(1);\r\n        expect(chain.previousQuestions).toContain('What is 3+3?');\r\n        });\r\n\r\n        it('should not add to chain if not initialized', () => {\r\n        state.addToContinueChain([{ question: 'Test?' }]);\r\n\r\n        expect(state.getContinueChain()).toBeNull();\r\n        });\r\n\r\n        it('should clear continue chain', () => {\r\n        state.initContinueChain('Math', 'high school', mockQuestions);\r\n        state.clearContinueChain();\r\n\r\n        expect(state.getContinueChain()).toBeNull();\r\n        });\r\n\r\n        it('should return null when chain not initialized', () => {\r\n        expect(state.getContinueChain()).toBeNull();\r\n        });\r\n    });\r\n});"},"src/core/i18n.test.js":{"tests":[{"id":"100","name":"i18n Module SUPPORTED_LANGUAGES should export supported languages array"},{"id":"101","name":"i18n Module SUPPORTED_LANGUAGES should include English as default"},{"id":"102","name":"i18n Module SUPPORTED_LANGUAGES should include Portuguese (pt-PT)"},{"id":"103","name":"i18n Module SUPPORTED_LANGUAGES should have exactly 9 supported languages"},{"id":"104","name":"i18n Module SUPPORTED_LANGUAGES should have all required language properties"},{"id":"105","name":"i18n Module SUPPORTED_LANGUAGES should include all expected languages with correct data"},{"id":"106","name":"i18n Module DEFAULT_LANGUAGE should export English as default language"},{"id":"107","name":"i18n Module initI18n should initialize i18next successfully"},{"id":"108","name":"i18n Module initI18n should load English translations"},{"id":"109","name":"i18n Module initI18n should only initialize once"},{"id":"110","name":"i18n Module initI18n should respect lng option"},{"id":"111","name":"i18n Module initI18n should handle concurrent initialization calls"},{"id":"112","name":"i18n Module initI18n should use localStorage language when available"},{"id":"113","name":"i18n Module initI18n should handle failed translation loading gracefully"},{"id":"114","name":"i18n Module t (translate) should return translated text"},{"id":"115","name":"i18n Module t (translate) should handle interpolation"},{"id":"116","name":"i18n Module t (translate) should return key when not initialized"},{"id":"117","name":"i18n Module t (translate) should return key for missing translations"},{"id":"118","name":"i18n Module changeLanguage should change language to Portuguese"},{"id":"119","name":"i18n Module changeLanguage should normalize language codes"},{"id":"120","name":"i18n Module changeLanguage should fallback to English for unsupported languages"},{"id":"121","name":"i18n Module changeLanguage should persist language choice to localStorage"},{"id":"122","name":"i18n Module changeLanguage should not reload translations if already loaded"},{"id":"123","name":"i18n Module changeLanguage should handle failed translation loading during language change"},{"id":"124","name":"i18n Module changeLanguage should return the normalized language code"},{"id":"125","name":"i18n Module getCurrentLanguage should return current language code"},{"id":"126","name":"i18n Module getCurrentLanguage should return default when not initialized"},{"id":"127","name":"i18n Module isI18nReady should return false before initialization"},{"id":"128","name":"i18n Module isI18nReady should return true after initialization"},{"id":"129","name":"i18n Module onLanguageChange should call callback when language changes"},{"id":"130","name":"i18n Module onLanguageChange should return unsubscribe function"},{"id":"131","name":"i18n Module loadTranslations fallback behavior should fallback to base language when regional not found"},{"id":"132","name":"i18n Module loadTranslations fallback behavior should return null when both regional and base language fail"},{"id":"133","name":"i18n Module loadTranslations fallback behavior should handle fetch exceptions gracefully"},{"id":"134","name":"i18n Module loadTranslations fallback behavior should not attempt base language fallback when lang has no region"}],"source":"/**\r\n * Unit tests for i18n module\r\n */\r\n\r\nimport { describe, it, expect, beforeEach, afterEach, vi } from 'vitest';\r\nimport i18next from 'i18next';\r\n\r\n// Mock translations\r\nconst mockEnTranslations = {\r\n    common: {\r\n        home: 'Home',\r\n        settings: 'Settings'\r\n    },\r\n    home: {\r\n        welcome: 'Welcome back!',\r\n        questionOf: 'Question {{current}} of {{total}}'\r\n    }\r\n};\r\n\r\nconst mockPtTranslations = {\r\n    common: {\r\n        home: 'Início',\r\n        settings: 'Definições'\r\n    },\r\n    home: {\r\n        welcome: 'Bem-vindo de volta!',\r\n        questionOf: 'Pergunta {{current}} de {{total}}'\r\n    }\r\n};\r\n\r\n// Mock fetch to return translations\r\nfunction mockFetch(lang) {\r\n    return vi.fn((url) => {\r\n        if (url.includes('en.json')) {\r\n            return Promise.resolve({\r\n                ok: true,\r\n                json: () => Promise.resolve(mockEnTranslations)\r\n            });\r\n        }\r\n        if (url.includes('pt-PT.json')) {\r\n            return Promise.resolve({\r\n                ok: true,\r\n                json: () => Promise.resolve(mockPtTranslations)\r\n            });\r\n        }\r\n        // Not found\r\n        return Promise.resolve({ ok: false });\r\n    });\r\n}\r\n\r\ndescribe('i18n Module', () => {\r\n    let originalFetch;\r\n    let originalLocalStorage;\r\n\r\n    beforeEach(() => {\r\n        // Reset i18next state\r\n        if (i18next.isInitialized) {\r\n            // Remove all resources\r\n            i18next.options.resources = {};\r\n            i18next.store.data = {};\r\n        }\r\n\r\n        // Mock fetch\r\n        originalFetch = global.fetch;\r\n        global.fetch = mockFetch();\r\n\r\n        // Mock localStorage\r\n        originalLocalStorage = global.localStorage;\r\n        const store = {};\r\n        global.localStorage = {\r\n            getItem: vi.fn((key) => store[key] || null),\r\n            setItem: vi.fn((key, value) => { store[key] = value; }),\r\n            removeItem: vi.fn((key) => { delete store[key]; }),\r\n            clear: vi.fn(() => { Object.keys(store).forEach(k => delete store[k]); })\r\n        };\r\n\r\n        // Clear module cache to reset initialization state\r\n        vi.resetModules();\r\n    });\r\n\r\n    afterEach(() => {\r\n        global.fetch = originalFetch;\r\n        global.localStorage = originalLocalStorage;\r\n        vi.restoreAllMocks();\r\n    });\r\n\r\n    describe('SUPPORTED_LANGUAGES', () => {\r\n        it('should export supported languages array', async () => {\r\n            const { SUPPORTED_LANGUAGES } = await import('./i18n.js');\r\n            expect(SUPPORTED_LANGUAGES).toBeDefined();\r\n            expect(Array.isArray(SUPPORTED_LANGUAGES)).toBe(true);\r\n            expect(SUPPORTED_LANGUAGES.length).toBeGreaterThan(0);\r\n        });\r\n\r\n        it('should include English as default', async () => {\r\n            const { SUPPORTED_LANGUAGES } = await import('./i18n.js');\r\n            const english = SUPPORTED_LANGUAGES.find(l => l.code === 'en');\r\n            expect(english).toBeDefined();\r\n            expect(english.name).toBe('English');\r\n            expect(english.flag).toBe('🇬🇧');\r\n        });\r\n\r\n        it('should include Portuguese (pt-PT)', async () => {\r\n            const { SUPPORTED_LANGUAGES } = await import('./i18n.js');\r\n            const portuguese = SUPPORTED_LANGUAGES.find(l => l.code === 'pt-PT');\r\n            expect(portuguese).toBeDefined();\r\n            expect(portuguese.name).toBe('Português');\r\n            expect(portuguese.flag).toBe('🇵🇹');\r\n        });\r\n\r\n        it('should have exactly 9 supported languages', async () => {\r\n            const { SUPPORTED_LANGUAGES } = await import('./i18n.js');\r\n            expect(SUPPORTED_LANGUAGES).toHaveLength(9);\r\n        });\r\n\r\n        it('should have all required language properties', async () => {\r\n            const { SUPPORTED_LANGUAGES } = await import('./i18n.js');\r\n            SUPPORTED_LANGUAGES.forEach(lang => {\r\n                expect(lang.code).toBeTruthy();\r\n                expect(lang.name).toBeTruthy();\r\n                expect(lang.flag).toBeTruthy();\r\n            });\r\n        });\r\n\r\n        it('should include all expected languages with correct data', async () => {\r\n            const { SUPPORTED_LANGUAGES } = await import('./i18n.js');\r\n            const expectedLangs = {\r\n                'en': { name: 'English', flag: '🇬🇧' },\r\n                'pt-PT': { name: 'Português', flag: '🇵🇹' },\r\n                'es': { name: 'Español', flag: '🇪🇸' },\r\n                'fr': { name: 'Français', flag: '🇫🇷' },\r\n                'de': { name: 'Deutsch', flag: '🇩🇪' },\r\n                'it': { name: 'Italiano', flag: '🇮🇹' },\r\n                'nl': { name: 'Nederlands', flag: '🇳🇱' },\r\n                'no': { name: 'Norsk', flag: '🇳🇴' },\r\n                'ru': { name: 'Русский', flag: '🇷🇺' }\r\n            };\r\n\r\n            Object.entries(expectedLangs).forEach(([code, expected]) => {\r\n                const lang = SUPPORTED_LANGUAGES.find(l => l.code === code);\r\n                expect(lang).toBeDefined();\r\n                expect(lang.name).toBe(expected.name);\r\n                expect(lang.flag).toBe(expected.flag);\r\n            });\r\n        });\r\n    });\r\n\r\n    describe('DEFAULT_LANGUAGE', () => {\r\n        it('should export English as default language', async () => {\r\n            const { DEFAULT_LANGUAGE } = await import('./i18n.js');\r\n            expect(DEFAULT_LANGUAGE).toBe('en');\r\n        });\r\n    });\r\n\r\n    describe('initI18n', () => {\r\n        it('should initialize i18next successfully', async () => {\r\n            const { initI18n } = await import('./i18n.js');\r\n            const instance = await initI18n();\r\n            expect(instance).toBeDefined();\r\n            expect(instance.isInitialized).toBe(true);\r\n        });\r\n\r\n        it('should load English translations', async () => {\r\n            const { initI18n, t } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n            expect(t('common.home')).toBe('Home');\r\n        });\r\n\r\n        it('should only initialize once', async () => {\r\n            const { initI18n } = await import('./i18n.js');\r\n            const first = await initI18n();\r\n            const second = await initI18n();\r\n            expect(first).toBe(second);\r\n        });\r\n\r\n        it('should respect lng option', async () => {\r\n            const { initI18n, getCurrentLanguage } = await import('./i18n.js');\r\n            await initI18n({ lng: 'pt-PT' });\r\n            expect(getCurrentLanguage()).toBe('pt-PT');\r\n        });\r\n\r\n        it('should handle concurrent initialization calls', async () => {\r\n            const { initI18n } = await import('./i18n.js');\r\n            // Start multiple init calls concurrently\r\n            const [first, second, third] = await Promise.all([\r\n                initI18n(),\r\n                initI18n(),\r\n                initI18n()\r\n            ]);\r\n            // All should return the same instance\r\n            expect(first).toBe(second);\r\n            expect(second).toBe(third);\r\n        });\r\n\r\n        it('should use localStorage language when available', async () => {\r\n            localStorage.setItem('i18nextLng', 'pt-PT');\r\n            const { initI18n, getCurrentLanguage } = await import('./i18n.js');\r\n            await initI18n();\r\n            expect(getCurrentLanguage()).toBe('pt-PT');\r\n        });\r\n\r\n        it('should handle failed translation loading gracefully', async () => {\r\n            // Mock fetch to fail for all languages\r\n            global.fetch = vi.fn(() => Promise.resolve({ ok: false }));\r\n\r\n            const { initI18n, t } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n            // Should still work, just with empty translations\r\n            expect(t('common.home')).toBe('common.home');\r\n        });\r\n    });\r\n\r\n    describe('t (translate)', () => {\r\n        it('should return translated text', async () => {\r\n            const { initI18n, t } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n            expect(t('common.home')).toBe('Home');\r\n            expect(t('home.welcome')).toBe('Welcome back!');\r\n        });\r\n\r\n        it('should handle interpolation', async () => {\r\n            const { initI18n, t } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n            const result = t('home.questionOf', { current: 1, total: 5 });\r\n            expect(result).toBe('Question 1 of 5');\r\n        });\r\n\r\n        it('should return key when not initialized', async () => {\r\n            // Import without initializing\r\n            const { t } = await import('./i18n.js');\r\n            // Don't call initI18n\r\n            const result = t('common.home');\r\n            expect(result).toBe('common.home');\r\n        });\r\n\r\n        it('should return key for missing translations', async () => {\r\n            const { initI18n, t } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n            const result = t('nonexistent.key');\r\n            expect(result).toBe('nonexistent.key');\r\n        });\r\n    });\r\n\r\n    describe('changeLanguage', () => {\r\n        it('should change language to Portuguese', async () => {\r\n            const { initI18n, changeLanguage, getCurrentLanguage, t } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            await changeLanguage('pt-PT');\r\n\r\n            expect(getCurrentLanguage()).toBe('pt-PT');\r\n            expect(t('common.home')).toBe('Início');\r\n        });\r\n\r\n        it('should normalize language codes', async () => {\r\n            const { initI18n, changeLanguage, getCurrentLanguage } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            // pt-BR should normalize to pt-PT (our supported variant)\r\n            await changeLanguage('pt-BR');\r\n            expect(getCurrentLanguage()).toBe('pt-PT');\r\n        });\r\n\r\n        it('should fallback to English for unsupported languages', async () => {\r\n            const { initI18n, changeLanguage, getCurrentLanguage } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            await changeLanguage('xx-XX');\r\n            expect(getCurrentLanguage()).toBe('en');\r\n        });\r\n\r\n        it('should persist language choice to localStorage', async () => {\r\n            const { initI18n, changeLanguage } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            await changeLanguage('pt-PT');\r\n\r\n            expect(localStorage.setItem).toHaveBeenCalledWith('i18nextLng', 'pt-PT');\r\n        });\r\n\r\n        it('should not reload translations if already loaded', async () => {\r\n            const { initI18n, changeLanguage, getCurrentLanguage } = await import('./i18n.js');\r\n            await initI18n({ lng: 'pt-PT' });\r\n\r\n            // Clear fetch mock call count\r\n            global.fetch.mockClear();\r\n\r\n            // Change to same language - should not fetch again\r\n            await changeLanguage('pt-PT');\r\n            expect(getCurrentLanguage()).toBe('pt-PT');\r\n        });\r\n\r\n        it('should handle failed translation loading during language change', async () => {\r\n            const { initI18n, changeLanguage, getCurrentLanguage } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            // Mock fetch to fail for Spanish\r\n            global.fetch = vi.fn((url) => {\r\n                if (url.includes('es.json')) {\r\n                    return Promise.resolve({ ok: false });\r\n                }\r\n                return Promise.resolve({\r\n                    ok: true,\r\n                    json: () => Promise.resolve(mockEnTranslations)\r\n                });\r\n            });\r\n\r\n            // Should still change language even if translations fail\r\n            const result = await changeLanguage('es');\r\n            expect(result).toBe('es');\r\n            expect(getCurrentLanguage()).toBe('es');\r\n        });\r\n\r\n        it('should return the normalized language code', async () => {\r\n            const { initI18n, changeLanguage } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            const result = await changeLanguage('pt-BR');\r\n            expect(result).toBe('pt-PT');\r\n        });\r\n    });\r\n\r\n    describe('getCurrentLanguage', () => {\r\n        it('should return current language code', async () => {\r\n            const { initI18n, getCurrentLanguage } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n            expect(getCurrentLanguage()).toBe('en');\r\n        });\r\n\r\n        it('should return default when not initialized', async () => {\r\n            const { getCurrentLanguage, DEFAULT_LANGUAGE } = await import('./i18n.js');\r\n            // Note: getCurrentLanguage uses i18next.language which may be undefined\r\n            const result = getCurrentLanguage();\r\n            expect([DEFAULT_LANGUAGE, undefined]).toContain(result);\r\n        });\r\n    });\r\n\r\n    describe('isI18nReady', () => {\r\n        it('should return false before initialization', async () => {\r\n            const { isI18nReady } = await import('./i18n.js');\r\n            expect(isI18nReady()).toBe(false);\r\n        });\r\n\r\n        it('should return true after initialization', async () => {\r\n            const { initI18n, isI18nReady } = await import('./i18n.js');\r\n            await initI18n();\r\n            expect(isI18nReady()).toBe(true);\r\n        });\r\n    });\r\n\r\n    describe('onLanguageChange', () => {\r\n        it('should call callback when language changes', async () => {\r\n            const { initI18n, changeLanguage, onLanguageChange } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            const callback = vi.fn();\r\n            onLanguageChange(callback);\r\n\r\n            await changeLanguage('pt-PT');\r\n\r\n            expect(callback).toHaveBeenCalledWith('pt-PT');\r\n        });\r\n\r\n        it('should return unsubscribe function', async () => {\r\n            const { initI18n, changeLanguage, onLanguageChange } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            const callback = vi.fn();\r\n            const unsubscribe = onLanguageChange(callback);\r\n\r\n            // Unsubscribe before changing\r\n            unsubscribe();\r\n\r\n            await changeLanguage('pt-PT');\r\n\r\n            expect(callback).not.toHaveBeenCalled();\r\n        });\r\n    });\r\n\r
