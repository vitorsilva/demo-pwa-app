\n    describe('loadTranslations fallback behavior', () => {\r\n        it('should fallback to base language when regional not found', async () => {\r\n            // Mock fetch: pt-PT.json fails, but pt.json succeeds\r\n            const mockPtBaseTranslations = {\r\n                common: { home: 'Casa' }\r\n            };\r\n\r\n            global.fetch = vi.fn((url) => {\r\n                if (url.includes('en.json')) {\r\n                    return Promise.resolve({\r\n                        ok: true,\r\n                        json: () => Promise.resolve(mockEnTranslations)\r\n                    });\r\n                }\r\n                if (url.includes('pt-PT.json')) {\r\n                    return Promise.resolve({ ok: false });\r\n                }\r\n                if (url.includes('pt.json')) {\r\n                    return Promise.resolve({\r\n                        ok: true,\r\n                        json: () => Promise.resolve(mockPtBaseTranslations)\r\n                    });\r\n                }\r\n                return Promise.resolve({ ok: false });\r\n            });\r\n\r\n            const { initI18n, changeLanguage, t } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            await changeLanguage('pt-PT');\r\n\r\n            // Should have loaded the pt.json fallback\r\n            expect(t('common.home')).toBe('Casa');\r\n        });\r\n\r\n        it('should return null when both regional and base language fail', async () => {\r\n            // Mock fetch to fail for all\r\n            global.fetch = vi.fn((url) => {\r\n                if (url.includes('en.json')) {\r\n                    return Promise.resolve({\r\n                        ok: true,\r\n                        json: () => Promise.resolve(mockEnTranslations)\r\n                    });\r\n                }\r\n                return Promise.resolve({ ok: false });\r\n            });\r\n\r\n            const { initI18n, changeLanguage, t } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            await changeLanguage('fr');\r\n\r\n            // Should fallback to English translations via i18next fallback\r\n            expect(t('common.home')).toBe('Home');\r\n        });\r\n\r\n        it('should handle fetch exceptions gracefully', async () => {\r\n            // Mock fetch to throw an error\r\n            global.fetch = vi.fn((url) => {\r\n                if (url.includes('en.json')) {\r\n                    return Promise.resolve({\r\n                        ok: true,\r\n                        json: () => Promise.resolve(mockEnTranslations)\r\n                    });\r\n                }\r\n                return Promise.reject(new Error('Network error'));\r\n            });\r\n\r\n            const { initI18n, changeLanguage, getCurrentLanguage } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            // Should not throw, just log warning\r\n            await changeLanguage('de');\r\n            expect(getCurrentLanguage()).toBe('de');\r\n        });\r\n\r\n        it('should not attempt base language fallback when lang has no region', async () => {\r\n            let fetchCalls = [];\r\n            global.fetch = vi.fn((url) => {\r\n                fetchCalls.push(url);\r\n                if (url.includes('en.json')) {\r\n                    return Promise.resolve({\r\n                        ok: true,\r\n                        json: () => Promise.resolve(mockEnTranslations)\r\n                    });\r\n                }\r\n                if (url.includes('fr.json')) {\r\n                    return Promise.resolve({ ok: false });\r\n                }\r\n                return Promise.resolve({ ok: false });\r\n            });\r\n\r\n            const { initI18n, changeLanguage } = await import('./i18n.js');\r\n            await initI18n({ lng: 'en' });\r\n\r\n            fetchCalls = []; // Reset after init\r\n            await changeLanguage('fr');\r\n\r\n            // Should only try fr.json, not fr.json twice\r\n            const frCalls = fetchCalls.filter(url => url.includes('fr.json'));\r\n            expect(frCalls).toHaveLength(1);\r\n        });\r\n    });\r\n});\r\n"},"src/utils/adManager.test.js":{"tests":[{"id":"135","name":"AdManager canLoadAds should return false when feature flag is disabled"},{"id":"136","name":"AdManager canLoadAds should return false when offline"},{"id":"137","name":"AdManager canLoadAds should return false when adsbygoogle is not loaded"},{"id":"138","name":"AdManager canLoadAds should return true when all conditions are met"},{"id":"139","name":"AdManager loadAd should return false when container is not found"},{"id":"140","name":"AdManager loadAd should return false and show placeholder when no slot ID is configured for quizLoading"},{"id":"141","name":"AdManager loadAd should return false and show placeholder when no slot ID is configured for resultsLoading"},{"id":"142","name":"AdManager loadAd should prevent duplicate ad loads in same container"},{"id":"143","name":"AdManager loadAd should hide container when ads cannot load"},{"id":"144","name":"AdManager loadAd should load ad successfully when slot ID is set"},{"id":"145","name":"AdManager loadAd should push to adsbygoogle array when loading ad"},{"id":"146","name":"AdManager loadAd should initialize adsbygoogle array if undefined when loading ad"},{"id":"147","name":"AdManager hideContainer should hide container and clear content"},{"id":"148","name":"AdManager hideContainer should not crash when container does not exist"},{"id":"149","name":"AdManager showContainer should show container"},{"id":"150","name":"AdManager showContainer should not crash when container does not exist"},{"id":"151","name":"AdManager showPlaceholder should show placeholder with \"Ad Space\" text"},{"id":"152","name":"AdManager showPlaceholder should not crash when container does not exist"},{"id":"153","name":"AdManager resetForNavigation should clear loaded ads tracking"},{"id":"154","name":"AdManager resetForNavigation should log debug message"},{"id":"155","name":"AdManager initAdManager should register online/offline listeners"},{"id":"156","name":"AdManager initAdManager should log initialization info with correct details"},{"id":"157","name":"AdManager getPublisherId should return the publisher ID"},{"id":"158","name":"AdManager setAdSlot should set slot ID for valid key"},{"id":"159","name":"AdManager setAdSlot should set slot ID for resultsLoading key"},{"id":"160","name":"AdManager setAdSlot should warn for unknown slot key"},{"id":"161","name":"AdManager online/offline handlers should register handlers that log on online event"},{"id":"162","name":"AdManager online/offline handlers should register handlers that hide containers on offline event"},{"id":"163","name":"AdManager error handling should handle errors when loading ad and return false"}],"source":"import { describe, it, expect, beforeEach, afterEach, vi } from 'vitest';\r\n\r\n// Mock dependencies\r\nvi.mock('./logger.js', () => ({\r\n  logger: {\r\n    info: vi.fn(),\r\n    debug: vi.fn(),\r\n    warn: vi.fn(),\r\n    error: vi.fn()\r\n  }\r\n}));\r\n\r\nvi.mock('./network.js', () => ({\r\n  isOnline: vi.fn(),\r\n  onOnline: vi.fn(),\r\n  onOffline: vi.fn()\r\n}));\r\n\r\nvi.mock('../core/features.js', () => ({\r\n  isFeatureEnabled: vi.fn()\r\n}));\r\n\r\nimport {\r\n  canLoadAds,\r\n  loadAd,\r\n  hideContainer,\r\n  showContainer,\r\n  showPlaceholder,\r\n  resetForNavigation,\r\n  initAdManager,\r\n  getPublisherId,\r\n  setAdSlot\r\n} from './adManager.js';\r\nimport { logger } from './logger.js';\r\nimport { isOnline, onOnline, onOffline } from './network.js';\r\nimport { isFeatureEnabled } from '../core/features.js';\r\n\r\ndescribe('AdManager', () => {\r\n  beforeEach(() => {\r\n    // Reset all mocks\r\n    vi.clearAllMocks();\r\n\r\n    // Reset DOM\r\n    document.body.innerHTML = '';\r\n\r\n    // Reset adsbygoogle\r\n    delete window.adsbygoogle;\r\n\r\n    // Reset loaded ads state by calling resetForNavigation\r\n    resetForNavigation();\r\n  });\r\n\r\n  describe('canLoadAds', () => {\r\n    it('should return false when feature flag is disabled', () => {\r\n      isFeatureEnabled.mockReturnValue(false);\r\n      isOnline.mockReturnValue(true);\r\n      window.adsbygoogle = [];\r\n\r\n      const result = canLoadAds();\r\n\r\n      expect(result).toBe(false);\r\n      expect(isFeatureEnabled).toHaveBeenCalledWith('SHOW_ADS');\r\n      expect(logger.debug).toHaveBeenCalledWith('[AdManager] Ads disabled by feature flag');\r\n    });\r\n\r\n    it('should return false when offline', () => {\r\n      isFeatureEnabled.mockReturnValue(true);\r\n      isOnline.mockReturnValue(false);\r\n      window.adsbygoogle = [];\r\n\r\n      const result = canLoadAds();\r\n\r\n      expect(result).toBe(false);\r\n      expect(logger.debug).toHaveBeenCalledWith('[AdManager] Cannot load ads: offline');\r\n    });\r\n\r\n    it('should return false when adsbygoogle is not loaded', () => {\r\n      isFeatureEnabled.mockReturnValue(true);\r\n      isOnline.mockReturnValue(true);\r\n      // Don't set window.adsbygoogle\r\n\r\n      const result = canLoadAds();\r\n\r\n      expect(result).toBe(false);\r\n      expect(logger.debug).toHaveBeenCalledWith('[AdManager] Cannot load ads: adsbygoogle not loaded');\r\n    });\r\n\r\n    it('should return true when all conditions are met', () => {\r\n      isFeatureEnabled.mockReturnValue(true);\r\n      isOnline.mockReturnValue(true);\r\n      window.adsbygoogle = [];\r\n\r\n      const result = canLoadAds();\r\n\r\n      expect(result).toBe(true);\r\n    });\r\n  });\r\n\r\n  describe('loadAd', () => {\r\n    beforeEach(() => {\r\n      // Setup container\r\n      document.body.innerHTML = '<"+"div id=\"test-ad-container\"><"+"/div>';\r\n\r\n      // Setup conditions for loading ads\r\n      isFeatureEnabled.mockReturnValue(true);\r\n      isOnline.mockReturnValue(true);\r\n      window.adsbygoogle = [];\r\n    });\r\n\r\n    it('should return false when container is not found', async () => {\r\n      const result = await loadAd('nonexistent-container', 'quizLoading');\r\n\r\n      expect(result).toBe(false);\r\n      expect(logger.warn).toHaveBeenCalledWith('[AdManager] Container not found: nonexistent-container');\r\n    });\r\n\r\n    it('should return false and show placeholder when no slot ID is configured for quizLoading', async () => {\r\n      // quizLoading has empty slot ID by default\r\n      const result = await loadAd('test-ad-container', 'quizLoading');\r\n\r\n      expect(result).toBe(false);\r\n      expect(logger.debug).toHaveBeenCalledWith('[AdManager] No slot ID for quizLoading - AdSense pending approval');\r\n\r\n      // Should show placeholder instead of hiding\r\n      const container = document.getElementById('test-ad-container');\r\n      expect(container.style.display).toBe('block');\r\n      expect(container.innerHTML).toContain('Ad Space');\r\n    });\r\n\r\n    it('should return false and show placeholder when no slot ID is configured for resultsLoading', async () => {\r\n      // resultsLoading also has empty slot ID by default\r\n      const result = await loadAd('test-ad-container', 'resultsLoading');\r\n\r\n      expect(result).toBe(false);\r\n      expect(logger.debug).toHaveBeenCalledWith('[AdManager] No slot ID for resultsLoading - AdSense pending approval');\r\n\r\n      // Should show placeholder instead of hiding\r\n      const container = document.getElementById('test-ad-container');\r\n      expect(container.style.display).toBe('block');\r\n      expect(container.innerHTML).toContain('Ad Space');\r\n    });\r\n\r\n    it('should prevent duplicate ad loads in same container', async () => {\r\n      // Set a slot ID\r\n      setAdSlot('quizLoading', '1234567890');\r\n\r\n      // First load\r\n      await loadAd('test-ad-container', 'quizLoading');\r\n\r\n      // Second load attempt\r\n      const result = await loadAd('test-ad-container', 'quizLoading');\r\n\r\n      expect(result).toBe(false);\r\n      expect(logger.debug).toHaveBeenCalledWith('[AdManager] Ad already loaded in test-ad-container');\r\n    });\r\n\r\n    it('should hide container when ads cannot load', async () => {\r\n      // Add content to verify it gets cleared by hideContainer\r\n      document.getElementById('test-ad-container').innerHTML = '<"+"p>old content<"+"/p>';\r\n      isOnline.mockReturnValue(false);\r\n\r\n      const result = await loadAd('test-ad-container', 'quizLoading');\r\n\r\n      expect(result).toBe(false);\r\n      const container = document.getElementById('test-ad-container');\r\n      expect(container.style.display).toBe('none');\r\n      expect(container.innerHTML).toBe('');\r\n      // Verify old content was removed\r\n      expect(container.querySelectorAll('p').length).toBe(0);\r\n    });\r\n\r\n    it('should load ad successfully when slot ID is set', async () => {\r\n      // Add some content to verify it gets cleared\r\n      document.getElementById('test-ad-container').innerHTML = '<"+"p>old content<"+"/p>';\r\n      setAdSlot('quizLoading', '1234567890');\r\n\r\n      const result = await loadAd('test-ad-container', 'quizLoading');\r\n\r\n      expect(result).toBe(true);\r\n      expect(logger.info).toHaveBeenCalledWith('[AdManager] Ad loaded in test-ad-container');\r\n\r\n      // Check that ad element was created with correct attributes\r\n      const container = document.getElementById('test-ad-container');\r\n      const adElement = container.querySelector('.adsbygoogle');\r\n      expect(adElement).toBeTruthy();\r\n      expect(adElement.getAttribute('data-ad-slot')).toBe('1234567890');\r\n      expect(adElement.getAttribute('data-ad-format')).toBe('auto');\r\n      expect(adElement.getAttribute('data-full-width-responsive')).toBe('true');\r\n      expect(adElement.style.display).toBe('block');\r\n\r\n      // Verify container was cleared (old content removed) and only has the ad element\r\n      expect(container.querySelectorAll('p').length).toBe(0);\r\n      expect(container.children.length).toBe(1);\r\n      expect(container.children[0]).toBe(adElement);\r\n      // Also verify no text nodes exist (container.innerHTML = '' must clear all content)\r\n      expect(container.childNodes.length).toBe(1);\r\n    });\r\n\r\n    it('should push to adsbygoogle array when loading ad', async () => {\r\n      setAdSlot('quizLoading', '1234567890');\r\n      window.adsbygoogle = [];\r\n\r\n      await loadAd('test-ad-container', 'quizLoading');\r\n\r\n      expect(window.adsbygoogle.length).toBe(1);\r\n    });\r\n\r\n    it('should initialize adsbygoogle array if undefined when loading ad', () => {\r\n      setAdSlot('quizLoading', '1234567890');\r\n      // Simulate adsbygoogle being defined but as an empty array (edge case)\r\n      window.adsbygoogle = undefined;\r\n      // But we need canLoadAds to pass, so set it back before the check\r\n      Object.defineProperty(window, 'adsbygoogle', {\r\n        value: [],\r\n        writable: true,\r\n        configurable: true\r\n      });\r\n\r\n      loadAd('test-ad-container', 'quizLoading');\r\n\r\n      expect(window.adsbygoogle).toBeDefined();\r\n      expect(Array.isArray(window.adsbygoogle)).toBe(true);\r\n    });\r\n  });\r\n\r\n  describe('hideContainer', () => {\r\n    it('should hide container and clear content', () => {\r\n      document.body.innerHTML = '<"+"div id=\"test-container\">Some content<"+"/div>';\r\n\r\n      hideContainer('test-container');\r\n\r\n      const container = document.getElementById('test-container');\r\n      expect(container.innerHTML).toBe('');\r\n      expect(container.style.display).toBe('none');\r\n    });\r\n\r\n    it('should not crash when container does not exist', () => {\r\n      expect(() => {\r\n        hideContainer('nonexistent');\r\n      }).not.toThrow();\r\n    });\r\n  });\r\n\r\n  describe('showContainer', () => {\r\n    it('should show container', () => {\r\n      document.body.innerHTML = '<"+"div id=\"test-container\" style=\"display: none;\"><"+"/div>';\r\n\r\n      showContainer('test-container');\r\n\r\n      const container = document.getElementById('test-container');\r\n      expect(container.style.display).toBe('block');\r\n    });\r\n\r\n    it('should not crash when container does not exist', () => {\r\n      expect(() => {\r\n        showContainer('nonexistent');\r\n      }).not.toThrow();\r\n    });\r\n  });\r\n\r\n  describe('showPlaceholder', () => {\r\n    it('should show placeholder with \"Ad Space\" text', () => {\r\n      document.body.innerHTML = '<"+"div id=\"test-container\" style=\"display: none;\"><"+"/div>';\r\n\r\n      showPlaceholder('test-container');\r\n\r\n      const container = document.getElementById('test-container');\r\n      expect(container.style.display).toBe('block');\r\n      expect(container.innerHTML).toContain('Ad Space');\r\n      expect(container.innerHTML).toContain('Awaiting AdSense approval');\r\n    });\r\n\r\n    it('should not crash when container does not exist', () => {\r\n      expect(() => {\r\n        showPlaceholder('nonexistent');\r\n      }).not.toThrow();\r\n    });\r\n  });\r\n\r\n  describe('resetForNavigation', () => {\r\n    it('should clear loaded ads tracking', async () => {\r\n      document.body.innerHTML = '<"+"div id=\"test-ad-container\"><"+"/div>';\r\n      isFeatureEnabled.mockReturnValue(true);\r\n      isOnline.mockReturnValue(true);\r\n      window.adsbygoogle = [];\r\n      setAdSlot('quizLoading', '1234567890');\r\n\r\n      // Load an ad\r\n      loadAd('test-ad-container', 'quizLoading');\r\n\r\n      // Reset\r\n      resetForNavigation();\r\n\r\n      // Should be able to load again (duplicate check should pass)\r\n      document.body.innerHTML = '<"+"div id=\"test-ad-container\"><"+"/div>';\r\n      const result = await loadAd('test-ad-container', 'quizLoading');\r\n\r\n      expect(result).toBe(true);\r\n    });\r\n\r\n    it('should log debug message', () => {\r\n      resetForNavigation();\r\n\r\n      expect(logger.debug).toHaveBeenCalledWith('[AdManager] Reset for navigation');\r\n    });\r\n  });\r\n\r\n  describe('initAdManager', () => {\r\n    it('should register online/offline listeners', () => {\r\n      isFeatureEnabled.mockReturnValue(true);\r\n      isOnline.mockReturnValue(true);\r\n\r\n      initAdManager();\r\n\r\n      expect(onOnline).toHaveBeenCalledTimes(1);\r\n      expect(onOffline).toHaveBeenCalledTimes(1);\r\n    });\r\n\r\n    it('should log initialization info with correct details', () => {\r\n      isFeatureEnabled.mockReturnValue(true);\r\n      isOnline.mockReturnValue(true);\r\n\r\n      initAdManager();\r\n\r\n      // Verify isFeatureEnabled was called with correct argument\r\n      expect(isFeatureEnabled).toHaveBeenCalledWith('SHOW_ADS');\r\n      expect(logger.info).toHaveBeenCalledWith('[AdManager] Initialized', {\r\n        publisherId: 'ca-pub-9849708569219157',\r\n        featureEnabled: true,\r\n        online: true\r\n      });\r\n    });\r\n  });\r\n\r\n  describe('getPublisherId', () => {\r\n    it('should return the publisher ID', () => {\r\n      const publisherId = getPublisherId();\r\n\r\n      expect(publisherId).toBe('ca-pub-9849708569219157');\r\n    });\r\n  });\r\n\r\n  describe('setAdSlot', () => {\r\n    it('should set slot ID for valid key', () => {\r\n      setAdSlot('quizLoading', '9999999999');\r\n\r\n      expect(logger.info).toHaveBeenCalledWith('[AdManager] Set slot quizLoading = 9999999999');\r\n    });\r\n\r\n    it('should set slot ID for resultsLoading key', () => {\r\n      setAdSlot('resultsLoading', '8888888888');\r\n\r\n      expect(logger.info).toHaveBeenCalledWith('[AdManager] Set slot resultsLoading = 8888888888');\r\n    });\r\n\r\n    it('should warn for unknown slot key', () => {\r\n      setAdSlot('unknownSlot', '1234567890');\r\n\r\n      expect(logger.warn).toHaveBeenCalledWith('[AdManager] Unknown slot key: unknownSlot');\r\n    });\r\n  });\r\n\r\n  describe('online/offline handlers', () => {\r\n    it('should register handlers that log on online event', () => {\r\n      isFeatureEnabled.mockReturnValue(true);\r\n      isOnline.mockReturnValue(true);\r\n\r\n      initAdManager();\r\n\r\n      // Get the handler that was registered\r\n      const onlineHandler = onOnline.mock.calls[0][0];\r\n\r\n      // Call the handler\r\n      onlineHandler();\r\n\r\n      expect(logger.debug).toHaveBeenCalledWith('[AdManager] Online - ads can be shown');\r\n    });\r\n\r\n    it('should register handlers that hide containers on offline event', async () => {\r\n      document.body.innerHTML = '<"+"div id=\"ad-container-1\"><"+"/div><"+"div id=\"ad-container-2\"><"+"/div>';\r\n      isFeatureEnabled.mockReturnValue(true);\r\n      isOnline.mockReturnValue(true);\r\n      window.adsbygoogle = [];\r\n\r\n      // Load ads in containers first\r\n      setAdSlot('quizLoading', '1234567890');\r\n      await loadAd('ad-container-1', 'quizLoading');\r\n\r\n      resetForNavigation(); // Clear loaded state\r\n      setAdSlot('resultsLoading', '0987654321');\r\n      await loadAd('ad-container-2', 'resultsLoading');\r\n\r\n      initAdManager();\r\n\r\n      // Get the offline handler that was registered\r\n      const offlineHandler = onOffline.mock.calls[0][0];\r\n\r\n      // Call the handler\r\n      offlineHandler();\r\n\r\n      expect(logger.debug).toHaveBeenCalledWith('[AdManager] Offline - hiding ads');\r\n      // Containers should be hidden\r\n      expect(document.getElementById('ad-container-2').style.display).toBe('none');\r\n    });\r\n  });\r\n\r\n  describe('error handling', () => {\r\n    it('should handle errors when loading ad and return false', async () => {\r\n      // Setup container\r\n      document.body.innerHTML = '<"+"div id=\"error-test-container\"><"+"/div>';\r\n      isFeatureEnabled.mockReturnValue(true);\r\n      isOnline.mockReturnValue(true);\r\n      window.adsbygoogle = [];\r\n      setAdSlot('quizLoading', '1234567890');\r\n\r\n      // Make appendChild throw an error\r\n      const container = document.getElementById('error-test-container');\r\n      container.appendChild = () => { throw new Error('DOM error'); };\r\n\r\n      const result = await loadAd('error-test-container', 'quizLoading');\r\n\r\n      expect(result).toBe(false);\r\n      expect(logger.error).toHaveBeenCalledWith('[AdManager] Error loading ad:', expect.any(Error));\r\n    });\r\n  });\r\n});\r\n"},"src/components/ParticipantList.test.js":{"tests":[{"id":"164","name":"ParticipantList createParticipantItem should create item with participant name"},{"id":"165","name":"ParticipantList createParticipantItem should show host badge for host"},{"id":"166","name":"ParticipantList createParticipantItem should not show host badge for non-host"},{"id":"167","name":"ParticipantList createParticipantItem should show \"You\" indicator for current user"},{"id":"168","name":"ParticipantList createParticipantItem should show score when provided"},{"id":"169","name":"ParticipantList createParticipantItem should show status indicator when showStatus is true"},{"id":"170","name":"ParticipantList createParticipantItem should not show status indicator when showStatus is false"},{"id":"171","name":"ParticipantList createParticipantItem should show answered status"},{"id":"172","name":"ParticipantList createParticipantItem should show thinking status"},{"id":"173","name":"ParticipantList createParticipantList should create list container"},{"id":"174","name":"ParticipantList createParticipantList should show participants header"},{"id":"175","name":"ParticipantList createParticipantList should show participant count"},{"id":"176","name":"ParticipantList createParticipantList should create item for each participant"},{"id":"177","name":"ParticipantList createParticipantList should handle empty participant list"},{"id":"178","name":"ParticipantList createParticipantList should pass showStatus option to items"},{"id":"179","name":"ParticipantList createParticipantList should pass showScore option to items"},{"id":"180","name":"ParticipantList createParticipantList should not show scores when showScore is false"},{"id":"181","name":"ParticipantList createParticipantList should mark host first if present"}],"source":"/**\r\n * @vitest-environment jsdom\r\n */\r\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\r\nimport { createParticipantList, createParticipantItem } from './ParticipantList.js';\r\n\r\n// Mock dependencies\r\nvi.mock('../core/i18n.js', () => ({\r\n  t: (key) => {\r\n    const translations = {\r\n      'party.participants': 'Participants',\r\n      'party.host': 'host',\r\n      'party.you': 'You',\r\n      'party.answered': 'answered',\r\n      'party.thinking': 'thinking',\r\n    };\r\n    return translations[key] || key;\r\n  },\r\n}));\r\n\r\ndescribe('ParticipantList', () => {\r\n  const mockParticipants = [\r\n    { id: '1', name: 'Alice', isHost: true, status: 'connected' },\r\n    { id: '2', name: 'Bob', isHost: false, isYou: true, status: 'connected' },\r\n    { id: '3', name: 'Charlie', isHost: false, status: 'answered' },\r\n  ];\r\n\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  describe('createParticipantItem', () => {\r\n    it('should create item with participant name', () => {\r\n      const item = createParticipantItem({ id: '1', name: 'Alice' });\r\n\r\n      expect(item.textContent).toContain('Alice');\r\n    });\r\n\r\n    it('should show host badge for host', () => {\r\n      const item = createParticipantItem({\r\n        id: '1',\r\n        name: 'Alice',\r\n        isHost: true,\r\n      });\r\n\r\n      expect(item.textContent).toContain('host');\r\n    });\r\n\r\n    it('should not show host badge for non-host', () => {\r\n      const item = createParticipantItem({\r\n        id: '1',\r\n        name: 'Bob',\r\n        isHost: false,\r\n      });\r\n\r\n      const hostBadge = item.querySelector('[data-testid=\"host-badge\"]');\r\n      expect(hostBadge).toBeNull();\r\n    });\r\n\r\n    it('should show \"You\" indicator for current user', () => {\r\n      const item = createParticipantItem({\r\n        id: '1',\r\n        name: 'Bob',\r\n        isYou: true,\r\n      });\r\n\r\n      expect(item.textContent).toContain('You');\r\n    });\r\n\r\n    it('should show score when provided', () => {\r\n      const item = createParticipantItem(\r\n        {\r\n          id: '1',\r\n          name: 'Alice',\r\n          score: 100,\r\n        },\r\n        { showScore: true }\r\n      );\r\n\r\n      expect(item.textContent).toContain('100');\r\n    });\r\n\r\n    it('should show status indicator when showStatus is true', () => {\r\n      const item = createParticipantItem(\r\n        { id: '1', name: 'Alice', status: 'connected' },\r\n        { showStatus: true }\r\n      );\r\n\r\n      const statusIndicator = item.querySelector('[data-testid=\"status-indicator\"]');\r\n      expect(statusIndicator).not.toBeNull();\r\n    });\r\n\r\n    it('should not show status indicator when showStatus is false', () => {\r\n      const item = createParticipantItem(\r\n        { id: '1', name: 'Alice', status: 'connected' },\r\n        { showStatus: false }\r\n      );\r\n\r\n      const statusIndicator = item.querySelector('[data-testid=\"status-indicator\"]');\r\n      expect(statusIndicator).toBeNull();\r\n    });\r\n\r\n    it('should show answered status', () => {\r\n      const item = createParticipantItem(\r\n        { id: '1', name: 'Alice', status: 'answered' },\r\n        { showStatus: true }\r\n      );\r\n\r\n      expect(item.textContent).toContain('answered');\r\n    });\r\n\r\n    it('should show thinking status', () => {\r\n      const item = createParticipantItem(\r\n        { id: '1', name: 'Alice', status: 'thinking' },\r\n        { showStatus: true }\r\n      );\r\n\r\n      expect(item.textContent).toContain('thinking');\r\n    });\r\n  });\r\n\r\n  describe('createParticipantList', () => {\r\n    it('should create list container', () => {\r\n      const list = createParticipantList(mockParticipants);\r\n\r\n      expect(list).toBeInstanceOf(HTMLElement);\r\n    });\r\n\r\n    it('should show participants header', () => {\r\n      const list = createParticipantList(mockParticipants);\r\n\r\n      expect(list.textContent).toContain('Participants');\r\n    });\r\n\r\n    it('should show participant count', () => {\r\n      const list = createParticipantList(mockParticipants);\r\n\r\n      expect(list.textContent).toContain('3');\r\n    });\r\n\r\n    it('should create item for each participant', () => {\r\n      const list = createParticipantList(mockParticipants);\r\n\r\n      expect(list.textContent).toContain('Alice');\r\n      expect(list.textContent).toContain('Bob');\r\n      expect(list.textContent).toContain('Charlie');\r\n    });\r\n\r\n    it('should handle empty participant list', () => {\r\n      const list = createParticipantList([]);\r\n\r\n      expect(list).toBeInstanceOf(HTMLElement);\r\n      expect(list.textContent).toContain('0');\r\n    });\r\n\r\n    it('should pass showStatus option to items', () => {\r\n      const list = createParticipantList(mockParticipants, { showStatus: true });\r\n\r\n      const statusIndicators = list.querySelectorAll('[data-testid=\"status-indicator\"]');\r\n      expect(statusIndicators.length).toBeGreaterThan(0);\r\n    });\r\n\r\n    it('should pass showScore option to items', () => {\r\n      const participantsWithScores = mockParticipants.map((p, i) => ({\r\n        ...p,\r\n        score: i * 100,\r\n      }));\r\n\r\n      const list = createParticipantList(participantsWithScores, { showScore: true });\r\n\r\n      expect(list.textContent).toContain('0');\r\n      expect(list.textContent).toContain('100');\r\n      expect(list.textContent).toContain('200');\r\n    });\r\n\r\n    it('should not show scores when showScore is false', () => {\r\n      const participantsWithScores = [\r\n        { id: '1', name: 'Alice', score: 999 },\r\n      ];\r\n\r\n      const list = createParticipantList(participantsWithScores, { showScore: false });\r\n\r\n      // Score should not appear when showScore is false\r\n      const scoreElements = list.querySelectorAll('[data-testid=\"participant-score\"]');\r\n      expect(scoreElements.length).toBe(0);\r\n    });\r\n\r\n    it('should mark host first if present', () => {\r\n      const unorderedParticipants = [\r\n        { id: '2', name: 'Bob', isHost: false },\r\n        { id: '1', name: 'Alice', isHost: true },\r\n      ];\r\n\r\n      const list = createParticipantList(unorderedParticipants);\r\n      const items = list.querySelectorAll('[data-testid=\"participant-item\"]');\r\n\r\n      // First item should be Alice (the host)\r\n      expect(items[0].textContent).toContain('Alice');\r\n    });\r\n  });\r\n});\r\n"},"src/components/ModeToggle.test.js":{"tests":[{"id":"182","name":"ModeToggle Component createModeToggle should return an HTML element"},{"id":"183","name":"ModeToggle Component createModeToggle should have correct container classes"},{"id":"184","name":"ModeToggle Component createModeToggle should have correct ARIA attributes on container"},{"id":"185","name":"ModeToggle Component createModeToggle should contain two buttons"},{"id":"186","name":"ModeToggle Component createModeToggle should have learning button with correct data-mode"},{"id":"187","name":"ModeToggle Component createModeToggle should have party button with correct data-mode"},{"id":"188","name":"ModeToggle Component createModeToggle should display translated labels"},{"id":"189","name":"ModeToggle Component createModeToggle should display emojis"},{"id":"190","name":"ModeToggle Component initial state - learning mode should highlight learning button when mode is learning"},{"id":"191","name":"ModeToggle Component initial state - learning mode should not highlight party button when mode is learning"},{"id":"192","name":"ModeToggle Component initial state - learning mode should set aria-selected correctly for learning mode"},{"id":"193","name":"ModeToggle Component initial state - party mode should highlight party button when mode is party"},{"id":"194","name":"ModeToggle Component initial state - party mode should not highlight learning button when mode is party"},{"id":"195","name":"ModeToggle Component initial state - party mode should set aria-selected correctly for party mode"},{"id":"196","name":"ModeToggle Component click interactions should call setMode when party button is clicked"},{"id":"197","name":"ModeToggle Component click interactions should call setMode when learning button is clicked"},{"id":"198","name":"ModeToggle Component click interactions should update UI after clicking party button"},{"id":"199","name":"ModeToggle Component click interactions should update UI after clicking learning button"},{"id":"200","name":"ModeToggle Component click interactions should not call setMode when clicking outside buttons"},{"id":"201","name":"ModeToggle Component click interactions should handle clicking on emoji inside button"},{"id":"202","name":"ModeToggle Component accessibility should have role=\"tab\" on buttons"},{"id":"203","name":"ModeToggle Component accessibility should have aria-label on buttons"}],"source":"import { describe, it, expect, beforeEach, vi } from 'vitest';\r\nimport { createModeToggle } from './ModeToggle.js';\r\nimport { getCurrentMode, setMode } from '../services/theme-manager.js';\r\nimport { t } from '../core/i18n.js';\r\n\r\n// Mock dependencies\r\nvi.mock('../services/theme-manager.js', () => ({\r\n  getCurrentMode: vi.fn(),\r\n  setMode: vi.fn()\r\n}));\r\n\r\nvi.mock('../core/i18n.js', () => ({\r\n  t: vi.fn((key) => {\r\n    const translations = {\r\n      'mode.learn': 'Learn',\r\n      'mode.party': 'Party',\r\n      'mode.switchToLearn': 'Switch to Learning Mode',\r\n      'mode.switchToParty': 'Switch to Party Mode'\r\n    };\r\n    return translations[key] || key;\r\n  })\r\n}));\r\n\r\ndescribe('ModeToggle Component', () => {\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n    getCurrentMode.mockReturnValue('learning');\r\n  });\r\n\r\n  describe('createModeToggle', () => {\r\n    it('should return an HTML element', () => {\r\n      const toggle = createModeToggle();\r\n\r\n      expect(toggle).toBeInstanceOf(HTMLElement);\r\n      expect(toggle.tagName).toBe('DIV');\r\n    });\r\n\r\n    it('should have correct container classes', () => {\r\n      const toggle = createModeToggle();\r\n\r\n      expect(toggle.classList.contains('mode-toggle')).toBe(true);\r\n      expect(toggle.classList.contains('flex')).toBe(true);\r\n      expect(toggle.classList.contains('rounded-lg')).toBe(true);\r\n    });\r\n\r\n    it('should have correct ARIA attributes on container', () => {\r\n      const toggle = createModeToggle();\r\n\r\n      expect(toggle.getAttribute('role')).toBe('tablist');\r\n      expect(toggle.getAttribute('aria-label')).toBe('App mode');\r\n    });\r\n\r\n    it('should contain two buttons', () => {\r\n      const toggle = createModeToggle();\r\n      const buttons = toggle.querySelectorAll('button');\r\n\r\n      expect(buttons.length).toBe(2);\r\n    });\r\n\r\n    it('should have learning button with correct data-mode', () => {\r\n      const toggle = createModeToggle();\r\n      const learnBtn = toggle.querySelector('[data-mode=\"learning\"]');\r\n\r\n      expect(learnBtn).not.toBeNull();\r\n      expect(learnBtn.tagName).toBe('BUTTON');\r\n    });\r\n\r\n    it('should have party button with correct data-mode', () => {\r\n      const toggle = createModeToggle();\r\n      const partyBtn = toggle.querySelector('[data-mode=\"party\"]');\r\n\r\n      expect(partyBtn).not.toBeNull();\r\n      expect(partyBtn.tagName).toBe('BUTTON');\r\n    });\r\n\r\n    it('should display translated labels', () => {\r\n      const toggle = createModeToggle();\r\n\r\n      expect(toggle.textContent).toContain('Learn');\r\n      expect(toggle.textContent).toContain('Party');\r\n    });\r\n\r\n    it('should display emojis', () => {\r\n      const toggle = createModeToggle();\r\n\r\n      expect(toggle.textContent).toContain('📚');\r\n      expect(toggle.textContent).toContain('🎉');\r\n    });\r\n  });\r\n\r\n  describe('initial state - learning mode', () => {\r\n    beforeEach(() => {\r\n      getCurrentMode.mockReturnValue('learning');\r\n    });\r\n\r\n    it('should highlight learning button when mode is learning', () => {\r\n      const toggle = createModeToggle();\r\n      const learnBtn = toggle.querySelector('[data-mode=\"learning\"]');\r\n\r\n      expect(learnBtn.classList.contains('bg-white')).toBe(true);\r\n      expect(learnBtn.classList.contains('text-primary')).toBe(true);\r\n    });\r\n\r\n    it('should not highlight party button when mode is learning', () => {\r\n      const toggle = createModeToggle();\r\n      const partyBtn = toggle.querySelector('[data-mode=\"party\"]');\r\n\r\n      expect(partyBtn.classList.contains('bg-white')).toBe(false);\r\n      expect(partyBtn.classList.contains('text-subtext-light')).toBe(true);\r\n    });\r\n\r\n    it('should set aria-selected correctly for learning mode', () => {\r\n      const toggle = createModeToggle();\r\n      const learnBtn = toggle.querySelector('[data-mode=\"learning\"]');\r\n      const partyBtn = toggle.querySelector('[data-mode=\"party\"]');\r\n\r\n      expect(learnBtn.getAttribute('aria-selected')).toBe('true');\r\n      expect(partyBtn.getAttribute('aria-selected')).toBe('false');\r\n    });\r\n  });\r\n\r\n  describe('initial state - party mode', () => {\r\n    beforeEach(() => {\r\n      getCurrentMode.mockReturnValue('party');\r\n    });\r\n\r\n    it('should highlight party button when mode is party', () => {\r\n      const toggle = createModeToggle();\r\n      const partyBtn = toggle.querySelector('[data-mode=\"party\"]');\r\n\r\n      expect(partyBtn.classList.contains('bg-white')).toBe(true);\r\n      expect(partyBtn.classList.contains('text-primary')).toBe(true);\r\n    });\r\n\r\n    it('should not highlight learning button when mode is party', () => {\r\n      const toggle = createModeToggle();\r\n      const learnBtn = toggle.querySelector('[data-mode=\"learning\"]');\r\n\r\n      expect(learnBtn.classList.contains('bg-white')).toBe(false);\r\n      expect(learnBtn.classList.contains('text-subtext-light')).toBe(true);\r\n    });\r\n\r\n    it('should set aria-selected correctly for party mode', () => {\r\n      const toggle = createModeToggle();\r\n      const learnBtn = toggle.querySelector('[data-mode=\"learning\"]');\r\n      const partyBtn = toggle.querySelector('[data-mode=\"party\"]');\r\n\r\n      expect(learnBtn.getAttribute('aria-selected')).toBe('false');\r\n      expect(partyBtn.getAttribute('aria-selected')).toBe('true');\r\n    });\r\n  });\r\n\r\n  describe('click interactions', () => {\r\n    beforeEach(() => {\r\n      getCurrentMode.mockReturnValue('learning');\r\n    });\r\n\r\n    it('should call setMode when party button is clicked', () => {\r\n      const toggle = createModeToggle();\r\n      const partyBtn = toggle.querySelector('[data-mode=\"party\"]');\r\n\r\n      partyBtn.click();\r\n\r\n      expect(setMode).toHaveBeenCalledWith('party');\r\n    });\r\n\r\n    it('should call setMode when learning button is clicked', () => {\r\n      getCurrentMode.mockReturnValue('party');\r\n      const toggle = createModeToggle();\r\n      const learnBtn = toggle.querySelector('[data-mode=\"learning\"]');\r\n\r\n      learnBtn.click();\r\n\r\n      expect(setMode).toHaveBeenCalledWith('learning');\r\n    });\r\n\r\n    it('should update UI after clicking party button', () => {\r\n      const toggle = createModeToggle();\r\n      const partyBtn = toggle.querySelector('[data-mode=\"party\"]');\r\n      const learnBtn = toggle.querySelector('[data-mode=\"learning\"]');\r\n\r\n      partyBtn.click();\r\n\r\n      // Party should now be highlighted\r\n      expect(partyBtn.classList.contains('bg-white')).toBe(true);\r\n      expect(partyBtn.classList.contains('text-primary')).toBe(true);\r\n      expect(partyBtn.getAttribute('aria-selected')).toBe('true');\r\n\r\n      // Learning should no longer be highlighted\r\n      expect(learnBtn.classList.contains('bg-white')).toBe(false);\r\n      expect(learnBtn.classList.contains('text-subtext-light')).toBe(true);\r\n      expect(learnBtn.getAttribute('aria-selected')).toBe('false');\r\n    });\r\n\r\n    it('should update UI after clicking learning button', () => {\r\n      getCurrentMode.mockReturnValue('party');\r\n      const toggle = createModeToggle();\r\n      const learnBtn = toggle.querySelector('[data-mode=\"learning\"]');\r\n      const partyBtn = toggle.querySelector('[data-mode=\"party\"]');\r\n\r\n      learnBtn.click();\r\n\r\n      // Learning should now be highlighted\r\n      expect(learnBtn.classList.contains('bg-white')).toBe(true);\r\n      expect(learnBtn.classList.contains('text-primary')).toBe(true);\r\n      expect(learnBtn.getAttribute('aria-selected')).toBe('true');\r\n\r\n      // Party should no longer be highlighted\r\n      expect(partyBtn.classList.contains('bg-white')).toBe(false);\r\n      expect(partyBtn.classList.contains('text-subtext-light')).toBe(true);\r\n      expect(partyBtn.getAttribute('aria-selected')).toBe('false');\r\n    });\r\n\r\n    it('should not call setMode when clicking outside buttons', () => {\r\n      const toggle = createModeToggle();\r\n\r\n      // Click on the container itself, not a button\r\n      toggle.click();\r\n\r\n      expect(setMode).not.toHaveBeenCalled();\r\n    });\r\n\r\n    it('should handle clicking on emoji inside button', () => {\r\n      const toggle = createModeToggle();\r\n      const partyBtn = toggle.querySelector('[data-mode=\"party\"]');\r\n      const emoji = partyBtn.querySelector('span');\r\n\r\n      // Simulate clicking on the emoji span\r\n      emoji.click();\r\n\r\n      expect(setMode).toHaveBeenCalledWith('party');\r\n    });\r\n  });\r\n\r\n  describe('accessibility', () => {\r\n    it('should have role=\"tab\" on buttons', () => {\r\n      const toggle = createModeToggle();\r\n      const buttons = toggle.querySelectorAll('button');\r\n\r\n      buttons.forEach(btn => {\r\n        expect(btn.getAttribute('role')).toBe('tab');\r\n      });\r\n    });\r\n\r\n    it('should have aria-label on buttons', () => {\r\n      const toggle = createModeToggle();\r\n      const learnBtn = toggle.querySelector('[data-mode=\"learning\"]');\r\n      const partyBtn = toggle.querySelector('[data-mode=\"party\"]');\r\n\r\n      expect(learnBtn.getAttribute('aria-label')).toBe('Switch to Learning Mode');\r\n      expect(partyBtn.getAttribute('aria-label')).toBe('Switch to Party Mode');\r\n    });\r\n  });\r\n});\r\n"},"src/components/RoomCodeDisplay.test.js":{"tests":[{"id":"204","name":"RoomCodeDisplay formatRoomCode should format 6-character code with middle dash"},{"id":"205","name":"RoomCodeDisplay formatRoomCode should handle already formatted code"},{"id":"206","name":"RoomCodeDisplay formatRoomCode should handle short codes without dash"},{"id":"207","name":"RoomCodeDisplay formatRoomCode should handle empty string"},{"id":"208","name":"RoomCodeDisplay createRoomCodeDisplay should create display element with formatted code"},{"id":"209","name":"RoomCodeDisplay createRoomCodeDisplay should include copy button when showCopy is true"},{"id":"210","name":"RoomCodeDisplay createRoomCodeDisplay should not include copy button when showCopy is false"},{"id":"211","name":"RoomCodeDisplay createRoomCodeDisplay should include share button when showShare is true"},{"id":"212","name":"RoomCodeDisplay createRoomCodeDisplay should not include share button when showShare is false"},{"id":"213","name":"RoomCodeDisplay createRoomCodeDisplay should call copyToClipboard when copy button clicked"},{"id":"214","name":"RoomCodeDisplay createRoomCodeDisplay should show feedback after copying"},{"id":"215","name":"RoomCodeDisplay createRoomCodeDisplay should call onShare callback when share button clicked"},{"id":"216","name":"RoomCodeDisplay createRoomCodeDisplay should use shareContent when no onShare callback provided"},{"id":"217","name":"RoomCodeDisplay createRoomCodeDisplay should include label by default"},{"id":"218","name":"RoomCodeDisplay createRoomCodeDisplay should hide label when showLabel is false"}],"source":"/**\r\n * @vitest-environment jsdom\r\n */\r\nimport { describe, it, expect, vi, beforeEach, afterEach } from 'vitest';\r\nimport { createRoomCodeDisplay, formatRoomCode } from './RoomCodeDisplay.js';\r\n\r\n// Mock dependencies\r\nvi.mock('../core/i18n.js', () => ({\r\n  t: (key) => {\r\n    const translations = {\r\n      'party.code': 'Room Code',\r\n      'party.copyCode': 'Copy Code',\r\n      'party.codeCopied': 'Code copied!',\r\n      'party.showQR': 'QR Code',\r\n      'party.shareNative': 'Share...',\r\n    };\r\n    return translations[key] || key;\r\n  },\r\n}));\r\n\r\nvi.mock('../utils/share.js', () => ({\r\n  copyToClipboard: vi.fn().mockResolvedValue(true),\r\n  shareContent: vi.fn().mockResolvedValue(true),\r\n}));\r\n\r\ndescribe('RoomCodeDisplay', () => {\r\n  beforeEach(() => {\r\n    vi.useFakeTimers();\r\n  });\r\n\r\n  afterEach(() => {\r\n    vi.useRealTimers();\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  describe('formatRoomCode', () => {\r\n    it('should format 6-character code with middle dash', () => {\r\n      expect(formatRoomCode('ABCDEF')).toBe('ABC-DEF');\r\n    });\r\n\r\n    it('should handle already formatted code', () => {\r\n      expect(formatRoomCode('ABC-DEF')).toBe('ABC-DEF');\r\n    });\r\n\r\n    it('should handle short codes without dash', () => {\r\n      expect(formatRoomCode('ABC')).toBe('ABC');\r\n    });\r\n\r\n    it('should handle empty string', () => {\r\n      expect(formatRoomCode('')).toBe('');\r\n    });\r\n  });\r\n\r\n  describe('createRoomCodeDisplay', () => {\r\n    it('should create display element with formatted code', () => {\r\n      const display = createRoomCodeDisplay('ABCDEF');\r\n\r\n      expect(display).toBeInstanceOf(HTMLElement);\r\n      expect(display.textContent).toContain('ABC-DEF');\r\n    });\r\n\r\n    it('should include copy button when showCopy is true', () => {\r\n      const display = createRoomCodeDisplay('ABCDEF', { showCopy: true });\r\n\r\n      const copyButton = display.querySelector('[data-testid=\"copy-code-btn\"]');\r\n      expect(copyButton).not.toBeNull();\r\n      expect(copyButton.textContent).toContain('Copy Code');\r\n    });\r\n\r\n    it('should not include copy button when showCopy is false', () => {\r\n      const display = createRoomCodeDisplay('ABCDEF', { showCopy: false });\r\n\r\n      const copyButton = display.querySelector('[data-testid=\"copy-code-btn\"]');\r\n      expect(copyButton).toBeNull();\r\n    });\r\n\r\n    it('should include share button when showShare is true', () => {\r\n      const display = createRoomCodeDisplay('ABCDEF', { showShare: true });\r\n\r\n      const shareButton = display.querySelector('[data-testid=\"share-code-btn\"]');\r\n      expect(shareButton).not.toBeNull();\r\n      expect(shareButton.textContent).toContain('Share');\r\n    });\r\n\r\n    it('should not include share button when showShare is false', () => {\r\n      const display = createRoomCodeDisplay('ABCDEF', { showShare: false });\r\n\r\n      const shareButton = display.querySelector('[data-testid=\"share-code-btn\"]');\r\n      expect(shareButton).toBeNull();\r\n    });\r\n\r\n    it('should call copyToClipboard when copy button clicked', async () => {\r\n      const { copyToClipboard } = await import('../utils/share.js');\r\n      const display = createRoomCodeDisplay('ABCDEF', { showCopy: true });\r\n\r\n      const copyButton = display.querySelector('[data-testid=\"copy-code-btn\"]');\r\n      copyButton.click();\r\n\r\n      expect(copyToClipboard).toHaveBeenCalledWith('ABCDEF');\r\n    });\r\n\r\n    it('should show feedback after copying', async () => {\r\n      const display = createRoomCodeDisplay('ABCDEF', { showCopy: true });\r\n\r\n      const copyButton = display.querySelector('[data-testid=\"copy-code-btn\"]');\r\n      copyButton.click();\r\n\r\n      // Wait for the async click handler to complete\r\n      await Promise.resolve();\r\n      await vi.advanceTimersByTimeAsync(0);\r\n\r\n      // Check for feedback text\r\n      expect(copyButton.textContent).toContain('Code copied!');\r\n    });\r\n\r\n    it('should call onShare callback when share button clicked', async () => {\r\n      const onShare = vi.fn();\r\n      const display = createRoomCodeDisplay('ABCDEF', {\r\n        showShare: true,\r\n        onShare,\r\n      });\r\n\r\n      const shareButton = display.querySelector('[data-testid=\"share-code-btn\"]');\r\n      shareButton.click();\r\n\r\n      expect(onShare).toHaveBeenCalledWith('ABCDEF');\r\n    });\r\n\r\n    it('should use shareContent when no onShare callback provided', async () => {\r\n      const { shareContent } = await import('../utils/share.js');\r\n      const display = createRoomCodeDisplay('ABCDEF', { showShare: true });\r\n\r\n      const shareButton = display.querySelector('[data-testid=\"share-code-btn\"]');\r\n      shareButton.click();\r\n\r\n      expect(shareContent).toHaveBeenCalled();\r\n    });\r\n\r\n    it('should include label by default', () => {\r\n      const display = createRoomCodeDisplay('ABCDEF');\r\n\r\n      expect(display.textContent).toContain('Room Code');\r\n    });\r\n\r\n    it('should hide label when showLabel is false', () => {\r\n      const display = createRoomCodeDisplay('ABCDEF', { showLabel: false });\r\n\r\n      expect(display.textContent).not.toContain('Room Code');\r\n    });\r\n  });\r\n});\r\n"},"src/api/openrouter-client.test.js":{"tests":[{"id":"219","name":"OpenRouter Client callOpenRouter should call fetch with correct URL"},{"id":"220","name":"OpenRouter Client callOpenRouter should send correct headers"},{"id":"221","name":"OpenRouter Client callOpenRouter should use default model when not specified"},{"id":"222","name":"OpenRouter Client callOpenRouter should use custom model when specified"},{"id":"223","name":"OpenRouter Client callOpenRouter should return text, model, and usage from response"},{"id":"224","name":"OpenRouter Client callOpenRouter should throw error on 401 (invalid API key)"},{"id":"225","name":"OpenRouter Client callOpenRouter should throw error on 429 (rate limit) after retries"},{"id":"226","name":"OpenRouter Client callOpenRouter should throw error on 402 (insufficient credits)"},{"id":"227","name":"OpenRouter Client callOpenRouter should throw error on empty response after retries fail"},{"id":"228","name":"OpenRouter Client callOpenRouter should use reasoning field when content is empty and reasoning is not chain-of-thought"},{"id":"229","name":"OpenRouter Client callOpenRouter should reject chain-of-thought reasoning as answer after retries"},{"id":"230","name":"OpenRouter Client callOpenRouter should prefer content over reasoning when both are present"},{"id":"231","name":"OpenRouter Client testApiKey should return true when API call succeeds"},{"id":"232","name":"OpenRouter Client testApiKey should return false when API call fails"},{"id":"233","name":"OpenRouter Client getCreditsBalance should fetch credits from /api/v1/auth/key"},{"id":"234","name":"OpenRouter Client getCreditsBalance should return balance and formatted balance"},{"id":"235","name":"OpenRouter Client getCreditsBalance should handle zero balance"},{"id":"236","name":"OpenRouter Client getCreditsBalance should return null on API failure"},{"id":"237","name":"OpenRouter Client getCreditsBalance should return null when limit_remaining is missing"},{"id":"238","name":"OpenRouter Client getCreditsBalance should return null on network error after retries"}],"source":"\r\n  import { describe, it, expect, vi, beforeEach, afterEach } from 'vitest';\r\n  import { callOpenRouter, testApiKey, getCreditsBalance } from './openrouter-client.js';\r\n\r\n  describe('OpenRouter Client', () => {\r\n    // Mock fetch globally\r\n    const mockFetch = vi.fn();\r\n\r\n    beforeEach(() => {\r\n      vi.stubGlobal('fetch', mockFetch);\r\n      mockFetch.mockReset();\r\n      vi.useFakeTimers();\r\n    });\r\n\r\n    afterEach(() => {\r\n      vi.unstubAllGlobals();\r\n      vi.useRealTimers();\r\n    });\r\n\r\n    describe('callOpenRouter', () => {\r\n      it('should call fetch with correct URL', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            choices: [{ message: { content: 'Hello!' } }],\r\n            model: 'test-model',\r\n            usage: { total_tokens: 10 }\r\n          })\r\n        });\r\n\r\n        await callOpenRouter('sk-test-key', 'Say hello');\r\n\r\n        expect(mockFetch).toHaveBeenCalledWith(\r\n          'https://openrouter.ai/api/v1/chat/completions',\r\n          expect.any(Object)\r\n        );\r\n      });\r\n\r\n      it('should send correct headers', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            choices: [{ message: { content: 'Hello!' } }],\r\n            model: 'test-model',\r\n            usage: {}\r\n          })\r\n        });\r\n\r\n        await callOpenRouter('sk-test-key', 'Say hello');\r\n\r\n        const callArgs = mockFetch.mock.calls[0][1];\r\n        expect(callArgs.headers['Authorization']).toBe('Bearer sk-test-key');\r\n        expect(callArgs.headers['Content-Type']).toBe('application/json');\r\n        expect(callArgs.headers['X-Title']).toBe('SaberLoop');\r\n      });\r\n\r\n      it('should use default model when not specified', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            choices: [{ message: { content: 'Response' } }],\r\n            model: 'default-model',\r\n            usage: {}\r\n          })\r\n        });\r\n\r\n        await callOpenRouter('sk-test-key', 'Test prompt');\r\n\r\n        const callArgs = mockFetch.mock.calls[0][1];\r\n        const body = JSON.parse(callArgs.body);\r\n        expect(body.model).toBe('tngtech/deepseek-r1t2-chimera:free');\r\n      });\r\n\r\n      it('should use custom model when specified', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            choices: [{ message: { content: 'Response' } }],\r\n            model: 'openai/gpt-4',\r\n            usage: {}\r\n          })\r\n        });\r\n\r\n        await callOpenRouter('sk-test-key', 'Test prompt', { model: 'openai/gpt-4' });        \r\n\r\n        const callArgs = mockFetch.mock.calls[0][1];\r\n        const body = JSON.parse(callArgs.body);\r\n        expect(body.model).toBe('openai/gpt-4');\r\n      });\r\n\r\n      it('should return text, model, and usage from response', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            choices: [{ message: { content: 'The answer is 42' } }],\r\n            model: 'test-model',\r\n            usage: { total_tokens: 50, prompt_tokens: 10, completion_tokens: 40 }\r\n          })\r\n        });\r\n\r\n        const result = await callOpenRouter('sk-test-key', 'What is the answer?');\r\n\r\n        expect(result.text).toBe('The answer is 42');\r\n        expect(result.model).toBe('test-model');\r\n        expect(result.usage).toEqual({\r\n          promptTokens: 10,\r\n          completionTokens: 40,\r\n          totalTokens: 50,\r\n          costUsd: 0\r\n        });\r\n      });\r\n\r\n      it('should throw error on 401 (invalid API key)', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: false,\r\n          status: 401,\r\n          json: () => Promise.resolve({ error: { message: 'Unauthorized' } })\r\n        });\r\n\r\n        await expect(callOpenRouter('bad-key', 'Test'))\r\n          .rejects.toThrow('Invalid API key');\r\n      });\r\n\r\n      it('should throw error on 429 (rate limit) after retries', async () => {\r\n        // 429 is retryable, so we need to mock multiple responses\r\n        // maxRetries is 3, so we need 3 429 responses\r\n        const mock429Response = {\r\n          ok: false,\r\n          status: 429,\r\n          json: () => Promise.resolve({ error: { message: 'Too many requests' } })\r\n        };\r\n        mockFetch\r\n          .mockResolvedValueOnce(mock429Response)\r\n          .mockResolvedValueOnce(mock429Response)\r\n          .mockResolvedValueOnce(mock429Response);\r\n\r\n        const promise = callOpenRouter('sk-test-key', 'Test');\r\n\r\n        // Catch to prevent unhandled rejection warnings\r\n        promise.catch(() => {});\r\n\r\n        // Advance through retry delays (1s, 2s)\r\n        await vi.advanceTimersByTimeAsync(0);    // First attempt\r\n        await vi.advanceTimersByTimeAsync(1000); // First retry\r\n        await vi.advanceTimersByTimeAsync(2000); // Second retry (3rd attempt)\r\n\r\n        await expect(promise).rejects.toThrow('Rate limit exceeded');\r\n        expect(mockFetch).toHaveBeenCalledTimes(3);\r\n      });\r\n\r\n      it('should throw error on 402 (insufficient credits)', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: false,\r\n          status: 402,\r\n          json: () => Promise.resolve({ error: { message: 'Payment required' } })\r\n        });\r\n\r\n        await expect(callOpenRouter('sk-test-key', 'Test'))\r\n          .rejects.toThrow('Insufficient credits');\r\n      });\r\n\r\n      it('should throw error on empty response after retries fail', async () => {\r\n        // Empty responses are now retried (up to 3 times), so mock all retries as empty\r\n        const emptyResponse = {\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            choices: [{ message: { content: '', reasoning: '' } }],\r\n            model: 'test-model',\r\n            usage: {}\r\n          })\r\n        };\r\n        mockFetch\r\n          .mockResolvedValue(emptyResponse); // All calls return empty\r\n\r\n        // Start the call and immediately attach error handler to prevent unhandled rejection\r\n        let caughtError = null;\r\n        const promise = callOpenRouter('sk-test-key', 'Test').catch(e => {\r\n          caughtError = e;\r\n        });\r\n\r\n        // Run all timers and pending promises to completion\r\n        await vi.runAllTimersAsync();\r\n        await promise;\r\n\r\n        // Verify the error was thrown\r\n        expect(caughtError).not.toBeNull();\r\n        expect(caughtError.message).toBe('Empty response from OpenRouter');\r\n      });\r\n\r\n      it('should use reasoning field when content is empty and reasoning is not chain-of-thought', async () => {\r\n        // Some models may put actual answer in reasoning field\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            choices: [{ message: { content: '', reasoning: 'A resposta correta é 32 dentes.' } }],\r\n            model: 'deepseek-r1t2-chimera',\r\n            usage: { total_tokens: 100 }\r\n          })\r\n        });\r\n\r\n        const result = await callOpenRouter('sk-test-key', 'Test prompt');\r\n\r\n        expect(result.text).toBe('A resposta correta é 32 dentes.');\r\n      });\r\n\r\n      it('should reject chain-of-thought reasoning as answer after retries', async () => {\r\n        // Chain-of-thought should not be used as the answer\r\n        // Empty responses are now retried (up to 3 times), so mock all retries\r\n        const chainOfThoughtResponse = {\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            choices: [{ message: { content: '', reasoning: 'Okay, let me think about this...' } }],\r\n            model: 'deepseek-r1t2-chimera',\r\n            usage: { total_tokens: 100 }\r\n          })\r\n        };\r\n        mockFetch.mockResolvedValue(chainOfThoughtResponse); // All calls return chain-of-thought\r\n\r\n        // Start the call and immediately attach error handler to prevent unhandled rejection\r\n        let caughtError = null;\r\n        const promise = callOpenRouter('sk-test-key', 'Test prompt').catch(e => {\r\n          caughtError = e;\r\n        });\r\n\r\n        // Run all timers and pending promises to completion\r\n        await vi.runAllTimersAsync();\r\n        await promise;\r\n\r\n        // Verify the error was thrown\r\n        expect(caughtError).not.toBeNull();\r\n        expect(caughtError.message).toBe('Empty response from OpenRouter');\r\n      });\r\n\r\n      it('should prefer content over reasoning when both are present', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            choices: [{ message: { content: 'Content response', reasoning: 'Reasoning response' } }],\r\n            model: 'test-model',\r\n            usage: {}\r\n          })\r\n        });\r\n\r\n        const result = await callOpenRouter('sk-test-key', 'Test prompt');\r\n\r\n        expect(result.text).toBe('Content response');\r\n      });\r\n    });\r\n\r\n    describe('testApiKey', () => {\r\n      it('should return true when API call succeeds', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            choices: [{ message: { content: 'ok' } }],\r\n            model: 'test-model',\r\n            usage: {}\r\n          })\r\n        });\r\n\r\n        const result = await testApiKey('sk-valid-key');\r\n        expect(result).toBe(true);\r\n      });\r\n\r\n      it('should return false when API call fails', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: false,\r\n          status: 401,\r\n          json: () => Promise.resolve({ error: { message: 'Invalid key' } })\r\n        });\r\n\r\n        const result = await testApiKey('sk-invalid-key');\r\n        expect(result).toBe(false);\r\n      });\r\n    });\r\n\r\n    describe('getCreditsBalance', () => {\r\n      it('should fetch credits from /api/v1/auth/key', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            data: { limit_remaining: 5.50 }\r\n          })\r\n        });\r\n\r\n        await getCreditsBalance('sk-test-key');\r\n\r\n        expect(mockFetch).toHaveBeenCalledWith(\r\n          'https://openrouter.ai/api/v1/auth/key',\r\n          expect.objectContaining({\r\n            method: 'GET',\r\n            headers: { 'Authorization': 'Bearer sk-test-key' }\r\n          })\r\n        );\r\n      });\r\n\r\n      it('should return balance and formatted balance', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            data: { limit_remaining: 5.50 }\r\n          })\r\n        });\r\n\r\n        const result = await getCreditsBalance('sk-test-key');\r\n\r\n        expect(result.balance).toBe(5.50);\r\n        expect(result.balanceFormatted).toBe('$5.50');\r\n      });\r\n\r\n      it('should handle zero balance', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            data: { limit_remaining: 0 }\r\n          })\r\n        });\r\n\r\n        const result = await getCreditsBalance('sk-test-key');\r\n\r\n        expect(result.balance).toBe(0);\r\n        expect(result.balanceFormatted).toBe('$0.00');\r\n      });\r\n\r\n      it('should return null on API failure', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: false,\r\n          status: 401\r\n        });\r\n\r\n        const result = await getCreditsBalance('sk-invalid-key');\r\n        expect(result).toBeNull();\r\n      });\r\n\r\n      it('should return null when limit_remaining is missing', async () => {\r\n        mockFetch.mockResolvedValueOnce({\r\n          ok: true,\r\n          json: () => Promise.resolve({\r\n            data: {}\r\n          })\r\n        });\r\n\r\n        const result = await getCreditsBalance('sk-test-key');\r\n        expect(result).toBeNull();\r\n      });\r\n\r\n      it('should return null on network error after retries', async () => {\r\n        // Network errors are retryable, getCreditsBalance has maxRetries: 2\r\n        mockFetch\r\n          .mockRejectedValueOnce(new Error('Network error'))\r\n          .mockRejectedValueOnce(new Error('Network error'));\r\n\r\n        const promise = getCreditsBalance('sk-test-key');\r\n\r\n        // Advance through retry delay (1s)\r\n        await vi.advanceTimersByTimeAsync(0);    // First attempt\r\n        await vi.advanceTimersByTimeAsync(1000); // First retry (2nd attempt)\r\n\r\n        const result = await promise;\r\n        expect(result).toBeNull();\r\n        expect(mockFetch).toHaveBeenCalledTimes(2);\r\n      });\r\n    });\r\n\r\n  });"},"src/components/RoomCodeInput.test.js":{"tests":[{"id":"239","name":"RoomCodeInput VALID_CHARS should not contain confusing characters"},{"id":"240","name":"RoomCodeInput VALID_CHARS should contain uppercase letters (except confusing ones)"},{"id":"241","name":"RoomCodeInput VALID_CHARS should contain numbers 2-9"},{"id":"242","name":"RoomCodeInput isValidRoomCode should return true for valid 6-character code"},{"id":"243","name":"RoomCodeInput isValidRoomCode should return false for code with invalid length"},{"id":"244","name":"RoomCodeInput isValidRoomCode should return false for code with invalid characters"},{"id":"245","name":"RoomCodeInput isValidRoomCode should handle lowercase input"},{"id":"246","name":"RoomCodeInput isValidRoomCode should return false for null or undefined"},{"id":"247","name":"RoomCodeInput createRoomCodeInput should create input element"},{"id":"248","name":"RoomCodeInput createRoomCodeInput should have maxlength of 6"},{"id":"249","name":"RoomCodeInput createRoomCodeInput should filter invalid characters on input"},{"id":"250","name":"RoomCodeInput createRoomCodeInput should convert to uppercase"},{"id":"251","name":"RoomCodeInput createRoomCodeInput should call onChange callback"},{"id":"252","name":"RoomCodeInput createRoomCodeInput should call onValidCode callback when code is complete"},{"id":"253","name":"RoomCodeInput createRoomCodeInput should not call onValidCode for incomplete code"},{"id":"254","name":"RoomCodeInput createRoomCodeInput should expose getValue method"},{"id":"255","name":"RoomCodeInput createRoomCodeInput should expose setValue method"},{"id":"256","name":"RoomCodeInput createRoomCodeInput should expose showError method"},{"id":"257","name":"RoomCodeInput createRoomCodeInput should expose clearError method"},{"id":"258","name":"RoomCodeInput createRoomCodeInput should handle paste event"}],"source":"/**\r\n * @vitest-environment jsdom\r\n */\r\nimport { describe, it, expect, vi, beforeEach, afterEach } from 'vitest';\r\nimport { createRoomCodeInput, isValidRoomCode, VALID_CHARS } from './RoomCodeInput.js';\r\n\r\n// Mock dependencies\r\nvi.mock('../core/i18n.js', () => ({\r\n  t: (key) => {\r\n    const translations = {\r\n      'party.enterCode': 'Enter room code',\r\n      'party.code': 'Room Code',\r\n    };\r\n    return translations[key] || key;\r\n  },\r\n}));\r\n\r\ndescribe('RoomCodeInput', () => {\r\n  beforeEach(() => {\r\n    vi.clearAllMocks();\r\n  });\r\n\r\n  describe('VALID_CHARS', () => {\r\n    it('should not contain confusing characters', () => {\r\n      expect(VALID_CHARS).not.toContain('0');\r\n      expect(VALID_CHARS).not.toContain('O');\r\n      expect(VALID_CHARS).not.toContain('1');\r\n      expect(VALID_CHARS).not.toContain('I');\r\n      expect(VALID_CHARS).not.toContain('L');\r\n    });\r\n\r\n    it('should contain uppercase letters (except confusing ones)', () => {\r\n      expect(VALID_CHARS).toContain('A');\r\n      expect(VALID_CHARS).toContain('B');\r\n      expect(VALID_CHARS).toContain('Z');\r\n    });\r\n\r\n    it('should contain numbers 2-9', () => {\r\n      expect(VALID_CHARS).toContain('2');\r\n      expect(VALID_CHARS).toContain('9');\r\n    });\r\n  });\r\n\r\n  describe('isValidRoomCode', () => {\r\n    it('should return true for valid 6-character code', () => {\r\n      expect(isValidRoomCode('ABCDEF')).toBe(true);\r\n      expect(isValidRoomCode('ABC234')).toBe(true);\r\n    });\r\n\r\n    it('should return false for code with invalid length', () => {\r\n      expect(isValidRoomCode('ABC')).toBe(false);\r\n      expect(isValidRoomCode('ABCDEFGH')).toBe(false);\r\n      expect(isValidRoomCode('')).toBe(false);\r\n    });\r\n\r\n    it('should return false for code with invalid characters', () => {\r\n      expect(isValidRoomCode('ABC0EF')).toBe(false); // Contains 0\r\n      expect(isValidRoomCode('ABCOEF')).toBe(false); // Contains O\r\n      expect(isValidRoomCode('ABC1EF')).toBe(false); // Contains 1\r\n      expect(isValidRoomCode('ABCIEF')).toBe(false); // Contains I\r\n      expect(isValidRoomCode('ABCLEF')).toBe(false); // Contains L\r\n    });\r\n\r\n    it('should handle lowercase input', () => {\r\n      expect(isValidRoomCode('abcdef')).toBe(true);\r\n      expect(isValidRoomCode('AbCdEf')).toBe(true);\r\n    });\r\n\r\n    it('should return false for null or undefined', () => {\r\n      expect(isValidRoomCode(null)).toBe(false);\r\n      expect(isValidRoomCode(undefined)).toBe(false);\r\n    });\r\n  });\r\n\r\n  describe('createRoomCodeInput', () => {\r\n    it('should create input element', () => {\r\n      const input = createRoomCodeInput();\r\n\r\n      expect(input).toBeInstanceOf(HTMLElement);\r\n      expect(input.querySelector('input')).not.toBeNull();\r\n    });\r\n\r\n    it('should have maxlength of 6', () => {\r\n      const container = createRoomCodeInput();\r\n      const input = container.querySelector('input');\r\n\r\n      expect(input.getAttribute('maxlength')).toBe('6');\r\n    });\r\n\r\n    it('should filter invalid characters on input', () => {\r\n      const container = createRoomCodeInput();\r\n      const input = container.querySelector('input');\r\n\r\n      input.value = 'abc0ef';\r\n      input.dispatchEvent(new Event('input'));\r\n\r\n      // Should filter out '0'\r\n      expect(input.value).toBe('ABCEF');\r\n    });\r\n\r\n    it('should convert to uppercase', () => {\r\n      const container = createRoomCodeInput();\r\n      const input = container.querySelector('input');\r\n\r\n      input.value = 'abcdef';\r\n      input.dispatchEvent(new Event('input'));\r\n\r\n      expect(input.value).toBe('ABCDEF');\r\n    });\r\n\r\n    it('should call onChange callback', () => {\r\n      const onChange = vi.fn();\r\n      const container = createRoomCodeInput({ onChange });\r\n      const input = container.querySelector('input');\r\n\r\n      input.value = 'ABC';\r\n      input.dispatchEvent(new Event('input'));\r\n\r\n      expect(onChange).toHaveBeenCalledWith('ABC');\r\n    });\r\n\r\n    it('should call onValidCode callback when code is complete', () => {\r\n      const onValidCode = vi.fn();\r\n      const container = createRoomCodeInput({ onValidCode });\r\n      const input = container.querySelector('input');\r\n\r\n      input.value = 'ABCDEF';\r\n      input.dispatchEvent(new Event('input'));\r\n\r\n      expect(onValidCode).toHaveBeenCalledWith('ABCDEF');\r\n    });\r\n\r\n    it('should not call onValidCode for incomplete code', () => {\r\n      const onValidCode = vi.fn();\r\n      const container = createRoomCodeInput({ onValidCode });\r\n      const input = container.querySelector('input');\r\n\r\n      input.value = 'ABC';\r\n      input.dispatchEvent(new Event('input'));\r\n\r\n      expect(onValidCode).not.toHaveBeenCalled();\r\n    });\r\n\r\n    it('should expose getValue method', () => {\r\n      const container = createRoomCodeInput();\r\n      const input = container.querySelector('input');\r\n\r\n      input.value = 'ABCDEF';\r\n      input.dispatchEvent(new Event('input'));\r\n\r\n      expect(container.getValue()).toBe('ABCDEF');\r\n    });\r\n\r\n    it('should expose setValue method', () => {\r\n      const container = createRoomCodeInput();\r\n\r\n      container.setValue('ABCDEF');\r\n\r\n      expect(container.getValue()).toBe('ABCDEF');\r\n    });\r\n\r\n    it('should expose showError method', () => {\r\n      const container = createRoomCodeInput();\r\n\r\n      container.showError('Invalid code');\r\n\r\n      const errorElement = container.querySelector('[data-testid=\"input-error\"]');\r\n      expect(errorElement).not.toBeNull();\r\n      expect(errorElement.textContent).toContain('Invalid code');\r\n    });\r\n\r\n    it('should expose clearError method', () => {\r\n      const container = createRoomCodeInput();\r\n\r\n      container.showError('Invalid code');\r\n      container.clearError();\r\n\r\n      const errorElement = container.querySelector('[data-testid=\"input-error\"]');\r\n      expect(errorElement).toBeNull();\r\n    });\r\n\r\n    it('should handle paste event', () => {\r\n      const container = createRoomCodeInput();\r\n      const input = container.querySelector('input');\r\n\r\n      // Simulate paste with filtered content\r\n      const pasteEvent = new Event('paste');\r\n      pasteEvent.clipboardData = {\r\n        getData: () => 'ABC-DEF',\r\n      };\r\n\r\n      // Manually trigger paste handling\r\n      input.value = 'ABCDEF'; // Simulate paste result after filtering\r\n      input.dispatchEvent(new Event('input'));\r\n\r\n      expect(input.value).toBe('ABCDEF');\r\n    });\r\n  });\r\n});\r\n"},"src/components/ConnectionModeIndicator.test.js":{"tests":[{"id":"259","name":"ConnectionModeIndicator createConnectionModeIndicator creates an element with the correct ID"},{"id":"260","name":"ConnectionModeIndicator createConnectionModeIndicator applies correct styling for P2P mode"},{"id":"261","name":"ConnectionModeIndicator createConnectionModeIndicator applies correct styling for HTTP fallback mode"},{"id":"262","name":"ConnectionModeIndicator createConnectionModeIndicator applies correct styling for connecting mode"},{"id":"263","name":"ConnectionModeIndicator createConnectionModeIndicator defaults to connecting mode when no mode provided"},{"id":"264","name":"ConnectionModeIndicator updateConnectionModeIndicator updates existing element to new mode"},{"id":"265","name":"ConnectionModeIndicator updateConnectionModeIndicator handles null indicator gracefully"},{"id":"266","name":"ConnectionModeIndicator updateConnectionModeIndicator handles invalid mode gracefully"}],"source":"  import { describe, it, expect } from 'vitest';\r\n  import {\r\n    createConnectionModeIndicator,\r\n    updateConnectionModeIndicator,\r\n    MODE_CONFIG,\r\n  } from './ConnectionModeIndicator.js';\r\n  import { CONNECTION_MODES } from '../services/party-connection-manager.js';\r\n\r\n  describe('ConnectionModeIndicator', () => {\r\n    describe('createConnectionModeIndicator', () => {\r\n      it('creates an element with the correct ID', () => {\r\n        const indicator = createConnectionModeIndicator(CONNECTION_MODES.CONNECTING);\r\n        expect(indicator.id).toBe('connectionModeIndicator');\r\n      });\r\n\r\n      it('applies correct styling for P2P mode', () => {\r\n        const indicator = createConnectionModeIndicator(CONNECTION_MODES.P2P);\r\n        expect(indicator.className).toContain(MODE_CONFIG[CONNECTION_MODES.P2P].bgClass);\r\n      });\r\n\r\n      it('applies correct styling for HTTP fallback mode', () => {      \r\n        const indicator = createConnectionModeIndicator(CONNECTION_MODES.HTTP_FALLBACK);\r\n        expect(indicator.className).toContain(MODE_CONFIG[CONNECTION_MODES.HTTP_FALLBACK].bgClass);\r\n      });\r\n\r\n      it('applies correct styling for connecting mode', () => {\r\n        const indicator = createConnectionModeIndicator(CONNECTION_MODES.CONNECTING);\r\n        expect(indicator.className).toContain(MODE_CONFIG[CONNECTION_MODES.CONNECTING].bgClass);\r\n      });\r\n\r\n      it('defaults to connecting mode when no mode provided', () => {   \r\n        const indicator = createConnectionModeIndicator();\r\n        expect(indicator.className).toContain(MODE_CONFIG[CONNECTION_MODES.CONNECTING].bgClass);\r\n      });\r\n    });\r\n\r\n    describe('updateConnectionModeIndicator', () => {\r\n      it('updates existing element to new mode', () => {\r\n        const indicator = createConnectionModeIndicator(CONNECTION_MODES.CONNECTING);\r\n        expect(indicator.className).toContain(MODE_CONFIG[CONNECTION_MODES.CONNECTING].bgClass);\r\n\r\n        updateConnectionModeIndicator(indicator, CONNECTION_MODES.P2P); \r\n        expect(indicator.className).toContain(MODE_CONFIG[CONNECTION_MODES.P2P].bgClass);\r\n        expect(indicator.className).not.toContain(MODE_CONFIG[CONNECTION_MODES.CONNECTING].bgClass);\r\n      });\r\n\r\n      it('handles null indicator gracefully', () => {\r\n        expect(() => updateConnectionModeIndicator(null, CONNECTION_MODES.P2P)).not.toThrow();\r\n      });\r\n\r\n      it('handles invalid mode gracefully', () => {\r\n        const indicator = createConnectionModeIndicator(CONNECTION_MODES.P2P);\r\n        expect(() => updateConnectionModeIndicator(indicator, 'invalid-mode')).not.toThrow();\r\n      });\r\n    });\r\n  });"},"src/api/api.real.test.js":{"tests":[{"id":"267","name":"generateQuestions prompt should include guidance for distinct answer options"},{"id":"268","name":"generateQuestions prompt should include previous questions in prompt when provided"},{"id":"269","name":"generateQuestions prompt should not include exclusion section when no previous questions"},{"id":"270","name":"generateQuestions prompt should use default questionCount of 5 in prompt"},{"id":"271","name":"generateQuestions prompt should use custom questionCount in prompt"},{"id":"272","name":"generateQuestions prompt should validate response has correct number of questions"},{"id":"273","name":"generateQuestions prompt should accept response with matching questionCount"},{"id":"274","name":"generateExplanation JSON parsing should parse clean JSON response"},{"id":"275","name":"generateExplanation JSON parsing should parse JSON wrapped in markdown code block"},{"id":"276","name":"generateExplanation JSON parsing should parse JSON with leading/trailing whitespace"},{"id":"277","name":"generateExplanation JSON parsing should parse JSON with smart quotes by normalizing them"},{"id":"278","name":"generateExplanation JSON parsing should parse JSON with extra text before it"},{"id":"279","name":"generateExplanation JSON parsing should parse JSON with extra text after it"},{"id":"280","name":"generateExplanation JSON parsing should handle JSON with BOM character"},{"id":"281","name":"generateQuestions retry logic should succeed on first attempt when response is valid"},{"id":"282","name":"generateQuestions retry logic should retry with stricter prompt on parse failure"},{"id":"283","name":"generateQuestions retry logic should retry on schema validation failure"},{"id":"284","name":"generateQuestions retry logic should NOT retry on rate limit error"},{"id":"285","name":"generateQuestions retry logic should NOT retry on authentication error"},{"id":"286","name":"generateQuestions retry logic should fail after max retry attempts"},{"id":"287","name":"generateQuestions retry logic should handle DeepSeek thinking tags
