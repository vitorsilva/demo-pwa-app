<!--
  Feature Card Template for Landing Page

  Usage:
  1. Copy this template
  2. Replace [PLACEHOLDERS] with actual content
  3. Insert into features-grid section of landing/index.html (~line 700)

  Guidelines:
  - Keep description to 1-2 sentences
  - Use emoji that matches feature theme
  - Ensure text fits on mobile (test at 375px width)
-->

<div class="feature-card">
    <div class="feature-icon">[EMOJI]</div>
    <h3>[Feature Name]</h3>
    <p>[Brief description of the feature benefit to users. Keep it concise.]</p>
</div>
